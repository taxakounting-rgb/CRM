  },
  showLock() {
    const u = Auth.user; if (!u) return this.showLogin();
    Modal.closeAll();
    $('#app').innerHTML = String(html`<div class="lock-wrap"><div class="auth-card lock-card"><div class="lock-logo">${brandLogo()}</div>${avatar(u.name, (DB.member(u.memberId) || {}).photo, 64)}<h2>${u.name}</h2><p class="muted">${icon('lock')} Screen locked. Enter your password to continue.</p><form id="lk" novalidate><div class="pw-wrap"><input name="p" type="password" autocomplete="current-password" aria-label="Password" required autofocus><button type="button" class="icon-btn" data-pw-eye aria-label="Show password">${icon('eye')}</button></div><p class="err" data-e role="alert"></p><button class="btn primary block lg">Unlock</button></form><button type="button" class="btn ghost block" data-out>Sign in as a different user</button></div></div>`);
    this.bindAuthCommon();
    let tries = 0;
    $('[data-out]').onclick = () => { Auth.locked = false; Auth.logout('signed out from lock screen'); };
    $('#lk').onsubmit = async (e) => {
      e.preventDefault();
      if (await Auth.checkPassword(u, $('#lk').p.value)) { Auth.unlocked(); this.enter(); return; }

/* ---------- Keyboard shortcuts: Ctrl+K or / = search, N = new, Esc = close ---------- */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (!Auth.user || Auth.locked)) { Modal.closeTop(); return; }
  if (!Auth.user || Auth.locked) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); Palette.open(); return; }
  if (e.key === 'Escape') { if ($('.udrop')) { $('.udrop').remove(); return; } if (Modal.closeTop()) { e.preventDefault(); return; } document.body.classList.remove('nav-open'); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || Modal.stack.length) return;
  if (e.key === '/') { e.preventDefault(); Palette.open(); }
  else if (e.key.toLowerCase() === 'n') { const v = Views[Router.cur.name]; if (v && v.onNew) { e.preventDefault(); v.onNew(); } }
});

/* ==========================================================================
   05-common.js — shared record helpers: delete with Undo, client timeline,
   message templates with placeholders, WhatsApp / email / call contact.
   ========================================================================== */
const Rec = {
  /* Removes item from collection, shows 5 s Undo toast, audit-logs. */
  remove(coll, item, label, module, after) {
    const arr = Store.s[coll]; const idx = arr.indexOf(item); if (idx < 0) return;
    Store.commit((s) => { s[coll].splice(idx, 1); });
    Auth.audit('delete', module, `Deleted ${label}`, { recordId: item.id, old: item });
    if (after) after(item);
    toast(`${label} deleted`, 'ok', {
      undo: () => {
        Store.commit((s) => { s[coll].splice(Math.min(idx, s[coll].length), 0, item); });
        Auth.audit('restore', module, `Undo delete: ${label}`, { recordId: item.id });
        toast('Restored');
      }
    });
  },
  stamp(o, isNew) { const now = new Date().toISOString(); if (isNew) { o.createdAt = now; o.createdBy = Auth.user ? Auth.user.username : 'system'; } o.updatedAt = now; return o; }
};

const Timeline = {
  add(clientId, type, text, at) {
    if (!clientId) return;
    Store.s.timeline.unshift({ id: uid('tl'), clientId, type, text, at: at || new Date().toISOString(), by: Auth.user ? Auth.user.name : 'System' });
    if (Store.s.timeline.length > 20000) Store.s.timeline.length = 20000;
  },
  of(clientId) { return Store.s.timeline.filter((t) => t.clientId === clientId); },
  ICON: { created: 'clients', service: 'services', task: 'tasks', invoice: 'invoices', payment: 'invoices', document: 'documents', note: 'edit', followup: 'calendar', credential: 'vault', status: 'check' }
};

const Tpl = {
  fill(text, ctx = {}) {
    const c = Store.s.settings.company || {};
    const map = Object.assign({ company: c.name || '', phone: c.phone || '', website: c.website || '' }, ctx);
    return String(text || '').replace(/\{(\w+)\}/g, (m, k) => (map[k] !== undefined && map[k] !== null ? map[k] : m));
  },
  ctxFor(client, task) {
    return { client: client ? client.name : '', code: client ? client.code : '', task: task ? task.title : '', due: task ? fmtDate(task.due) : '', officer: client ? DB.memberName(client.assignedTo) : '' };
  }
};

const Contact = {
  waNumber(m) { const d = String(m || '').replace(/\D/g, ''); if (!d) return ''; const dial = String(((Store.s.settings.company || {}).dialCode) || '').replace(/\D/g, ''); if (String(m).trim().startsWith('+')) return d; if (d.startsWith('00')) return d.slice(2); if (d.startsWith('0') && dial) return dial + d.slice(1); return d; },
  /* Opens a composer that fills a template and launches wa.me or mailto. */
  compose(channel, client, task) {
    const tpls = (Store.s.settings.templates || []).filter((t) => t.channel === channel);
    const ctx = Tpl.ctxFor(client, task);
    const target = channel === 'whatsapp' ? (client.whatsapp || client.mobile) : client.email;
    if (!target) { toast(channel === 'whatsapp' ? 'This client has no WhatsApp / mobile number.' : 'This client has no email address.', 'warn'); return; }
    const first = tpls[0] || { subject: '', body: 'Dear {client},\n\n' };
    Modal.open({
      title: channel === 'whatsapp' ? 'Send WhatsApp message' : 'Send email', size: 'md',
      body: html`<p class="muted sm">To: <b>${client.name}</b> · ${target}</p>
        <label class="fld"><span>Template</span><select data-tpl>${tpls.map((t, i) => html`<option value="${i}">${t.name}</option>`)}<option value="-1">Blank message</option></select></label>
        ${channel === 'email' ? html`<label class="fld"><span>Subject</span><input data-subj value="${Tpl.fill(first.subject, ctx)}"></label>` : ''}
        <label class="fld"><span>Message</span><textarea rows="7" data-body>${Tpl.fill(first.body, ctx)}</textarea></label>
        <p class="help">Placeholders such as {client}, {task}, {due} are filled automatically. Edit templates in Settings › Templates.</p>`,
      foot: html`<button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn primary" data-send>${channel === 'whatsapp' ? icon('wa') : icon('mail')}<span>${channel === 'whatsapp' ? 'Open WhatsApp' : 'Open email app'}</span></button>`,
      onMount: (el, m) => {
        el.querySelector('[data-tpl]').onchange = (e) => { const t = tpls[+e.target.value] || { subject: '', body: '' }; el.querySelector('[data-body]').value = Tpl.fill(t.body, ctx); const s = el.querySelector('[data-subj]'); if (s) s.value = Tpl.fill(t.subject, ctx); };
        el.querySelector('[data-send]').onclick = () => {
          const body = el.querySelector('[data-body]').value;
          if (channel === 'whatsapp') window.open('https://wa.me/' + this.waNumber(target) + '?text=' + encodeURIComponent(body), '_blank', 'noopener');
          else location.href = 'mailto:' + encodeURIComponent(target) + '?subject=' + encodeURIComponent(el.querySelector('[data-subj]').value) + '&body=' + encodeURIComponent(body);
          Store.commit(() => Timeline.add(client.id, 'note', `${channel === 'whatsapp' ? 'WhatsApp' : 'Email'} message sent`));
          m.close();
        };
      }
    });
  }
};

/* Simple CSV parser (quotes, commas, newlines) */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim() !== ''));
}

const Clients = {
  fields(c = {}) {
    return [
      { type: 'section', label: 'Client details' },
      { name: 'name', label: 'Client name', required: true, placeholder: 'e.g. John Smith or Acme Ltd' },

      { name: 'ntn', label: 'Tax / VAT no.', type: 'ntn' },
      { name: 'mobile', label: 'Mobile', type: 'mobile', required: true },
      { name: 'whatsapp', label: 'WhatsApp', type: 'mobile', help: 'Leave blank to use mobile' },
      { name: 'email', label: 'Email', type: 'email' },
      { name: 'regDate', label: 'Registration date', type: 'date' },
      { name: 'address', label: 'Address', type: 'textarea', full: true, rows: 2 },
      { type: 'section', label: 'Company & assignment' },
      { name: 'businessName', label: 'Company name' },
      { name: 'businessType', label: 'Client type', type: 'select', list: 'businessTypes' },
      { name: 'status', label: 'Status', type: 'select', list: 'clientStatuses', required: true },
      { name: 'branch', label: 'Branch', type: 'select', list: 'branches' },
      { name: 'assignedTo', label: 'Assigned to', type: 'select', options: memberOpts, required: Auth.assignedOnly() },
      { name: 'tags', label: 'Tags', type: 'multi', list: 'tags', full: true }
    ];
  },
  /* Duplicate check on ID / Reg. no. / Tax No / mobile across all clients (not only visible ones). */
  dupErrors(v, selfId) {
    const errs = {}; const norm = (x) => String(x || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    [['cnic', 'ID / Reg. no.'], ['ntn', 'Tax / VAT no.'], ['mobile', 'phone']].forEach(([k, lbl]) => {
      if (!v[k]) return;
      const d = Store.s.clients.find((c) => c.id !== selfId && norm(c[k]) && norm(c[k]) === norm(v[k]));
      if (d) errs[k] = `Duplicate ${lbl}: already used by ${d.code} · ${d.name}`;
    });
    return errs;
  },
  open(c) {
    const isNew = !c;
    if (isNew && !License.allow('clients')) return;
    const vals = c ? clone(c) : { status: Lists.idByName('clientStatuses', 'Active') || (Lists.all('clientStatuses')[0] || {}).id, regDate: today(), branch: (Lists.all('branches')[0] || {}).id, assignedTo: Auth.assignedOnly() ? Auth.memberId() : '' };
    formModal({
      title: isNew ? 'New client' : `Edit client ${c.code}`, size: 'lg', fields: this.fields(c), values: vals,
      intro: isNew ? html`<p class="muted sm">Customer code is generated automatically from the first letter of the name (e.g. Ali → A1).</p>` : '',
      onSubmit: (v) => {
        const dup = this.dupErrors(v, c && c.id); if (Object.keys(dup).length) return dup;
        if (Auth.assignedOnly() && v.assignedTo !== Auth.memberId()) return { assignedTo: 'You can only assign clients to yourself.' };
        if (isNew) {
          const rec = Rec.stamp(Object.assign({ id: uid('c'), archived: false }, v), true);
          Store.commit((s) => { rec.code = Store.clientCode(v.name); s.clients.push(rec); Timeline.add(rec.id, 'created', `Client created with code ${rec.code}`); });
          Auth.audit('create', 'clients', `Created client ${rec.code} ${rec.name}`, { recordId: rec.id, new: v });
          toast(`Client ${rec.code} created`);
          if (rec.assignedTo) Notify.toMember(rec.assignedTo, 'assignment', 'New client assigned', `${rec.code} · ${rec.name} has been assigned to you.`, '#/clients/' + rec.code);
        } else {
          const d = Auth.diff(c, v);
          const reassigned = v.assignedTo !== c.assignedTo;
          Store.commit(() => { if (v.status !== c.status) Timeline.add(c.id, 'status', `Status changed to ${Lists.name('clientStatuses', v.status)}`); Object.assign(c, v); Rec.stamp(c); });
          Auth.audit('edit', 'clients', `Edited client ${c.code}`, { recordId: c.id, old: d.old, new: d.new });
          if (reassigned && v.assignedTo) Notify.toMember(v.assignedTo, 'assignment', 'Client assigned to you', `${c.code} · ${c.name}`, '#/clients/' + c.code);
          toast('Client updated');
        }
      }
    });
  },
  async del(c) {
    const linked = Store.s.tasks.filter((t) => t.clientId === c.id).length + Store.s.invoices.filter((i) => i.clientId === c.id).length;
    if (!(await confirmDlg(html`Delete client <b>${c.code} · ${c.name}</b>?${linked ? html`<br><br><span class="warn-txt">This client has ${linked} linked tasks/invoices. They will remain but show as "unknown client". Consider archiving instead.</span>` : ''}`, { danger: true, ok: 'Delete' }))) return;
    Rec.remove('clients', c, `Client ${c.code}`, 'clients');
    if (Router.cur.params[0]) location.hash = '#/clients';
  },
  archive(c, on) {
    Store.commit(() => { c.archived = on; Timeline.add(c.id, 'status', on ? 'Client archived' : 'Client restored from archive'); });
    Auth.audit('edit', 'clients', `${on ? 'Archived' : 'Unarchived'} client ${c.code}`, { recordId: c.id, old: { archived: !on }, new: { archived: on } });
    toast(on ? 'Client archived' : 'Client restored');
  },
  filtered() {
    const f = vs('clients');
    return Auth.clients(true).filter((c) => (f.archived ? c.archived : !c.archived)
      && textMatch(f.q, c.name, c.code, c.cnic, c.ntn, c.mobile, c.email, c.businessName, c.father)
      && (!f.status || c.status === f.status) && (!f.type || c.businessType === f.type) && (!f.branch || c.branch === f.branch)
      && (!f.officer || c.assignedTo === f.officer) && (!f.tag || (c.tags || []).includes(f.tag)) && inRange(c.regDate, f.from, f.to));
  },
  cols() {
    return [
      { key: 'code', label: 'Code', get: (c) => c.code[0] + pad(c.code.slice(1), 6), render: (c) => html`<a href="#/clients/${c.code}" class="code">${c.code}</a>` },
      { key: 'name', label: 'Client', render: (c) => html`<a href="#/clients/${c.code}" class="strong">${c.name}</a>${c.businessName ? html`<br><small class="muted">${c.businessName}</small>` : ''}` },
      { key: 'cnic', label: 'ID / Tax no.', render: (c) => html`${c.cnic || '—'}<br><small class="muted">${c.ntn || ''}</small>` },
      { key: 'mobile', label: 'Mobile' },
      { key: 'businessType', label: 'Type', get: (c) => Lists.name('businessTypes', c.businessType), render: (c) => Lists.name('businessTypes', c.businessType) },
      { key: 'assignedTo', label: 'Assigned to', get: (c) => DB.memberName(c.assignedTo), render: (c) => DB.memberName(c.assignedTo) },
      { key: 'status', label: 'Status', get: (c) => Lists.name('clientStatuses', c.status), render: (c) => html`${listBadge('clientStatuses', c.status)}${c.archived ? badge('Archived', 'grey') : ''}` },
      { key: 'act', label: '', sort: false, cls: 'act', render: (c) => this.rowActions(c) }
    ];
  },
  rowActions(c) {
    return html`<div class="row-acts">${c.mobile ? html`<a class="icon-btn sm" href="tel:${c.mobile.replace(/-/g, '')}" title="Call" aria-label="Call">${icon('phone')}</a>` : ''}${btn('', 'client:wa', { id: c.id, icon: 'wa', cls: 'icon-btn sm wa', title: 'WhatsApp' })}${Auth.can('clients', 'edit') ? btn('', 'client:edit', { id: c.id, icon: 'edit', cls: 'icon-btn sm', title: 'Edit' }) : ''}</div>`;
  },
  card(c) {
    const open = Auth.tasks().filter((t) => t.clientId === c.id && !Lists.isDone(t.status)).length;
    return html`<div class="card ccard"><div class="ccard-h">${avatar(c.name, '', 42)}<div><a href="#/clients/${c.code}" class="strong">${c.name}</a><div class="muted sm"><span class="code">${c.code}</span> · ${Lists.name('businessTypes', c.businessType)}</div></div>${listBadge('clientStatuses', c.status)}</div>
      <div class="ccard-b sm"><div>${icon('phone')} ${c.mobile || '—'}</div><div>${icon('mail')} ${c.email || '—'}</div><div>${icon('user')} ${DB.memberName(c.assignedTo)}</div><div>${icon('tasks')} ${open} open tasks</div></div>
      <div class="ccard-f">${(c.tags || []).map((t) => listBadge('tags', t))}<span class="grow"></span>${this.rowActions(c)}</div></div>`;
  },
  exportRows(rows) {
    const H = ['Code', 'Name', 'Contact Person', 'ID / Reg. no.', 'Tax / VAT no.', 'Mobile', 'WhatsApp', 'Email', 'Address', 'Company Name', 'Client Type', 'Registration Date', 'Status', 'Branch', 'Assigned To', 'Tags'];
    return [H, rows.map((c) => [c.code, c.name, c.father, c.cnic, c.ntn, c.mobile, c.whatsapp, c.email, c.address, c.businessName, Lists.name('businessTypes', c.businessType), c.regDate, Lists.name('clientStatuses', c.status), Lists.name('branches', c.branch), DB.memberName(c.assignedTo), (c.tags || []).map((t) => Lists.name('tags', t)).join('; ')])];
  }
};

/* ---------- CSV import with column mapping + duplicate preview ---------- */
act('client:import', () => {
  if (!License.need('csv_import')) return;
  const targets = [['name', 'Name *'], ['father', 'Contact Person'], ['cnic', 'ID / Reg. no.'], ['ntn', 'Tax / VAT no.'], ['mobile', 'Mobile'], ['whatsapp', 'WhatsApp'], ['email', 'Email'], ['address', 'Address'], ['businessName', 'Company Name'], ['businessType', 'Client Type'], ['regDate', 'Registration Date'], ['status', 'Status'], ['branch', 'Branch'], ['assignedTo', 'Assigned To']];
  Modal.open({
    title: 'Import clients from CSV', size: 'lg',
    body: html`<div data-step1><p>Choose a CSV file. The first row must contain column headers. You can map the columns in the next step.</p><input type="file" accept=".csv,text/csv" data-file><p class="help">Tip: export the client list first to get a ready-made template.</p>${btn('Download template', 'client:import-tpl', { cls: 'sm ghost', icon: 'download' })}</div><div data-step2 hidden></div>`,
    foot: html`<button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn primary" data-go disabled>Import</button>`,
    onMount: (el, m) => {
      let rows = [], head = [], map = {};
      const norm = (s) => String(s).toLowerCase().replace(/[^a-z]/g, '');
      const preview = () => {
        const recs = rows.map((r) => { const o = {}; Object.entries(map).forEach(([k, i]) => { if (i !== '') o[k] = (r[+i] || '').trim(); }); return o; });
        const seen = new Set();
        const checked = recs.map((o) => {
          if (o.cnic) o.cnic = Masks.cnic(o.cnic); if (o.mobile) o.mobile = Masks.mobile(o.mobile); if (o.whatsapp) o.whatsapp = Masks.mobile(o.whatsapp); if (o.ntn) o.ntn = Masks.ntn(o.ntn);
          let issue = !o.name ? 'Missing name' : '';
          const dup = Clients.dupErrors(o); if (!issue && Object.keys(dup).length) issue = Object.values(dup)[0];
          const k = [o.cnic, o.mobile].filter(Boolean).join('|'); if (!issue && k && seen.has(k)) issue = 'Duplicate inside file'; if (k) seen.add(k);
          if (!issue) { const v = Valid.cnic(o.cnic) || Valid.mobile(o.mobile) || Valid.email(o.email); if (v) issue = 'Warning: ' + v; }
          return { o, issue };
        });
        el._recs = checked;
        const ok = checked.filter((x) => !x.issue || x.issue.startsWith('Warning')).length;
        el.querySelector('[data-prev]').innerHTML = String(html`<p><b>${ok}</b> of ${checked.length} rows will be imported. Rows with duplicates or missing names are skipped.</p><div class="tbl-wrap" style="max-height:260px"><table class="tbl"><thead><tr><th>#</th><th>Name</th><th>ID / Reg. no.</th><th>Mobile</th><th>Check</th></tr></thead><tbody>${checked.slice(0, 200).map((x, i) => html`<tr class="${x.issue && !x.issue.startsWith('Warning') ? 'row-bad' : ''}"><td>${i + 1}</td><td>${x.o.name || ''}</td><td>${x.o.cnic || ''}</td><td>${x.o.mobile || ''}</td><td>${x.issue ? badge(x.issue, x.issue.startsWith('Warning') ? 'amber' : 'red') : badge('OK', 'green')}</td></tr>`)}</tbody></table></div>`);
        el.querySelector('[data-go]').disabled = !ok;
      };
      el.querySelector('[data-file]').onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        const all = parseCSV(await f.text()); if (all.length < 2) { toast('The file has no data rows', 'warn'); return; }
        head = all[0]; rows = all.slice(1);
        targets.forEach(([k, l]) => { const i = head.findIndex((h) => norm(h) === norm(k) || norm(h) === norm(l) || (k === 'name' && norm(h) === 'clientname') || (k === 'father' && norm(h).startsWith('father')) || (k === 'assignedTo' && norm(h).includes('officer'))); map[k] = i >= 0 ? String(i) : ''; });
        const s2 = el.querySelector('[data-step2]'); s2.hidden = false;
        s2.innerHTML = String(html`<h4>Map columns (${rows.length} rows found)</h4><div class="map-grid">${targets.map(([k, l]) => html`<label class="fld"><span>${l}</span><select data-map="${k}"><option value="">— skip —</option>${head.map((h, i) => html`<option value="${i}" ${map[k] === String(i) ? raw('selected') : ''}>${h}</option>`)}</select></label>`)}</div><div data-prev></div>`);
        $$('[data-map]', s2).forEach((s) => s.onchange = () => { map[s.dataset.map] = s.value; preview(); });
        preview();
      };
      el.querySelector('[data-go]').onclick = () => {
        let good = (el._recs || []).filter((x) => !x.issue || x.issue.startsWith('Warning'));
        const lim = License.limit('clients'); if (lim) { const room = Math.max(0, lim - License.usage().clients); if (good.length > room) { toast(`Your plan allows ${lim} clients. Only ${room} more can be imported.`, 'warn', { timeout: 6000 }); good = good.slice(0, room); } if (!good.length) return; }
        const defStatus = Lists.idByName('clientStatuses', 'Active') || (Lists.all('clientStatuses')[0] || {}).id;
        Store.commit((s) => good.forEach(({ o }) => {

/* ==========================================================================
   07-vault.js — Credentials Vault. Every service can have its own credential
   TYPE (e.g. Taxation: User ID / Email + Password + PIN; Digital Marketing:

   (Credentials Vault > Credential types), not code. Secret fields (password /
   PIN) are AES-GCM encrypted with a key derived (PBKDF2, 250k iterations,
   per-vault salt) from the Vault PIN. Reveal/copy require the PIN every time,
   auto-hide after 15 s, audit-logged.
   ========================================================================== */
const CRED_KINDS = { text: 'Text', email: 'Email', url: 'Link / URL', secret: 'Password (encrypted)', pin: 'PIN (encrypted)' };
const isSecretKind = (k) => k === 'secret' || k === 'pin';
/* Starter types. Fully editable / deletable by the owner. */
const DEFAULT_CRED_TYPES = [

  { id: 'ct_login', name: 'General Login', service: '', url: '', fields: [
    { id: 'f1', label: 'Username / Login ID', kind: 'text', required: true }, { id: 'f2', label: 'Password', kind: 'secret', required: true } ] }
];
/* Old (pre-types) credentials carried a Portal list value; map them to a starter type. */
const LEGACY_PORTAL_TYPE = { 'email account': 'ct_email', 'website / hosting': 'ct_web', 'bank portal': 'ct_bank', 'social media': 'ct_social', 'government portal': 'ct_tax' };

const Vault = {
  ITER: 250000,
  timers: {},
  fails: 0, blockedUntil: 0,
  ready() { const v = Store.s.settings.vault; return !!(v && v.salt && v.check); },
  async keyFromPin(pin) {
    const v = Store.s.settings.vault;
    const key = await Crypto.deriveVaultKey(pin, v.salt, v.iter || this.ITER);
    await Crypto.decrypt(key, v.check); // throws if PIN is wrong
    return key;
  },
  /* Ask for the PIN; resolves to a CryptoKey or null. */
  async askKey(reason) {
    if (!this.ready()) { await this.setupPin(); if (!this.ready()) return null; }
    if (Date.now() < this.blockedUntil) { toast(`Too many wrong PIN attempts. Try again in ${Math.ceil((this.blockedUntil - Date.now()) / 1000)} s.`, 'err'); return null; }
    let key = null;
    const pin = await promptDlg('Vault PIN required', reason || 'Enter the Vault PIN', {
      type: 'password', inputmode: 'numeric', ok: 'Unlock',
      validate: async (p) => {
        if (Date.now() < this.blockedUntil) return 'Vault temporarily blocked. Please wait.';
        try { key = await this.keyFromPin(p); this.fails = 0; return ''; }
        catch (e) {
          this.fails++; Auth.audit('vault_pin_failed', 'vault', 'Wrong Vault PIN entered');
          if (this.fails >= 5) { this.blockedUntil = Date.now() + 120000; this.fails = 0; return 'Too many wrong attempts. Vault blocked for 2 minutes.'; }
          return 'Incorrect Vault PIN.';
        }
      }
    });
    return pin === null ? null : key;
  },
  async setupPin() {
    if (!Auth.can('vault', 'create') && !Auth.can('settings', 'edit')) { toast('The vault has not been set up yet. Ask an administrator to set the Vault PIN.', 'warn'); return; }
    await new Promise((res) => formModal({
      title: 'Set up the Vault PIN', size: 'sm', submit: 'Create vault',
      intro: html`<p>The Vault PIN encrypts all portal passwords (AES-256-GCM). It is <b>never stored</b> — if it is lost, saved passwords cannot be recovered. Share it only with authorised staff.</p>`,
      fields: [{ name: 'p1', label: 'New Vault PIN (6+ digits/characters)', type: 'password', required: true, validate: (v) => v.length < 6 ? 'Use at least 6 characters' : '' }, { name: 'p2', label: 'Confirm PIN', type: 'password', required: true, validate: (v, all) => v !== all.p1 ? 'PINs do not match' : '' }],
      onSubmit: async (v) => {
        const salt = Crypto.newSalt(); const key = await Crypto.deriveVaultKey(v.p1, salt, this.ITER);
        const check = await Crypto.encrypt(key, 'TAK-VAULT-OK');
        Store.commit((s) => { s.settings.vault = { salt, iter: this.ITER, check, createdAt: new Date().toISOString() }; });
        Auth.audit('vault_setup', 'vault', 'Vault PIN created'); toast('Vault ready');
      }
    }).onClose = res);
  },
  async changePin() {
    const oldKey = await this.askKey('Enter the CURRENT Vault PIN'); if (!oldKey) return;
    formModal({
      title: 'Change Vault PIN', size: 'sm', submit: 'Re-encrypt & save',
      fields: [{ name: 'p1', label: 'New Vault PIN', type: 'password', required: true, validate: (v) => v.length < 6 ? 'Use at least 6 characters' : '' }, { name: 'p2', label: 'Confirm new PIN', type: 'password', required: true, validate: (v, all) => v !== all.p1 ? 'PINs do not match' : '' }],
      onSubmit: async (v) => {
        const salt = Crypto.newSalt(); const nk = await Crypto.deriveVaultKey(v.p1, salt, this.ITER);
        const jobs = [];
        for (const c of Store.s.creds) {
          if (c.secret) jobs.push([c, 'secret', c.secret]);
          if (c.extra) jobs.push([c, 'extra', c.extra]);
          Object.entries(c.secrets || {}).forEach(([k, b]) => jobs.push([c, 's:' + k, b]));
        }
        const out = [];
        for (const [c, slot, b] of jobs) out.push([c, slot, await Crypto.encrypt(nk, await Crypto.decrypt(oldKey, b))]);
        const check = await Crypto.encrypt(nk, 'TAK-VAULT-OK');
        Store.commit((s) => {
          out.forEach(([c, slot, val]) => { if (slot === 'secret') c.secret = val; else if (slot === 'extra') c.extra = val; else c.secrets[slot.slice(2)] = val; });
          s.settings.vault = { salt, iter: this.ITER, check, createdAt: new Date().toISOString() };
        });
        Auth.audit('vault_pin_change', 'vault', `Vault PIN changed; ${out.length} secrets re-encrypted`); toast('Vault PIN changed');
      }
    });
  },
  forget() { Object.values(this.timers).forEach(clearInterval); this.timers = {}; },
  age(c) { return daysBetween(isoDate(c.changedAt || c.createdAt), today()); },

  /* ---------- Credential types (data, editable) ---------- */
  types() { const t = Store.s.settings.credTypes; return JSON.parse(JSON.stringify(Array.isArray(t) ? t : DEFAULT_CRED_TYPES)); },
  type(id) { return this.types().find((t) => t.id === id); },
  saveTypes(arr) { Store.commit((s) => { s.settings.credTypes = arr; }); },
  typeLabel(t) { const sv = t.service ? Lists.get('services', t.service) : null; return (sv ? sv.name + ' › ' : '') + t.name; },
  typeName(c) {
    if (c.typeId) { const t = this.type(c.typeId); return t ? t.name : 'Credential'; }
    return Lists.name('portals', c.portal);
  },
  /* Non-mutating: returns the credential in the typed shape (old records are converted on the fly). */
  upgrade(c) {
    if (c.typeId) return Object.assign({}, c, { layout: c.layout || [], fields: c.fields || {}, secrets: c.secrets || {} });
    const pname = String(Lists.name('portals', c.portal) || '').toLowerCase();
    const t = this.type(LEGACY_PORTAL_TYPE[pname] || 'ct_login') || this.types()[0] || null;
    const lay = (t ? t.fields : []).map(({ id, label, kind }) => ({ id, label, kind }));
    const fields = {}, secrets = {};
    let txt = lay.find((f) => !isSecretKind(f.kind)); if (!txt) { txt = { id: 'u0', label: 'Username / Login ID', kind: 'text' }; lay.unshift(txt); }
    let pw = lay.find((f) => f.kind === 'secret') || lay.find((f) => isSecretKind(f.kind)); if (!pw) { pw = { id: 'p0', label: 'Password', kind: 'secret' }; lay.push(pw); }
    fields[txt.id] = c.username || ''; if (c.secret) secrets[pw.id] = c.secret;
    if (c.extra) {
      const pin = lay.find((f) => f !== pw && f.kind === 'pin') || lay.find((f) => f !== pw && isSecretKind(f.kind));
      if (pin) secrets[pin.id] = c.extra; else { lay.push({ id: 'x1', label: 'Extra PIN / secret answer', kind: 'pin' }); secrets.x1 = c.extra; }
    }
    return Object.assign({}, c, { typeId: t ? t.id : '', layout: lay, fields, secrets });
  },
  plain(c) { const u = this.upgrade(c); return u.layout.filter((f) => !isSecretKind(f.kind) && u.fields[f.id]).map((f) => [f.label, u.fields[f.id], f.kind]); },
  secretList(c) { const u = this.upgrade(c); return u.layout.filter((f) => isSecretKind(f.kind) && u.secrets[f.id]); },
  portalUrl(c) { const t = c.typeId ? this.type(c.typeId) : null; return c.url || (t && t.url) || (!c.typeId ? (Lists.get('portals', c.portal) || {}).url : '') || ''; },

  /* ---------- Add / edit a credential ---------- */
  open(c, clientId) {
    const isNew = !c; const types = this.types();
    if (!types.length) { toast('No credential types yet. Add one first.', 'warn'); if (Auth.can('vault', 'create')) this.manageTypes(); return; }
    const u = c ? this.upgrade(c) : null;
    let typeId = u && this.type(u.typeId) ? u.typeId : '';
    const clientF = { name: 'clientId', label: 'Client', type: 'select', options: clientOpts, required: true };
    const typeF = { name: 'typeId', label: 'Credential type', type: 'select', options: () => types.map((t) => ({ value: t.id, label: this.typeLabel(t) })), required: true, placeholder: '— Choose what you are saving —' };
    const tail = [
      { name: 'url', label: 'Login URL (optional)', type: 'url', placeholder: 'Opens from the vault list', validate: Valid.url },
      { name: 'changedAt', label: 'Password last changed', type: 'date' },
      { name: 'notes', label: 'Notes', type: 'textarea', full: true, rows: 2 }
    ];
    const dynFields = (tid) => { const t = types.find((x) => x.id === tid); return t ? t.fields.map((f) => ({ name: 'cf_' + f.id, label: f.label, type: isSecretKind(f.kind) ? 'password' : (f.kind === 'email' ? 'email' : f.kind === 'url' ? 'url' : 'text'), required: !!f.required && !(u && u.secrets[f.id]), autocomplete: isSecretKind(f.kind) ? 'new-password' : 'off', placeholder: isSecretKind(f.kind) && u && u.secrets[f.id] ? 'Leave blank to keep the saved value' : '', _kind: f.kind, _id: f.id, validate: f.kind === 'url' ? Valid.url : undefined })) : []; };
    const dynVals = (tid) => { const o = {}; if (u && u.typeId === tid) Object.entries(u.fields).forEach(([k, v]) => { o['cf_' + k] = v; }); return o; };
    const base = c ? { clientId: u.clientId, url: u.url, changedAt: isoDate(u.changedAt || u.createdAt), notes: u.notes } : { clientId: clientId || '', changedAt: today() };
    const dynHTML = (tid, vals) => { const fs = dynFields(tid); return fs.length ? html`${fs.map((f) => fieldHTML(f, vals[f.name]))}` : html`<p class="muted sm full">Choose a credential type to see its fields.</p>`; };
    const body = html`<p class="muted sm form-intro">${icon('lock')} Passwords and PINs are encrypted with the Vault PIN before they are saved. Each type has its own fields — change them from <b>Credential types</b>.</p>
      <form class="grid-form" novalidate>${fieldHTML(clientF, base.clientId)}${fieldHTML(typeF, typeId)}<div data-dyn style="display:contents">${dynHTML(typeId, dynVals(typeId))}</div>${tail.map((f) => fieldHTML(f, base[f.name]))}<button type="submit" hidden></button></form>`;
    Modal.open({
      title: isNew ? 'Add credential' : 'Edit credential', size: 'md', body,
      foot: html`${Auth.can('vault', 'create') ? html`<button type="button" class="btn ghost" data-mgr>${icon('key')}<span>Credential types</span></button>` : ''}<span class="grow"></span><button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn primary" data-save>Save</button>`,
      onMount: (el, m) => {
        const form = el.querySelector('form'); const dyn = el.querySelector('[data-dyn]');
        const fieldsNow = () => [clientF, typeF, ...dynFields(typeId), ...tail];
        const paintDyn = (vals) => { dyn.innerHTML = String(dynHTML(typeId, vals)); dynFields(typeId).forEach((f) => { if (f._kind === 'pin') { const i = form.elements[f.name]; if (i) i.setAttribute('inputmode', 'numeric'); } }); bindFormExtras(dyn); };
        bindFormExtras(form); paintDyn(dynVals(typeId));
        form.elements.typeId.addEventListener('change', () => { typeId = form.elements.typeId.value; paintDyn(dynVals(typeId)); });
        const mg = el.querySelector('[data-mgr]'); if (mg) mg.onclick = () => this.manageTypes();
        let busy = false;
        const go = async () => {
          if (busy) return;
          const vals = readForm(form, fieldsNow()); const errs = validateForm(vals, fieldsNow());
          if (vals.clientId && !Auth.canSeeClient(vals.clientId)) errs.clientId = 'Choose one of your clients';
          if (Object.keys(errs).length) { showErrors(form, errs); return; }
          busy = true; const b = el.querySelector('[data-save]'); b.disabled = true;
          try {
            const t = types.find((x) => x.id === vals.typeId);
            const needKey = isNew || t.fields.some((f) => isSecretKind(f.kind) && vals['cf_' + f.id]);
            let key = null; if (needKey) { key = await this.askKey('Enter the Vault PIN to encrypt this credential'); if (!key) return; }
            const fields = {}, secrets = {};
            for (const f of t.fields) {
              const v = vals['cf_' + f.id];
              if (isSecretKind(f.kind)) { if (v) secrets[f.id] = await Crypto.encrypt(key, v); else if (u && u.typeId === t.id && u.secrets[f.id]) secrets[f.id] = u.secrets[f.id]; }
              else if (v) fields[f.id] = v;
            }
            const layout = t.fields.map(({ id, label, kind }) => ({ id, label, kind }));
            if (u && u.typeId === t.id) u.layout.forEach((f) => { if (!layout.some((x) => x.id === f.id) && (u.secrets[f.id] || u.fields[f.id])) { layout.push({ id: f.id, label: f.label, kind: f.kind }); if (u.secrets[f.id]) secrets[f.id] = u.secrets[f.id]; if (u.fields[f.id]) fields[f.id] = u.fields[f.id]; } });
            const changedSecret = Object.keys(secrets).some((k) => !(u && u.typeId === t.id && u.secrets[k] === secrets[k]));
            const data = { clientId: vals.clientId, typeId: t.id, layout, fields, secrets, url: vals.url, notes: vals.notes, changedAt: changedSecret ? today() : (vals.changedAt || today()) };
            const client = DB.client(vals.clientId); const first = layout.find((f) => !isSecretKind(f.kind)); const login = first ? fields[first.id] || '' : '';
            if (isNew) {
              const rec = Rec.stamp(Object.assign({ id: uid('cr') }, data), true);
              Store.commit((s) => { s.creds.push(rec); Timeline.add(vals.clientId, 'credential', `${t.name} credential added`); });
              Auth.audit('create', 'vault', `Credential added: ${t.name} for ${client.code}`, { recordId: rec.id, new: { type: t.name, login } });
            } else {
              const old = { type: this.typeName(c), url: c.url };
              Store.commit(() => { ['portal', 'username', 'secret', 'extra'].forEach((k) => { delete c[k]; }); Object.assign(c, data); Rec.stamp(c); });
              Auth.audit('edit', 'vault', `Credential edited: ${t.name} for ${client.code}${changedSecret ? ' (secret changed)' : ''}`, { recordId: c.id, old, new: { type: t.name, login, url: vals.url } });
            }
            toast('Credential saved (encrypted)'); m.close();
          } catch (e) { console.warn(e); toast(e.message || 'Something went wrong', 'err'); }
          finally { busy = false; b.disabled = false; }
        };
        el.querySelector('[data-save]').onclick = go; form.onsubmit = (e) => { e.preventDefault(); go(); };
      }
    });
  },

  /* ---------- Manage credential types ---------- */
  typesList() {
    const ts = this.types(); const used = (id) => Store.s.creds.filter((c) => c.typeId === id).length;
    if (!ts.length) return emptyState('No credential types', 'Add a type for each kind of login you store.');
    return html`<div class="ct-list">${ts.map((t) => html`<div class="ct-item"><div><b>${this.typeLabel(t)}</b> <small class="muted">· ${used(t.id)} saved</small><div class="ct-chips">${t.fields.map((f) => html`<span class="ct-chip ${isSecretKind(f.kind) ? 'sec' : ''}">${isSecretKind(f.kind) ? icon('lock') : ''}${f.label}</span>`)}</div></div><div class="row-acts">${btn('', 'vault:typeedit', { id: t.id, icon: 'edit', cls: 'icon-btn sm', title: 'Edit type' })}${btn('', 'vault:typedel', { id: t.id, icon: 'trash', cls: 'icon-btn sm', title: 'Delete type' })}</div></div>`)}</div>`;
  },
  redrawTypes() { const el = document.querySelector('[data-types]'); if (el) el.innerHTML = String(this.typesList()); try { Router.refresh(); } catch (e) { /* ignore */ } },
  manageTypes() {
    if (!Auth.can('vault', 'create')) { toast('You do not have permission to change credential types', 'warn'); return; }
    Modal.open({
      title: 'Credential types', size: 'md',
      body: html`<p class="muted sm">Each type has its own fields — e.g. <b>Taxation</b>: User ID / Email, Password and PIN; <b>Digital Marketing</b>: Platform, Login, Password, 2FA code. Password and PIN fields are always encrypted.</p><div data-types>${this.typesList()}</div>`,
      foot: html`${btn('Add credential type', 'vault:typenew', { cls: 'primary', icon: 'plus' })}<span class="grow"></span><button type="button" class="btn ghost" data-close>Close</button>`
    });
  },
  editType(t) {
    const isNew = !t;
    const draft = t ? JSON.parse(JSON.stringify(t)) : { id: uid('ct_'), name: '', service: '', url: '', fields: [{ id: uid('f'), label: 'Username / Login ID', kind: 'text', required: true }, { id: uid('f'), label: 'Password', kind: 'secret', required: true }] };
    const row = (f) => html`<div class="ct-row" data-fid="${f.id}"><input class="inp" data-k="label" value="${f.label}" placeholder="Field name (e.g. PIN)" aria-label="Field name"><select class="inp" data-k="kind" aria-label="Field type">${Object.entries(CRED_KINDS).map(([k, l]) => html`<option value="${k}" ${k === f.kind ? raw('selected') : ''}>${l}</option>`)}</select><label class="chk"><input type="checkbox" data-k="required" ${f.required ? raw('checked') : ''}><span>Required</span></label><button type="button" class="icon-btn sm" data-rm title="Remove field" aria-label="Remove field">${icon('trash')}</button></div>`;
    const svc = Lists.all('services');
    Modal.open({
      title: isNew ? 'New credential type' : 'Edit credential type', size: 'md',
      body: html`<div class="grid-form"><label class="fld full"><span>Type name<b class="req">*</b></span><input class="inp" data-name value="${draft.name}" placeholder="e.g. Taxation, Facebook Ads, Domain & Hosting"><small class="err" data-err></small></label>
        <label class="fld"><span>For service (optional)</span><select class="inp" data-svc><option value="">— Any / general —</option>${svc.map((x) => html`<option value="${x.id}" ${x.id === draft.service ? raw('selected') : ''}>${x.name}</option>`)}</select></label>
        <label class="fld"><span>Default login URL (optional)</span><input class="inp" data-url type="url" value="${draft.url || ''}" placeholder="https://"></label></div>
        <h4 class="form-sec">Fields</h4><div data-rows>${draft.fields.map(row)}</div><button type="button" class="btn ghost sm" data-addf>${icon('plus')}<span>Add field</span></button>`,
      foot: html`<span class="grow"></span><button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn primary" data-save>Save type</button>`,
      onMount: (el, m) => {
        const rows = el.querySelector('[data-rows]');
        rows.addEventListener('click', (e) => { const b = e.target.closest('[data-rm]'); if (b) b.closest('.ct-row').remove(); });
        el.querySelector('[data-addf]').onclick = () => { rows.insertAdjacentHTML('beforeend', String(row({ id: uid('f'), label: '', kind: 'text', required: false }))); const l = rows.querySelector('.ct-row:last-child [data-k=label]'); if (l) l.focus(); };
        el.querySelector('[data-save]').onclick = () => {
          const name = el.querySelector('[data-name]').value.trim(); const err = el.querySelector('[data-err]');
          const fields = [...rows.querySelectorAll('.ct-row')].map((r) => ({ id: r.dataset.fid, label: r.querySelector('[data-k=label]').value.trim(), kind: r.querySelector('[data-k=kind]').value, required: r.querySelector('[data-k=required]').checked }));
          if (!name) { err.textContent = 'Give the type a name'; return; }
          if (!fields.length) { toast('Add at least one field', 'warn'); return; }
          if (fields.some((f) => !f.label)) { toast('Every field needs a name', 'warn'); return; }
          if (!fields.some((f) => isSecretKind(f.kind))) { toast('Add at least one Password or PIN field — this is what the vault encrypts', 'warn'); return; }
          const url = el.querySelector('[data-url]').value.trim(); if (Valid.url(url)) { toast(Valid.url(url), 'warn'); return; }
          const all = this.types(); if (all.some((x) => x.id !== draft.id && x.name.toLowerCase() === name.toLowerCase())) { err.textContent = 'A type with this name already exists'; return; }
          const rec = { id: draft.id, name, service: el.querySelector('[data-svc]').value, url, fields };
          const i = all.findIndex((x) => x.id === draft.id); if (i < 0) all.push(rec); else all[i] = rec;
          this.saveTypes(all); Auth.audit(isNew ? 'create' : 'edit', 'vault', `Credential type ${isNew ? 'added' : 'edited'}: ${name}`);
          toast('Credential type saved'); m.close(); this.redrawTypes();
        };
      }
    });
  },
  async delType(id) {
    const t = this.type(id); if (!t) return;
    const n = Store.s.creds.filter((c) => c.typeId === id).length;
    if (n) { toast(`${n} saved credential${n > 1 ? 's use' : ' uses'} this type. Edit or delete them first.`, 'warn'); return; }
    if (!(await confirmDlg(`Delete the type "${t.name}"?`, { danger: true, ok: 'Delete' }))) return;
    this.saveTypes(this.types().filter((x) => x.id !== id)); Auth.audit('delete', 'vault', `Credential type deleted: ${t.name}`); this.redrawTypes();
  },

  /* ---------- Reveal / copy (PIN every time) ---------- */
  async reveal(c, fk) {
    const client = DB.client(c.clientId) || {}; const u = this.upgrade(c); const f = u.layout.find((x) => x.id === fk); if (!f || !u.secrets[fk]) return;
    const key = await this.askKey(`Enter the Vault PIN to reveal "${f.label}" (${this.typeName(c)}) for ${client.code || ''}`); if (!key) return;
    let pw; try { pw = await Crypto.decrypt(key, u.secrets[fk]); } catch (e) { toast('Could not decrypt this entry', 'err'); return; }
    Auth.audit('reveal', 'vault', `Revealed: ${f.label} (${this.typeName(c)}) for ${client.code || ''} ${client.name || ''}`, { recordId: c.id });
    const el = document.querySelector(`[data-secret="${c.id}${fk}"]`);
    if (!el) { toast('Revealed — open the vault list to view', 'info'); return; }
    const tk = c.id + fk; let left = 15; clearInterval(this.timers[tk]);
    el.textContent = pw; el.classList.add('shown'); const cd = document.createElement('small'); cd.className = 'cd'; el.after(cd);
    const tick = () => { cd.textContent = ` hides in ${left}s`; if (left-- <= 0) { clearInterval(this.timers[tk]); el.textContent = '••••••••'; el.classList.remove('shown'); cd.remove(); } };
    tick(); this.timers[tk] = setInterval(tick, 1000);
  },
  async copy(c, fk) {
    const client = DB.client(c.clientId) || {}; const u = this.upgrade(c); const f = u.layout.find((x) => x.id === fk); if (!f || !u.secrets[fk]) return;
    const key = await this.askKey(`Enter the Vault PIN to copy "${f.label}"`); if (!key) return;
    let pw; try { pw = await Crypto.decrypt(key, u.secrets[fk]); } catch (e) { toast('Could not decrypt this entry', 'err'); return; }
    try { await navigator.clipboard.writeText(pw); } catch (e) { const t = document.createElement('textarea'); t.value = pw; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    pw = null;
    Auth.audit('copy', 'vault', `Copied: ${f.label} (${this.typeName(c)}) for ${client.code || ''}`, { recordId: c.id });
    toast('Copied. Clipboard will be cleared in 20 seconds.', 'info');
    setTimeout(() => { navigator.clipboard && navigator.clipboard.writeText(' ').catch(() => {}); }, 20000);
  },
  table(rows, key) {
    if (!Auth.can('vault')) return html`<p class="muted">No access.</p>`;
    const secretRow = (c, f) => html`<div class="vsec nw"><small class="muted">${f.label}</small><span class="secret-v" data-secret="${c.id}${f.id}">••••••••</span>${btn('', 'vault:reveal', { id: c.id, icon: 'eye', cls: 'icon-btn sm', title: `Reveal ${f.label} (PIN)`, extra: `data-fk="${esc(f.id)}"` })}${btn('', 'vault:copy', { id: c.id, icon: 'copy', cls: 'icon-btn sm', title: `Copy ${f.label} (PIN)`, extra: `data-fk="${esc(f.id)}"` })}</div>`;
    return dataTable(key, {
      rows, empty: emptyState('No credentials saved', 'Add website, portal, email or software logins for your clients.'),
      rowCls: (c) => (this.age(c) > 90 ? 'row-warn' : ''),
      cols: [
        { key: 'client', label: 'Client', get: (c) => (DB.client(c.clientId) || {}).name, render: (c) => { const cl = DB.client(c.clientId); return cl ? html`<a href="#/clients/${cl.code}">${cl.code} · ${cl.name}</a>` : '—'; } },
        { key: 'type', label: 'Type', get: (c) => this.typeName(c), render: (c) => html`<b>${this.typeName(c)}</b>` },
        { key: 'details', label: 'Login details', sort: false, render: (c) => { const p = this.plain(c); return p.length ? html`${p.map(([l, v, k]) => html`<div class="vsec"><small class="muted">${l}</small>${k === 'url' && /^https?:\/\//i.test(v) ? html`<a href="${v}" target="_blank" rel="noopener noreferrer">${v}</a>` : html`<code>${v}</code>`}</div>`)}` : '—'; } },
        { key: 'pw', label: 'Password / PIN', sort: false, render: (c) => html`${this.secretList(c).map((f) => secretRow(c, f))}` },
        { key: 'changedAt', label: 'Last changed', get: (c) => c.changedAt, render: (c) => html`${fmtDate(c.changedAt)}${this.age(c) > 90 ? html`<br>${badge(`${this.age(c)} days old`, 'amber')}` : ''}` },
        { key: 'a', label: '', sort: false, cls: 'act', render: (c) => html`<div class="row-acts">${this.portalUrl(c) ? html`<a class="icon-btn sm" href="${this.portalUrl(c)}" target="_blank" rel="noopener noreferrer" title="Open login page" aria-label="Open login page">↗</a>` : ''}${Auth.can('vault', 'edit') ? btn('', 'vault:edit', { id: c.id, icon: 'edit', cls: 'icon-btn sm', title: 'Edit' }) : ''}${Auth.can('vault', 'delete') ? btn('', 'vault:del', { id: c.id, icon: 'trash', cls: 'icon-btn sm', title: 'Delete' }) : ''}</div>` }
      ]
    });
  }
};

   08-team.js — Team members: profile, photo, workload meter, monthly
   performance score, link to login user (or create one).
   ========================================================================== */
const Team = {
  openTasks(m) { return Store.s.tasks.filter((t) => t.assignedTo === m.id && !Lists.isDone(t.status)); },
  workload(m) { const cap = Number(Store.s.settings.capacity) || 15; const n = this.openTasks(m).length; return { n, cap, pct: Math.min(100, n / cap * 100) }; },
  /* Performance for a month: share of tasks due that month completed (on-time = 1, late = 0.5). */
  score(m, mk = monthKey(today())) {
    const due = Store.s.tasks.filter((t) => t.assignedTo === m.id && monthKey(t.due) === mk);
    const done = Store.s.tasks.filter((t) => t.assignedTo === m.id && Lists.isDone(t.status) && monthKey(t.completedAt) === mk);
    const onTime = done.filter((t) => !t.due || t.completedAt <= t.due).length; const late = done.length - onTime;
    const base = Math.max(due.length, done.length, 1);
    return { score: (due.length || done.length) ? Math.min(100, Math.round((onTime + late * 0.5) / base * 100)) : null, done: done.length, onTime, late, due: due.length };
  },
  user(m) { return Store.s.users.find((u) => u.memberId === m.id); },
  open(m) {
    const isNew = !m;
    const userOpts = () => Store.s.users.filter((u) => !u.memberId || (m && u.memberId === m.id)).map((u) => ({ value: u.id, label: `${u.username} (${u.name})` }));
    formModal({
      title: isNew ? 'New team member' : `Edit ${m.code}`, size: 'lg',
      fields: [
        { name: 'name', label: 'Full name', required: true }, { name: 'designation', label: 'Designation', type: 'select', list: 'designations' },
        { name: 'department', label: 'Department', type: 'select', list: 'departments' }, { name: 'email', label: 'Email', type: 'email' },
        { name: 'mobile', label: 'Mobile', type: 'mobile' }, { name: 'joinDate', label: 'Joining date', type: 'date' },
        { name: 'status', label: 'Status', type: 'select', list: 'staffStatuses', required: true }, { name: 'branch', label: 'Branch', type: 'select', list: 'branches' },
        { name: 'userId', label: 'Linked login user', type: 'select', options: userOpts, help: 'Links tasks & assigned clients to this login', placeholder: '— Not linked —' },
        { name: 'photo', label: 'Photo', type: 'image' }
      ],
      values: m ? Object.assign(clone(m), { userId: (this.user(m) || {}).id || '' }) : { status: (Lists.all('staffStatuses')[0] || {}).id, joinDate: today(), branch: (Lists.all('branches')[0] || {}).id },
      onSubmit: (v) => {
        const userId = v.userId; delete v.userId;
        let rec = m;
        Store.commit((s) => {
          if (isNew) { rec = Rec.stamp(Object.assign({ id: uid('m') }, v), true); rec.code = Store.next('emp'); s.team.push(rec); }
          else { Object.assign(m, v); Rec.stamp(m); }
          s.users.forEach((u) => { if (u.memberId === rec.id && u.id !== userId) u.memberId = ''; });
          const u = s.users.find((x) => x.id === userId); if (u) u.memberId = rec.id;
        });
        Auth.audit(isNew ? 'create' : 'edit', 'team', `${isNew ? 'Created' : 'Edited'} team member ${rec.code} ${rec.name}`, { recordId: rec.id });
        toast(isNew ? `${rec.code} added` : 'Team member updated');
      }
    });
  }
};

/* ==========================================================================
   09-tasks.js — Task management: table, Kanban (drag & drop), calendar,
   detail page (checklist, comments, attachments, time log/timer), recurring
   tasks, templates per service, bulk status update, reassign notifications.
   ========================================================================== */
const RECUR = [{ value: '', label: 'Does not repeat' }, { value: 'monthly', label: 'Monthly' }, { value: 'quarterly', label: 'Quarterly' }, { value: 'yearly', label: 'Yearly' }];
const Tasks = {
  tpl(service) { return License.has('recurring') ? (Store.s.settings.taskTemplates || []).find((t) => t.service === service) : null; },
  fields() {
    return [
      { name: 'title', label: 'Title', required: true, full: true },
      { name: 'clientId', label: 'Client', type: 'select', options: clientOpts, required: true },
      { name: 'service', label: 'Service type', type: 'select', list: 'services', help: 'A template checklist is added automatically if one exists' },
      { name: 'assignedTo', label: 'Assigned to', type: 'select', options: memberOpts, required: true },
      { name: 'priority', label: 'Priority', type: 'select', list: 'priorities', required: true },
      { name: 'start', label: 'Start date', type: 'date' },
      { name: 'due', label: 'Due date', type: 'date', required: true, validate: (v, a) => (a.start && v && v < a.start ? 'Due date is before start date' : '') },
      { name: 'status', label: 'Status', type: 'select', list: 'taskStatuses', required: true },
      License.has('recurring') ? { name: 'recurrence', label: 'Repeat', type: 'select', options: RECUR, placeholder: 'Does not repeat' } : { type: 'html', name: '', html: html`<span class="muted sm">Recurring tasks: ${License.lock('recurring')}</span>` },
      { name: 'projectId', label: 'Project (optional)', type: 'select', options: () => [{ value: '', label: '— None —' }, ...(Store.s.projects || []).filter(p => !this._clientId || p.clientId === this._clientId).map(p => ({ value: p.id, label: p.code + ' · ' + p.name }))] },
      { name: 'description', label: 'Description', type: 'textarea', full: true }
    ];
  },
  open(t, preset = {}) {
    const isNew = !t;
    const vals = t ? clone(t) : Object.assign({ status: Lists.firstStatus(), priority: Lists.idByName('priorities', 'Medium') || (Lists.all('priorities')[0] || {}).id, start: today(), due: addDays(today(), 7), assignedTo: Auth.memberId() || '' }, preset);
    if (vals.clientId && !preset.assignedTo && isNew) { const c = DB.client(vals.clientId); if (c && c.assignedTo) vals.assignedTo = c.assignedTo; }
    const m = formModal({
      title: isNew ? 'New task' : `Edit ${t.code}`, size: 'lg', fields: this.fields(), values: vals,
      onSubmit: (v) => {
        if (!Auth.canSeeClient(v.clientId)) return { clientId: 'Choose one of your clients' };
        if (isNew) {
          const tp = this.tpl(v.service);
          const rec = Rec.stamp(Object.assign({ id: uid('t'), subtasks: tp ? tp.checklist.map((x) => ({ id: uid('s'), text: x, done: false })) : [], comments: [], timeLog: [] }, v), true);
          Store.commit((s) => { rec.code = Store.next('task'); if (Lists.isDone(rec.status)) rec.completedAt = today(); s.tasks.push(rec); });
          Auth.audit('create', 'tasks', `Created task ${rec.code} ${rec.title}`, { recordId: rec.id, new: v });
          this.notifyAssignee(rec, 'New task assigned');
          toast(`${rec.code} created${tp ? ' with template checklist' : ''}`);
        } else {
          const d = Auth.diff(t, v); const reassigned = v.assignedTo !== t.assignedTo; const statusChanged = v.status !== t.status;
          const newStatus = v.status; v.status = t.status;
          Store.commit(() => { Object.assign(t, v); Rec.stamp(t); });
          if (statusChanged) this.setStatus(t, newStatus, true);
          Auth.audit('edit', 'tasks', `Edited task ${t.code}`, { recordId: t.id, old: d.old, new: d.new });
          if (reassigned) this.notifyAssignee(t, 'Task reassigned to you');
          toast('Task updated');
        }
      }
    });
    // template preview: fill title from template when service chosen and title empty
    const form = m.el.querySelector('form');
    form.elements.service.addEventListener('change', () => { const tp = this.tpl(form.elements.service.value); if (tp && !form.elements.title.value) form.elements.title.value = tp.title || Lists.name('services', form.elements.service.value); if (tp && tp.days && isNew) form.elements.due.value = addDays(form.elements.start.value || today(), tp.days); });
    form.elements.clientId.addEventListener('change', () => { const c = DB.client(form.elements.clientId.value); if (c && c.assignedTo && isNew) form.elements.assignedTo.value = c.assignedTo; });
  },
  notifyAssignee(t, title) {
    const c = DB.client(t.clientId) || {};
    if (t.assignedTo) Notify.toMember(t.assignedTo, 'assignment', title, `${t.code} · ${t.title} (${c.code || ''} ${c.name || ''}) — due ${fmtDate(t.due)}`, '#/tasks/' + t.code);
  },
  /* Central status change: completion date, timeline, recurring next task. */
  setStatus(t, status, silent) {
    if (!status || t.status === status && !silent) return;
    const was = t.status; const done = Lists.isDone(status);
    Store.commit(() => {
      t.status = status; Rec.stamp(t);
      if (done && !t.completedAt) t.completedAt = today();
      if (!done) t.completedAt = '';
      if (done && !Lists.isDone(was)) { Timeline.add(t.clientId, 'task', `Task completed: ${t.code} ${t.title}`); this.spawnNext(t); }
    });
    if (!silent) Auth.audit('edit', 'tasks', `${t.code} status: ${Lists.name('taskStatuses', was)} → ${Lists.name('taskStatuses', status)}`, { recordId: t.id, old: { status: Lists.name('taskStatuses', was) }, new: { status: Lists.name('taskStatuses', status) } });
  },
  spawnNext(t) {
    if (!t.recurrence || t.nextId || !License.has('recurring')) return;
    const n = { monthly: 1, quarterly: 3, yearly: 12 }[t.recurrence];
    const next = Object.assign(clone(t), { id: uid('t'), status: Lists.firstStatus(), completedAt: '', start: t.start ? addMonths(t.start, n) : '', due: addMonths(t.due, n), comments: [], timeLog: [], running: null, nextId: '', prevId: t.id, subtasks: (t.subtasks || []).map((s) => ({ id: uid('s'), text: s.text, done: false })) });
    next.code = Store.next('task'); Rec.stamp(next, true);
    Store.s.tasks.push(next); t.nextId = next.id;
    toast(`Recurring task ${next.code} created for ${fmtDate(next.due)}`, 'info');
    Auth.audit('create', 'tasks', `Recurring task ${next.code} auto-created from ${t.code}`, { recordId: next.id });
  },
  rowCls(t) { return DB.isOverdue(t) ? 'row-late' : ''; },
  dueCell(t) { const late = DB.isOverdue(t); const dd = t.due ? daysBetween(today(), t.due) : null; return html`<span class="${late ? 'late-txt' : ''}">${fmtDate(t.due)}</span>${late ? html`<br>${badge(`${-dd}d overdue`, 'red')}` : (!Lists.isDone(t.status) && dd !== null && dd <= 3 ? html`<br>${badge(dd === 0 ? 'Due today' : `in ${dd}d`, 'amber')}` : '')}`; },
  cols(selectableStatus = true) {
    return [
      { key: 'code', label: 'Task ID', render: (t) => html`<a class="code" href="#/tasks/${t.code}">${t.code}</a>` },
      { key: 'title', label: 'Title', render: (t) => html`<a href="#/tasks/${t.code}" class="strong">${t.title}</a>${t.recurrence ? html` <span title="Repeats ${t.recurrence}">↻</span>` : ''}${(t.subtasks || []).length ? html`<br>${progress(this.pct(t))}` : ''}` },
      { key: 'client', label: 'Client', get: (t) => (DB.client(t.clientId) || {}).name, render: (t) => { const c = DB.client(t.clientId); return c ? html`<a href="#/clients/${c.code}">${c.name}</a><br><small class="code">${c.code}</small>` : html`<span class="muted">—</span>`; } },
      { key: 'service', label: 'Service', get: (t) => Lists.name('services', t.service), render: (t) => Lists.name('services', t.service) },
      { key: 'assignedTo', label: 'Assigned', get: (t) => DB.memberName(t.assignedTo), render: (t) => DB.memberName(t.assignedTo) },
      { key: 'priority', label: 'Priority', get: (t) => Lists.all('priorities').findIndex((p) => p.id === t.priority), render: (t) => listBadge('priorities', t.priority) },
      { key: 'due', label: 'Due', render: (t) => this.dueCell(t) },
      { key: 'status', label: 'Status', get: (t) => Lists.all('taskStatuses').findIndex((p) => p.id === t.status), render: (t) => Auth.can('tasks', 'edit') && selectableStatus ? html`<select class="inp sm status-sel" data-act-change="task:status" data-id="${t.id}" aria-label="Status">${Lists.options('taskStatuses', t.status)}</select>` : listBadge('taskStatuses', t.status) },
      { key: 'completedAt', label: 'Completed', render: (t) => fmtDate(t.completedAt) }
    ];
  },
  table(rows, key, opts = {}) { return dataTable(key, { rows, cols: this.cols(), selectable: opts.selectable, rowCls: (t) => this.rowCls(t), empty: emptyState('No tasks', 'Create a task or change filters.') }); },
  pct(t) { const s = t.subtasks || []; return s.length ? s.filter((x) => x.done).length / s.length * 100 : 0; },
  miniRow(t) { return html`<div class="mini-row ${DB.isOverdue(t) ? 'late' : ''}"><div class="mr-main"><a href="#/tasks/${t.code}"><b>${t.title}</b></a><small class="muted">${t.code} · ${(DB.client(t.clientId) || {}).name || ''}</small></div><div class="mr-side">${this.dueCell(t)}</div></div>`; },
  filtered() {
    const f = vs('tasks');
    return Auth.tasks().filter((t) => {
      const c = DB.client(t.clientId) || {};
      return textMatch(f.q, t.code, t.title, t.description, c.name, c.code) && (!f.status || t.status === f.status) && (!f.priority || t.priority === f.priority)
        && (!f.assignee || t.assignedTo === f.assignee) && (!f.service || t.service === f.service) && (!f.client || t.clientId === f.client)
        && inRange(t.due, f.from, f.to) && (!f.overdue || DB.isOverdue(t)) && (!f.mine || t.assignedTo === Auth.memberId()) && (!f.project || t.projectId === f.project) && (f.showDone !== false && f.showDone !== '' ? true : !Lists.isDone(t.status) || f.status);
    });
  }
};

        ${savedFiltersBar('tasks')}</div>${body}`;

  kanban(rows) {
    const cols = Lists.all('taskStatuses'); const canEdit = Auth.can('tasks', 'edit');
    return html`<div class="kanban">${cols.map((s) => { const items = rows.filter((t) => t.status === s.id).sort((a, b) => (a.due > b.due ? 1 : -1)); return html`<div class="kcol" data-drop="${s.id}"><div class="kcol-h"><i style="background:${s.color || '#888'}"></i><b>${s.name}</b><span class="cnt">${items.length}</span></div><div class="kcol-b">${items.slice(0, 80).map((t) => { const c = DB.client(t.clientId) || {}; return html`<div class="kcard ${DB.isOverdue(t) ? 'late' : ''}" draggable="${canEdit}" data-drag="${t.id}"><div class="row-between"><a class="code" href="#/tasks/${t.code}">${t.code}</a>${listBadge('priorities', t.priority)}</div><a href="#/tasks/${t.code}" class="strong">${t.title}</a><div class="muted sm">${c.code || ''} · ${c.name || ''}</div>${(t.subtasks || []).length ? progress(Tasks.pct(t)) : ''}<div class="row-between sm"><span>${avatar(DB.memberName(t.assignedTo), (DB.member(t.assignedTo) || {}).photo, 22)} ${DB.memberName(t.assignedTo).split(' ')[0]}</span><span class="${DB.isOverdue(t) ? 'late-txt' : 'muted'}">${fmtDate(t.due)}</span></div>${canEdit ? html`<select class="inp sm only-m" data-act-change="task:status" data-id="${t.id}" aria-label="Move to">${Lists.options('taskStatuses', t.status)}</select>` : ''}</div>`; })}${items.length > 80 ? html`<p class="muted sm">+${items.length - 80} more (use filters)</p>` : ''}</div></div>`; })}</div>`;
  },
  calendar(rows) {
    const f = vs('tasks'); const base = f.month || monthKey(today()); const [y, m] = base.split('-').map(Number);
    const first = new Date(y, m - 1, 1); const startDow = (first.getDay() + 6) % 7; const days = new Date(y, m, 0).getDate();
    const byDay = groupBy(rows.filter((t) => monthKey(t.due) === base), (t) => t.due);
    const cells = []; for (let i = 0; i < startDow; i++) cells.push(null); for (let d = 1; d <= days; d++) cells.push(`${base}-${pad(d, 2)}`);
    while (cells.length % 7) cells.push(null);
    const prev = monthKey(addMonths(base + '-01', -1)), next = monthKey(addMonths(base + '-01', 1));
    const comp = (Store.s.compliance || []).filter((x) => x.active !== false);
    return html`<div class="card"><div class="cal-h">${btn('‹', 'nav', { cls: 'ghost sm', extra: `data-vs-set="tasks.month" data-val="${prev}"` })}<h3>${MONTHS[m - 1]} ${y}</h3>${btn('›', 'nav', { cls: 'ghost sm', extra: `data-vs-set="tasks.month" data-val="${next}"` })}${btn('Today', 'nav', { cls: 'ghost sm', extra: `data-vs-set="tasks.month" data-val="${monthKey(today())}"` })}</div>
      <div class="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => html`<div class="cal-dow">${d}</div>`)}${cells.map((d) => d ? html`<div class="cal-d ${d === today() ? 'today' : ''}" data-drop-day="${d}"><span class="cal-n">${+d.slice(8)}</span>${comp.filter((x) => Compliance.dueIn(x, base) === d).map((x) => html`<div class="cal-comp" title="${x.name}">⚑ ${x.name}</div>`)}${(byDay[d] || []).slice(0, 4).map((t) => html`<a href="#/tasks/${t.code}" class="cal-t ${DB.isOverdue(t) ? 'late' : Lists.isDone(t.status) ? 'done' : ''}" draggable="${Auth.can('tasks', 'edit')}" data-drag-day="${t.id}" title="${t.code} ${t.title}">${t.title}</a>`)}${(byDay[d] || []).length > 4 ? html`<small class="muted">+${byDay[d].length - 4} more</small>` : ''}</div>` : html`<div class="cal-d off"></div>`)}</div><p class="help">Drag a task to another day to change its due date. ⚑ = compliance deadline.</p></div>`;
  },
  mount(root, params) {
    if (params[0]) return TaskDetail.mount(root, params[0]);
    // Kanban drag & drop between status columns
    let dragId = null;
    $$('[data-drag]', root).forEach((c) => {
      c.addEventListener('dragstart', (e) => { dragId = c.dataset.drag; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
      c.addEventListener('dragend', () => c.classList.remove('dragging'));
    });
    $$('[data-drop]', root).forEach((col) => {
      col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', () => col.classList.remove('over'));
      col.addEventListener('drop', (e) => { e.preventDefault(); col.classList.remove('over'); const id = dragId || e.dataTransfer.getData('text/plain'); const t = DB.task(id); if (t && t.status !== col.dataset.drop) { Tasks.setStatus(t, col.dataset.drop); toast(`${t.code} → ${Lists.name('taskStatuses', col.dataset.drop)}`); } dragId = null; });
    });
    // Calendar drag to change due date
    $$('[data-drag-day]', root).forEach((c) => c.addEventListener('dragstart', (e) => { dragId = c.dataset.dragDay; e.dataTransfer.setData('text/plain', dragId); }));
    $$('[data-drop-day]', root).forEach((d) => {
      d.addEventListener('dragover', (e) => { e.preventDefault(); d.classList.add('over'); });
      d.addEventListener('dragleave', () => d.classList.remove('over'));
      d.addEventListener('drop', (e) => { e.preventDefault(); const t = DB.task(dragId || e.dataTransfer.getData('text/plain')); if (t) { const old = t.due; Store.commit(() => { t.due = d.dataset.dropDay; Rec.stamp(t); }); Auth.audit('edit', 'tasks', `${t.code} due date moved`, { recordId: t.id, old: { due: old }, new: { due: t.due } }); toast(`${t.code} due ${fmtDate(t.due)}`); } dragId = null; });
    });
  }
};

  }
};

          Auth.audit('create', 'services', `Service ${Lists.name('services', v.service)} added for ${c.code}`, { recordId: rec.id, new: v });
        } else {

      cols: [

        { key: 'status', label: 'Status', get: (s) => Lists.name('serviceStatuses', s.status), render: (s) => listBadge('serviceStatuses', s.status) },
        { key: 'dueDate', label: 'Due', render: (s) => fmtDate(s.dueDate) },
        { key: 'filedDate', label: 'Completed', render: (s) => fmtDate(s.filedDate) },
        { key: 'ackNo', label: 'Reference', render: (s) => s.ackNo ? html`<code>${s.ackNo}</code>` : '' },
        { key: 'a', label: '', sort: false, cls: 'act', render: (s) => html`<div class="row-acts">${btn('', 'svc:hist', { id: s.id, icon: 'audit', cls: 'icon-btn sm', title: 'History' })}${Auth.can('services', 'edit') ? btn('', 'svc:edit', { id: s.id, icon: 'edit', cls: 'icon-btn sm', title: 'Edit' }) : ''}${Auth.can('services', 'delete') ? btn('', 'svc:del', { id: s.id, icon: 'trash', cls: 'icon-btn sm', title: 'Delete' }) : ''}</div>` }
      ]
    });
  },
  /* Tracker cell status: stored value, else computed Overdue/Pending if client has this service. */
  dueDay() { return Number(Store.s.settings.filingDueDay) || 18; },
  cell(c, svcId, mk) {
    const v = Store.s.filings[`${c.id}|${svcId}|${mk}`];
    if (v) { if (v === 'P' && this.monthDue(mk) < today()) return 'O'; return v; }
    if (c.regDate && mk < monthKey(c.regDate)) return '';
    const has = Store.s.services.some((s) => s.clientId === c.id && s.service === svcId);
    if (!has) return '';
    return this.monthDue(mk) < today() ? 'O' : (mk <= monthKey(today()) ? 'P' : '');
  },
  monthDue(mk) { return addMonths(mk + '-01', 1).slice(0, 8) + pad(this.dueDay(), 2); },
  matrixClients(svcId) {

/* ==========================================================================
   11-compliance.js — Recurring deadlines calendar (monthly / quarterly / annual) with task generation.
   Editable deadlines; "Generate tasks for all active clients" for a deadline.
   ========================================================================== */
const FREQ = [{ value: 'monthly', label: 'Monthly' }, { value: 'quarterly', label: 'Quarterly' }, { value: 'annual', label: 'Annual' }];
const Compliance = {
  /* Due date of item inside a given month (YYYY-MM) or '' */
  dueIn(x, mk) {
    const m = +mk.slice(5); const last = new Date(+mk.slice(0, 4), m, 0).getDate(); const d = `${mk}-${pad(Math.min(Number(x.day) || 1, last), 2)}`;
    if (x.frequency === 'monthly') return d;
    const months = (x.months || []).map(Number);
    return months.includes(m) ? d : '';
  },
  nextDue(x, from = today()) {
    for (let i = 0; i < 24; i++) { const mk = monthKey(addMonths(from.slice(0, 8) + '01', i)); const d = this.dueIn(x, mk); if (d && d >= from) return d; }
    return '';
  },
  /* Period label the deadline relates to (previous month / quarter / year) */
  periodFor(x, due) {
    if (x.frequency === 'monthly') return monthLabel(monthKey(addMonths(due.slice(0, 8) + '01', -1)));
    if (x.frequency === 'quarterly') { const p = addMonths(due.slice(0, 8) + '01', -1); return `Quarter ending ${monthLabel(monthKey(p))}`; }
    return 'Tax Year ' + (due.slice(5, 7) >= '07' ? due.slice(0, 4) : String(+due.slice(0, 4) - 1));
  },
  open(x) {
    formModal({
      title: x ? 'Edit deadline' : 'New compliance deadline', size: 'md',
      fields: [
        { name: 'name', label: 'Deadline name', required: true, full: true },
        { name: 'authority', label: 'Category', type: 'select', list: 'authorities', required: true },
        { name: 'service', label: 'Linked service (for tasks)', type: 'select', list: 'services' },
        { name: 'frequency', label: 'Frequency', type: 'select', options: FREQ, required: true },
        { name: 'day', label: 'Due day of month', type: 'number', min: 1, max: 31, required: true },
        { name: 'months', label: 'Due months (quarterly / annual)', type: 'multi', options: MONTHS.map((m, i) => ({ value: String(i + 1), label: m })), full: true, help: 'Ignored for monthly deadlines' },
        { name: 'description', label: 'Notes', type: 'textarea', full: true, rows: 2 },
        { name: 'active', label: 'Active', type: 'checkbox' }
      ],
      values: x ? Object.assign(clone(x), { months: (x.months || []).map(String) }) : { frequency: 'monthly', day: 15, active: true, months: [] },
      onSubmit: (v) => {
        if (v.frequency !== 'monthly' && !v.months.length) return { months: 'Select at least one month' };
        v.months = v.months.map(Number);
        if (x) { const d = Auth.diff(x, v); Store.commit(() => Object.assign(x, v)); Auth.audit('edit', 'compliance', `Edited deadline ${v.name}`, { recordId: x.id, old: d.old, new: d.new }); }
        else { const rec = Object.assign({ id: uid('cp') }, v); Store.commit((s) => s.compliance.push(rec)); Auth.audit('create', 'compliance', `Added deadline ${v.name}`, { recordId: rec.id }); }
        toast('Deadline saved');
      }
    });
  },
  generate(x) {
    const nd = this.nextDue(x);
    formModal({
      title: 'Generate tasks', size: 'md', submit: 'Generate tasks',
      intro: html`<p>Creates one task per <b>active client</b> for <b>${x.name}</b>, assigned to each client's officer. Clients that already have this task for the same due date are skipped.</p>`,
      fields: [
        { name: 'due', label: 'Due date', type: 'date', required: true },
        { name: 'period', label: 'Period label', required: true },
        { name: 'onlySvc', label: `Only clients who have the "${Lists.name('services', x.service)}" service`, type: 'checkbox', full: true },
        { name: 'priority', label: 'Priority', type: 'select', list: 'priorities', required: true }
      ],
      values: { due: nd, period: this.periodFor(x, nd), onlySvc: !!x.service, priority: Lists.idByName('priorities', 'High') || (Lists.all('priorities')[0] || {}).id },
      onSubmit: async (v) => {
        const active = Lists.idByName('clientStatuses', 'Active');
        let list = Auth.clients().filter((c) => !active || c.status === active);
        if (v.onlySvc && x.service) list = list.filter((c) => Store.s.services.some((s) => s.clientId === c.id && s.service === x.service));
        const exists = (c) => Store.s.tasks.some((t) => t.clientId === c.id && t.complianceId === x.id && t.due === v.due);
        const todo = list.filter((c) => !exists(c));
        if (!todo.length) { toast('No new tasks to create — all eligible clients already have this task.', 'info'); return; }
        if (!(await confirmDlg(`Create ${todo.length} tasks (${list.length - todo.length} skipped as duplicates)?`, { ok: 'Create' }))) return false;
        const tp = Tasks.tpl(x.service); const byMember = {};
        Store.commit((s) => todo.forEach((c) => {
          const t = Rec.stamp({ id: uid('t'), clientId: c.id, service: x.service, title: `${x.name} — ${v.period}`, description: x.description || '', assignedTo: c.assignedTo || '', priority: v.priority, start: today(), due: v.due, status: Lists.firstStatus(), complianceId: x.id, subtasks: tp ? tp.checklist.map((i) => ({ id: uid('s'), text: i, done: false })) : [], comments: [], timeLog: [] }, true);
          t.code = Store.next('task'); s.tasks.push(t); if (c.assignedTo) byMember[c.assignedTo] = (byMember[c.assignedTo] || 0) + 1;
        }));
        Object.entries(byMember).forEach(([m, n]) => Notify.toMember(m, 'assignment', 'New compliance tasks', `${n} "${x.name}" tasks due ${fmtDate(v.due)} were assigned to you.`, '#/tasks'));
        Auth.audit('create', 'compliance', `Generated ${todo.length} tasks for ${x.name} (due ${v.due})`, { recordId: x.id });
        toast(`${todo.length} tasks created`);
      }
    });
  }
};

/* ==========================================================================
   12-invoices.js — Invoices (line items, discount, tax %, auto number),
   partial payments & receipts, client ledger/statement, aging, expenses,
   net profit. Printable invoice with logo via window.print().
   ========================================================================== */
const Invoices = {
  clientLabel(id) { const c = DB.client(id); return c ? `${c.code} · ${c.name}` : ''; },
  /* Searchable client box: filters while typing (name, code, phone, email, company). */
  bindClientPicker(box, form) {
    const q = box.querySelector('[data-cq]'); const hid = box.querySelector('[name=clientId]'); const list = box.querySelector('[data-clist]');
    let items = []; let idx = 0;
    const find = (t) => {
      const w = String(t || '').toLowerCase().split(/\s+/).filter(Boolean);
      return Auth.clients().filter((c) => { const hay = [c.name, c.code, c.mobile, c.whatsapp, c.email, c.businessName, c.father].join(' ').toLowerCase(); return w.every((x) => hay.includes(x)); }).sort((a, b) => a.name.localeCompare(b.name)).slice(0, 40);
    };
    const draw = () => {
      if (!items.length) { list.innerHTML = String(html`<div class="cpick-empty">${q.value.trim() ? 'No client found' : 'No clients yet'}</div>`); list.hidden = false; return; }
      list.innerHTML = items.map((c, i) => String(html`<div class="cpick-it ${i === idx ? 'on' : ''}" role="option" data-i="${i}"><b>${c.name}</b><small class="muted"> ${c.code}${c.mobile ? ' · ' + c.mobile : ''}${c.businessName ? ' · ' + c.businessName : ''}</small></div>`)).join(''); list.hidden = false;
      const on = list.querySelector('.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
    };
    const pick = (c) => { hid.value = c.id; q.value = `${c.code} · ${c.name}`; list.hidden = true; const e = form.querySelector('[data-e]'); if (e) e.textContent = ''; };
    const open = () => { items = find(hid.value && q.value === Invoices.clientLabel(hid.value) ? '' : q.value); idx = 0; draw(); };
    q.addEventListener('focus', () => { if (hid.value) q.select(); open(); });
    q.addEventListener('input', () => { hid.value = ''; open(); });
    q.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { idx = Math.min(items.length - 1, idx + 1); draw(); e.preventDefault(); }

  /* Plain-text version of the invoice for e-mail bodies. */
  emailText(inv) {
    const c = DB.client(inv.clientId) || {}; const t = DB.invTotal(inv); const paid = DB.invPaid(inv); const co = Store.s.settings.company || {};
    const L = [`Dear ${c.name || 'Customer'},`, '', `Please find the details of your invoice ${inv.number} below.`, '', `Invoice No: ${inv.number}`, `Invoice Date: ${fmtDate(inv.date)}`, `Due Date: ${fmtDate(inv.due)}`, '', 'Items:'];
    inv.items.forEach((it, i) => L.push(`${i + 1}. ${it.desc} — ${it.qty} x ${money(it.rate)} = ${money(it.qty * it.rate)}`));
    L.push('', `Subtotal: ${money(t.sub)}`);
    if (t.disc) L.push(`Discount: -${money(t.disc)}`);
    if (inv.taxPct) L.push(`Tax (${inv.taxPct}%): ${money(t.tax)}`);
    L.push(`TOTAL: ${money(t.total)}`);
    if (paid > 0) L.push(`Paid: ${money(paid)}`, `Remaining: ${money(Math.max(0, t.total - paid))}`);
    if (co.bank) L.push('', 'Payment details:', co.bank);
    if (inv.notes) L.push('', 'Notes:', inv.notes);
    L.push('', 'Thank you for your business.', '', 'Regards,', co.name || '', [co.phone, co.website].filter(Boolean).join(' | '));
    return L.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  },

  aging(invs) {
    const out = {};
    invs.forEach((i) => {
      const st = DB.invStatus(i); if (st === 'Draft' || st === 'Cancelled') return; const b = DB.invBalance(i); if (b <= 0) return;

    });
    return Object.values(out);

      ${tcText ? html`<div class="p-terms"><b>Terms &amp; Conditions${tcTpl && tcTpl.name ? ` — ${tcTpl.name}` : ''}</b><br><span style="white-space:pre-line">${tcText}</span></div>` : ''}

      <div class="p-foot">${co.invoiceFooter || ''}<br>${printFooter()}</div>
    </div>`);
    Auth.audit('export', 'invoices', `Printed invoice ${inv.number}`, { recordId: inv.id });
  },
  statement(c) {
    const invs = Store.s.invoices.filter((i) => i.clientId === c.id && i.status !== 'Draft' && i.status !== 'Cancelled');
    const pays = Store.s.payments.filter((p) => p.clientId === c.id);
    const rows = [...invs.map((i) => ({ date: i.date, ref: i.number, desc: 'Invoice', dr: DB.invTotal(i).total, cr: 0 })), ...pays.map((p) => ({ date: p.date, ref: p.number, desc: `Payment (${Lists.name('paymentMethods', p.method)}) — ${(DB.invoice(p.invoiceId) || {}).number || ''}`, dr: 0, cr: Number(p.amount) }))].sort((a, b) => (a.date > b.date ? 1 : -1));
    let bal = 0; rows.forEach((r) => { bal += r.dr - r.cr; r.bal = bal; });
    return { rows, bal };
  }
};

  }
};
