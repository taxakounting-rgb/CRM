<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM</title>
<meta name="description" content="Universal CRM & workflow management: clients, tasks, invoices, documents. Offline single-file app">
<meta name="color-scheme" content="light dark">
<style>
/* ===== Universal CRM — design tokens ===== */
:root{--black:#111;--brand:#D62828;--brand-d:#b51f1f;--on-brand:#fff;--brand-soft:rgba(214,40,40,.1);--ring:rgba(214,40,40,.18);--danger:#D62828;
  --side-bg:#111;--side-text:#d1d5db;--side-muted:#9ca3af;--side-hover:rgba(255,255,255,.07);--side-strong:#fff;--side-line:rgba(255,255,255,.1);--side-active:#b51f1f;--side-active-text:#fff;--hero-bg:#111;--white:#fff;--grey:#F4F5F7;
  --bg:#F4F5F7;--surface:#fff;--surface2:#f9fafb;--text:#111;--text2:#4b5563;--muted:#6b7280;--line:#e5e7eb;--line2:#eef0f3;
  --green:#15803d;--green-bg:#dcfce7;--amber:#a16207;--amber-bg:#fef3c7;--blue:#1d4ed8;--blue-bg:#dbeafe;--red:#b91c1c;--red-bg:#fee2e2;--greyb:#4b5563;--grey-bg:#eef0f3;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--shadow-lg:0 20px 50px rgba(16,24,40,.22);
  --r:12px;--side:248px;--top:60px;color-scheme:light}
:root[data-theme=dark]{--bg:#0f1115;--surface:#181b21;--surface2:#1f232b;--text:#f1f2f4;--text2:#c5c9d2;--muted:#9aa1ad;--line:#2b3039;--line2:#232831;
  --green:#4ade80;--green-bg:#143322;--amber:#fbbf24;--amber-bg:#3a2d0c;--blue:#93c5fd;--blue-bg:#16294a;--red:#fca5a5;--red-bg:#3d1717;--greyb:#c5c9d2;--grey-bg:#2a2f38;
  --brand:#e5484d;--brand-d:#D62828;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 20px 50px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px;line-height:1.45;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:22px;margin:0 0 2px;font-weight:700}h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:0 0 10px}h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
p{margin:0 0 10px}code{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;background:var(--grey-bg);padding:1px 5px;border-radius:5px}
.ic{width:18px;height:18px;fill:currentColor;flex:none;vertical-align:-4px}
.muted{color:var(--muted)}.sm{font-size:12.5px}.center{text-align:center}.right{text-align:right}.num{text-align:right;font-variant-numeric:tabular-nums}
.grow{flex:1}.mt{margin-top:14px}.strong{font-weight:600;color:var(--text)}.flex-c{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.block{width:100%;justify-content:center}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.late-txt{color:var(--red);font-weight:600}.warn-txt{color:var(--amber);font-weight:600}.danger-txt{color:var(--red)!important}
.code{font-family:Consolas,monospace;font-weight:700;color:var(--brand);background:transparent}.code.big{font-size:15px;margin-left:6px;background:var(--brand-soft);padding:2px 8px;border-radius:6px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

/* ===== Buttons & inputs ===== */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--surface2);border-color:#c9ced6}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}.btn.primary:hover{background:var(--brand-d)}
.btn.danger{background:var(--red-bg);color:var(--red);border-color:transparent}.btn.ghost{background:transparent}
.btn.wa{background:#e7f8ee;color:#128c4a;border-color:#bfe9d0}:root[data-theme=dark] .btn.wa{background:#103222;color:#4ade80;border-color:#1d4d33}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}.btn.lg{padding:12px 18px;font-size:15px}
.btn.ghost-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--text2);cursor:pointer;padding:0;position:relative;font:inherit;font-weight:700}
.icon-btn:hover{background:var(--grey-bg);color:var(--text);text-decoration:none}.icon-btn.sm{width:30px;height:30px}.icon-btn.on{background:var(--grey-bg);color:var(--brand)}.icon-btn.wa{color:#128c4a}
.inp,.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:9px 11px;font:inherit;transition:border-color .15s,box-shadow .15s}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.inp.sm{padding:5px 8px;font-size:12.5px;width:auto}
textarea{resize:vertical}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.fld>span{font-weight:600;font-size:12.5px;color:var(--text2)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--red);box-shadow:0 0 0 3px rgba(185,28,28,.12)}
.req{color:var(--brand);margin-left:2px}.err{color:var(--red);font-size:12.5px;min-height:0;margin:0}.help{color:var(--muted);font-size:12px}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}.chk input{width:16px;height:16px;accent-color:var(--brand)}
.grid-form{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.grid-form .full{grid-column:1/-1}
.form-sec{grid-column:1/-1;margin:6px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}.form-intro{margin-bottom:12px}
.multi{display:flex;flex-wrap:wrap;gap:6px}.pill-chk input{display:none}.pill-chk span{display:inline-block;padding:5px 11px;border:1px solid var(--line);border-radius:20px;cursor:pointer;font-size:12.5px}
.pill-chk input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.img-pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.img-pick img{width:64px;height:64px;object-fit:cover;border-radius:50%;border:1px solid var(--line)}
.pw-wrap{position:relative}.pw-wrap input{padding-right:44px;width:100%}.pw-wrap .icon-btn{position:absolute;right:3px;top:50%;transform:translateY(-50%)}.pw-wrap .icon-btn.on{color:var(--brand)}
.pw-meter{height:5px;border-radius:4px;background:var(--grey-bg);overflow:hidden}.pw-meter i{display:block;height:100%;width:0;transition:width .2s,background .2s}
.pw-meter[data-s="1"] i{width:25%;background:#dc2626}.pw-meter[data-s="2"] i{width:50%;background:#f59e0b}.pw-meter[data-s="3"] i{width:75%;background:#22c55e}.pw-meter[data-s="4"] i{width:100%;background:#15803d}
.otp{font-size:24px;letter-spacing:.4em;text-align:center;font-family:Consolas,monospace}

/* ===== Badges, chips, progress ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;margin:1px 2px 1px 0;line-height:1.6}
.badge[style]{background:color-mix(in srgb,var(--bc) 16%,transparent);color:color-mix(in srgb,var(--bc) 78%,var(--text))}
.b-green{background:var(--green-bg);color:var(--green)}.b-amber{background:var(--amber-bg);color:var(--amber)}.b-blue{background:var(--blue-bg);color:var(--blue)}.b-red{background:var(--red-bg);color:var(--red)}.b-grey{background:var(--grey-bg);color:var(--greyb)}.b-black{background:#111;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.chip{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.chip-b,.chip-x{border:0;background:transparent;color:var(--text);padding:4px 10px;cursor:pointer;font:inherit;font-size:12.5px}.chip-x{padding:4px 8px;color:var(--muted)}.chip-b:hover,.chip-x:hover{background:var(--grey-bg)}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--grey-bg);color:var(--text2);font-size:11px;font-weight:700;text-align:center}.cnt.warn{background:var(--brand);color:var(--on-brand)}
.prog{height:6px;background:var(--grey-bg);border-radius:4px;overflow:hidden;margin:5px 0;min-width:80px}.prog i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .3s}
.prog.green i{background:#1baf7a}.prog.amber i{background:#eda100}.prog.red i{background:var(--danger)}
.avatar{display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--hero-bg),color-mix(in srgb,var(--hero-bg) 70%,#fff));color:#fff;font-weight:700;flex:none;object-fit:cover}
.nbadge{position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:10px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}

/* ===== Notes / alerts ===== */
.note{padding:11px 14px;border-radius:10px;margin-bottom:14px;background:var(--blue-bg);color:var(--blue);border:1px solid transparent}
.note.ok{background:var(--green-bg);color:var(--green)}.note.warn{background:var(--amber-bg);color:var(--amber)}.note.err{background:var(--red-bg);color:var(--red)}
.note-card{border-left:4px solid var(--brand)}

/* ===== Auth screens ===== */
.boot{min-height:100vh;display:grid;place-items:center;align-content:center;gap:20px}.boot-logo{width:180px;color:var(--text)}
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:var(--bg)}
.auth-brand{background:var(--hero-bg);color:#fff;padding:56px 56px 32px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.auth-brand::after{content:"";position:absolute;right:-80px;bottom:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--brand) 60%,transparent),transparent 70%)}
.auth-logo{width:230px;color:#fff}.auth-logo svg,.auth-logo img{display:block;width:100%;height:auto}
.auth-brand h1{font-size:30px;margin:28px 0 8px}.auth-brand>p{color:#d1d5db;max-width:420px;font-size:15px}
.auth-feats{list-style:none;padding:0;margin:20px 0;display:grid;gap:10px}.auth-feats li{display:flex;gap:10px;align-items:center;color:#e5e7eb}.auth-feats .ic{color:var(--on-brand);background:var(--brand);border-radius:50%;padding:3px;width:22px;height:22px}
.auth-foot{margin-top:auto;color:#9ca3af;font-size:12.5px;position:relative;z-index:1}
.auth-side{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:14px}
.auth-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:var(--shadow-lg);animation:rise .3s ease}
.auth-card h2{font-size:22px;margin-bottom:4px}.auth-card form{margin-top:18px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--grey-bg);border-radius:10px;padding:4px;margin-bottom:22px}
.auth-tabs button{border:0;background:transparent;padding:9px;border-radius:8px;font:inherit;font-weight:600;color:var(--text2);cursor:pointer}.auth-tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.auth-hint{max-width:440px;width:100%;font-size:13px;padding:10px 14px;border-radius:10px;background:var(--amber-bg);color:var(--amber)}
.auth-card .row-between{margin:2px 0 12px;font-size:13px}.auth-card .btn.block{margin-top:8px}
.theme-mini{color:var(--muted)}
.qr-box{display:grid;place-items:center;margin:12px 0}.qr-box svg{border:1px solid var(--line);border-radius:8px;max-width:220px;height:auto}
.secret{font-size:15px;letter-spacing:.06em;padding:6px 10px;display:inline-block;margin-top:4px;word-break:break-all}
.lock-wrap{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#2a2a2a,#0b0b0b);padding:20px}
.lock-card{text-align:center;max-width:380px}.lock-card .avatar{margin:6px auto 10px}.lock-logo{width:130px;margin:0 auto 12px;color:var(--text)}.lock-logo svg{width:100%;height:auto}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Shell ===== */
.shell{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--side-bg);color:var(--side-text);border-right:1px solid var(--side-line);display:flex;flex-direction:column;z-index:40;transition:width .2s ease,transform .25s ease}
.side-top{display:flex;align-items:center;gap:6px;padding:12px 12px 8px}
.side-logo{display:block;color:var(--side-strong);width:150px;padding:2px 0;transition:width .2s}.side-logo svg,.side-logo img{display:block;width:100%;height:auto}
.side-collapse{color:var(--side-muted);margin-left:auto;font-size:18px}.side-collapse:hover{background:var(--side-hover);color:var(--side-strong)}
#sidenav{flex:1;overflow-y:auto;padding:6px 10px}
.nav-it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--side-text);font-weight:500;position:relative;margin-bottom:2px;white-space:nowrap}
.nav-it:hover{background:var(--side-hover);color:var(--side-strong);text-decoration:none}.nav-it.on{background:var(--side-active);color:var(--side-active-text)}.nav-it .nbadge{position:static;margin-left:auto}
.side-user{border-top:1px solid var(--side-line);padding:10px}.su{display:flex;gap:10px;align-items:center;color:var(--side-strong);padding:6px;border-radius:9px}.su:hover{background:var(--side-hover);text-decoration:none}.su span{display:flex;flex-direction:column;overflow:hidden}.su small{color:var(--side-muted)}
.mainwrap{flex:1;margin-left:var(--side);min-width:0;display:flex;flex-direction:column;min-height:100vh;transition:margin .2s}
.side-min .side{width:72px}.side-min .mainwrap{margin-left:72px}.side-min .nav-it span,.side-min .su span,.side-min .nav-it .nbadge{display:none}.side-min .side-logo{width:44px;overflow:hidden}.side-min .side-logo svg{width:150px;max-width:none}.side-min .side-top{flex-direction:column}.side-min .side-collapse{transform:rotate(180deg);margin:0}.side-min .nav-it{justify-content:center}
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:8px;padding:0 20px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search-btn{display:flex;align-items:center;gap:10px;min-width:280px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--muted);font:inherit;cursor:pointer}.search-btn kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--surface)}
.branch-sel{width:auto;max-width:200px}
.umenu{position:relative}.ubtn{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--text);font:inherit;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:9px}.ubtn:hover{background:var(--grey-bg)}
.udrop{position:fixed;right:14px;top:calc(var(--top) - 4px);width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:60;animation:rise .15s}
.udrop a,.udrop button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border:0;background:transparent;color:var(--text);font:inherit;border-radius:8px;cursor:pointer;text-align:left}.udrop a:hover,.udrop button:hover{background:var(--grey-bg);text-decoration:none}
.ud-h{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;flex-direction:column}.ud-h small{color:var(--muted)}
#main{flex:1;padding:22px 24px 30px;outline:none;animation:fadein .2s}
@keyframes fadein{from{opacity:.4}to{opacity:1}}
.foot{padding:14px 24px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);text-align:center}
.bnav{display:none}.only-m{display:none!important}.side-scrim{display:none}

/* ===== Page parts ===== */
.page-actions .inp{width:auto}.rep-layout .tbl td,.tbl td .code{white-space:nowrap}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.card-h h3{margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px}.filters .inp{width:auto;min-width:150px}.filters input[type=search]{min-width:240px;flex:1}
.inp-date{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.inp-date .inp{min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px}
.saved-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;border-top:1px dashed var(--line);padding-top:8px}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--blue-bg);border-color:transparent;position:sticky;top:calc(var(--top) + 6px);z-index:5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid2>div>.card:last-child{margin-bottom:16px}
.grid-31{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,1fr);gap:16px;align-items:start}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:transparent;padding:10px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text);text-decoration:none}.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:7px 16px;margin:0}.kv dt{color:var(--muted);font-size:13px}.kv dd{margin:0;font-weight:500;word-break:break-word}
.list{list-style:none;margin:0;padding:0}.list>li{padding:9px 0;border-bottom:1px solid var(--line2)}.list>li:last-child{border-bottom:0}
.empty{text-align:center;padding:42px 20px;color:var(--text2)}.empty-ic{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--grey-bg);margin-bottom:10px}.empty-ic .ic{width:26px;height:26px;color:var(--muted)}.empty h3{margin-bottom:4px}
.skel-wrap{display:grid;gap:10px;width:min(420px,90vw)}.skel{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--grey-bg),var(--surface2),var(--grey-bg));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.row-acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ===== Tables ===== */
.tbl-wrap{overflow:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap;position:sticky;top:0;z-index:1}
.tbl th.sortable{cursor:pointer}.tbl th.sortable:hover{color:var(--text)}.tbl th.num{text-align:right}.tbl th.center{text-align:center}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tbody tr:hover{background:var(--surface2)}.tbl .cb{width:36px}.tbl .act{width:1%;white-space:nowrap}
.row-late td:first-child{box-shadow:inset 3px 0 0 var(--danger)}.row-warn td:first-child{box-shadow:inset 3px 0 0 #eda100}.row-bad{background:var(--red-bg)}
.pager{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}.pager select{width:auto;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}
.status-sel{max-width:150px}
.matrix th,.matrix td{padding:6px;text-align:center}.matrix .sticky{position:sticky;left:0;background:var(--surface);text-align:left;z-index:2;white-space:nowrap;min-width:200px}.matrix thead .sticky{background:var(--surface2);z-index:3}

.w-list{display:flex;flex-direction:column}.mini-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line2)}.mini-row:last-child{border:0}.mr-main{display:flex;flex-direction:column;min-width:0}.mr-main a{color:var(--text)}.mr-side{text-align:right;white-space:nowrap;font-size:12.5px}.mini-row.late .mr-main b{color:var(--red)}

.tip{position:fixed;z-index:999;background:#111;color:#fff;padding:6px 9px;border-radius:7px;font-size:12px;pointer-events:none;max-width:280px;box-shadow:var(--shadow-lg)}

.ccard-b{display:grid;gap:5px;color:var(--text2);margin-bottom:10px}.ccard-b .ic{width:15px;height:15px;color:var(--muted)}.ccard-f{display:flex;align-items:center;flex-wrap:wrap;gap:4px;border-top:1px solid var(--line2);padding-top:8px}

.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0 12px}
.inline-form{display:flex;gap:8px;margin-top:10px}.inline-form .inp{flex:1}

/* ===== Kanban & calendar ===== */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(205px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}

.kcol-h{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}.kcol-h i{width:10px;height:10px;border-radius:50%}.kcol-h .cnt{margin-left:auto;background:var(--surface)}
.kcol-b{display:flex;flex-direction:column;gap:8px;flex:1}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px;cursor:grab;box-shadow:var(--shadow);transition:transform .1s}

.cal-t.late{background:var(--red-bg);color:var(--red)}.cal-t.done{background:var(--green-bg);color:var(--green);text-decoration:line-through}.cal-comp{font-size:11px;color:var(--amber);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.ym{margin:0}.ym.cur{border-color:var(--brand)}.ym ul{list-style:none;padding:0;margin:0;font-size:12.5px;display:grid;gap:6px}.ym li.past{opacity:.5}.ym li b{display:inline-block;width:22px;color:var(--brand)}

/* ===== Documents, notifications, reports, settings ===== */

.pv-img{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:8px}.pv-pdf{width:100%;height:72vh;border:0;border-radius:8px;background:#fff}.pv-txt{max-height:70vh;overflow:auto;background:var(--surface2);padding:12px;border-radius:8px;white-space:pre-wrap}.pv-meta{margin-bottom:10px}

.nlist{list-style:none;margin:0;padding:0}.nlist li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line2)}.nlist li>a{flex:1;color:var(--text)}.nlist li>a:hover{text-decoration:none}.nlist li.unread{background:color-mix(in srgb,var(--blue-bg) 50%,transparent)}.nlist li.unread b:before{content:"● ";color:var(--brand)}
.n-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--grey-bg);flex:none;color:var(--text2)}.n-ic.t-overdue,.n-ic.t-invoice{background:var(--red-bg);color:var(--red)}.n-ic.t-deadline,.n-ic.t-expiry,.n-ic.t-password{background:var(--amber-bg);color:var(--amber)}.n-ic.t-assignment,.n-ic.t-mention{background:var(--blue-bg);color:var(--blue)}
.rep-layout,.lists-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.rep-nav{padding:12px;position:sticky;top:calc(var(--top) + 12px)}.rep-it{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:var(--text);font:inherit;padding:8px 10px;border-radius:8px;cursor:pointer}.rep-it:hover{background:var(--grey-bg)}.rep-it.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.rep-it-row{display:flex;align-items:center}.rep-tot{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.rep-tot span{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column}.rep-tot small{color:var(--muted)}
.col-pick{display:grid;gap:8px}
.ml{list-style:none;padding:0;margin:0}.ml li{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2)}.ml li .inp{flex:1;min-width:120px}.ml li .inp.sm{flex:0 1 160px}.ml input[type=color]{width:36px;height:32px;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--surface)}
.ml .drag{cursor:grab;color:var(--muted);padding:0 4px}.ml li.dragging{opacity:.4}
.logo-prev{width:240px;margin-bottom:10px;color:var(--text)}.logo-prev svg,.logo-prev img{display:block;width:100%;height:auto}
details.diff{font-size:12px;color:var(--muted);margin-top:3px}details.diff summary{cursor:pointer}

/* ===== Modal, palette, toast ===== */
.modal-wrap{position:fixed;inset:0;background:rgba(10,12,16,.55);display:grid;place-items:center;z-index:100;padding:16px;opacity:0;transition:opacity .18s}

.palette{align-self:start;margin-top:10vh}.pal-res{max-height:52vh;overflow:auto;margin:10px 0}.pal-it{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:9px;cursor:pointer}.pal-it.on,.pal-it:hover{background:var(--brand-soft)}
.pal-k{font-size:10.5px;text-transform:uppercase;font-weight:800;color:var(--muted);width:66px;flex:none}.pad{padding:14px}
#toast-root{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:300;max-width:calc(100vw - 36px)}
.toast{display:flex;align-items:center;gap:12px;background:#111;color:#fff;padding:11px 12px 11px 16px;border-radius:11px;box-shadow:var(--shadow-lg);min-width:260px;animation:rise .2s;border-left:4px solid #1baf7a;transition:opacity .25s,transform .25s}
.toast.t-err{border-left-color:var(--danger)}.toast.t-warn{border-left-color:#eda100}.toast.t-info{border-left-color:#2a78d6}.toast.out{opacity:0;transform:translateX(20px)}
.toast span{flex:1}.toast .x{background:transparent;border:0;color:#9ca3af;font-size:18px;cursor:pointer}

/* ===== Print ===== */
#print-area{display:none}

  body.printing #print-area{display:block!important}
  body{background:#fff!important;color:#111!important;font-size:12px}
  @page{margin:0;size:auto}
  body.printing #print-area{padding:14mm!important;box-sizing:border-box}
}
#print-area{color:#111;background:#fff;font-family:Arial,Helvetica,sans-serif}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--print-accent,#111);-webkit-print-color-adjust:exact;print-color-adjust:exact;padding-bottom:10px;margin-bottom:14px}

.inv-meta{display:flex;justify-content:space-between;gap:20px;margin:10px 0 6px}.inv-meta small{display:block;color:var(--print-accent,#111);font-weight:700;letter-spacing:.08em}.meta-t td{padding:2px 6px}
.p-terms{font-size:11px;color:#444;border-top:1px solid #ddd;padding-top:8px;margin-top:10px;white-space:pre-wrap}.p-foot{text-align:center;font-size:10.5px;color:#666;margin-top:24px;border-top:1px solid #ddd;padding-top:8px}
.p-sign{margin:50px 0 0 auto;width:220px;border-top:1px solid #111;text-align:center;padding-top:4px;font-size:11px}
#print-area .kv{grid-template-columns:180px 1fr}#print-area .kv dt{color:#555}#print-area .badge{background:#eee;color:#111}

/* ===== Responsive ===== */
@media (max-width:1100px){.grid-dash{grid-template-columns:1fr 1fr}.grid-dash .span2{grid-column:1/-1}.grid-31{grid-template-columns:1fr}}
@media (max-width:860px){
  .auth-wrap{grid-template-columns:1fr}.auth-brand{padding:24px 20px;align-items:center;text-align:center}.auth-brand h1{font-size:22px;margin-top:14px}.auth-brand>p,.auth-feats,.auth-foot{display:none}.auth-logo{width:160px}.auth-card{padding:22px 18px}
  .side{transform:translateX(-100%);width:270px!important;box-shadow:var(--shadow-lg)}.mainwrap{margin-left:0!important}.nav-open .side{transform:none}.nav-open .side-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}

  #main{padding:14px 12px 90px}.foot{padding-bottom:80px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:45;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}

  .grid2,.grid-dash,.rep-layout,.lists-layout{grid-template-columns:1fr}.rep-nav{position:static}
  .grid-form{grid-template-columns:1fr}

  .filters .inp,.filters input[type=search]{min-width:0;flex:1 1 140px}

  .modal-wrap{padding:0;place-items:end center}.modal{border-radius:16px 16px 0 0;max-height:94vh;width:100%!important}
  .kanban{grid-auto-columns:82vw}.cal-d{min-height:64px}.cal-t{font-size:10px;padding:1px 3px}.cal-comp{display:none}
  .page-head h1{font-size:19px}.kpis{grid-template-columns:repeat(2,1fr)}.kpi b{font-size:19px}
  #toast-root{left:12px;right:12px;bottom:76px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Theme picker ===== */

<body>
<div id="app"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="print-area"></div>
<script>
/* ==========================================================================
   00-core.js — utilities, safe HTML templating, Store (reactive state with
   localStorage + IndexedDB mirror), counters, master-list helpers, IDB blobs.
   ========================================================================== */
'use strict';

/* ---------- Small utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = (o) => JSON.parse(JSON.stringify(o));
const debounce = (fn, ms = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const pad = (n, w) => String(n).padStart(w, '0');
const sum = (arr, f = (x) => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const groupBy = (arr, f) => arr.reduce((m, x) => { const k = f(x); (m[k] = m[k] || []).push(x); return m; }, {});

/* Escape any value for HTML text/attribute context. */
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"'`]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));
}
/* Trusted HTML wrapper; html`` escapes every interpolation unless it is Raw. */
class Raw { constructor(s) { this.s = String(s); } toString() { return this.s; } }
const raw = (s) => new Raw(s);
function html(strings, ...vals) {
  let out = strings[0];
  vals.forEach((v, i) => { out += htmlVal(v) + strings[i + 1]; });
  return raw(out);
}
function htmlVal(v) {
  if (v instanceof Raw) return v.s;
  if (Array.isArray(v)) return v.map(htmlVal).join('');
  if (v === false || v === null || v === undefined) return '';
  return esc(v);
}

/* ---------- Dates & formatting ---------- */
const today = () => isoDate(new Date());
function isoDate(d) { d = new Date(d); return isNaN(d) ? '' : `${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)}`; }
function addDays(d, n) { const x = new Date(d + (String(d).length === 10 ? 'T00:00:00' : '')); x.setDate(x.getDate() + n); return isoDate(x); }
function addMonths(d, n) { const x = new Date(d + 'T00:00:00'); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return isoDate(x); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5); }
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(d) { if (!d) return '—'; const x = new Date(String(d).length === 10 ? d + 'T00:00:00' : d); return isNaN(x) ? '—' : `${pad(x.getDate(), 2)} ${MONTHS[x.getMonth()]} ${x.getFullYear()}`; }
function fmtDateTime(d) { if (!d) return '—'; const x = new Date(d); return `${fmtDate(x)} ${pad(x.getHours(), 2)}:${pad(x.getMinutes(), 2)}`; }
function timeAgo(d) {
  const s = (Date.now() - new Date(d).getTime()) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago'; if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return fmtDate(d);
}
const numFmt = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
const curInfo = () => { const c = (typeof Store !== 'undefined' && Store.s && Store.s.settings && Store.s.settings.currency) || {}; return { code: c.code || 'USD', symbol: c.symbol || '$' }; };
const curCode = () => curInfo().code;
const curSym = (s = curInfo().symbol) => (/^[A-Za-z]/.test(s) ? s + ' ' : s);
const money = (n) => { n = Math.round(Number(n) || 0); return (n < 0 ? '-' : '') + curSym() + numFmt.format(Math.abs(n)); };
const moneyShort = (n) => { n = Number(n) || 0; const a = Math.abs(n); const sg = n < 0 ? '-' : ''; const y = curSym(); return a >= 1e9 ? sg + y + (a / 1e9).toFixed(1) + 'B' : a >= 1e6 ? sg + y + (a / 1e6).toFixed(1) + 'M' : a >= 1e3 ? sg + y + (a / 1e3).toFixed(0) + 'K' : sg + y + Math.round(a); };
const fmtSize = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1024).toFixed(0) + ' KB';
const monthKey = (d) => String(d || '').slice(0, 7);
const monthLabel = (k) => { const [y, m] = k.split('-'); return MONTHS[+m - 1] + ' \u2019' + y.slice(2); };

/* ---------- Event bus ---------- */
const Bus = {
  h: {},
  on(e, f) { (this.h[e] = this.h[e] || []).push(f); return () => { this.h[e] = this.h[e].filter((x) => x !== f); }; },
  emit(e, d) { (this.h[e] || []).slice().forEach((f) => { try { f(d); } catch (err) { console.warn('Bus handler failed', e, err); } }); }
};

/* ---------- IndexedDB (documents blobs, snapshots, state mirror) ---------- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB not available'));
      const r = indexedDB.open('universal_crm', 1);
      r.onupgradeneeded = () => { const d = r.result; ['blobs', 'snapshots', 'kv'].forEach((s) => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); }); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const s = t.objectStore(store); let out;
      const r = fn(s); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(store, k) { return this.tx(store, 'readonly', (s) => s.get(k)); },
  put(store, k, v) { return this.tx(store, 'readwrite', (s) => s.put(v, k)); },
  del(store, k) { return this.tx(store, 'readwrite', (s) => s.delete(k)); },
  keys(store) { return this.tx(store, 'readonly', (s) => s.getAllKeys()); },
  clear(store) { return this.tx(store, 'readwrite', (s) => s.clear()); }
};

/* ---------- Store: single source of truth ---------- */
const LS_KEY = 'universal_crm_state_v1';
const Store = {
  s: null,
  saveTimer: null,
  lastWarn: 0,
  blank() {
    return {
      v: 1, savedAt: 0, createdAt: new Date().toISOString(),
      counters: { client: {}, task: 0, emp: 0, inv: 0, doc: 0, pay: 0, exp: 0, rcpt: 0, prj: 0 },
      settings: {}, lists: {}, roles: [], users: [],
      clients: [], team: [], tasks: [], services: [], filings: {}, compliance: [],
      invoices: [], payments: [], expenses: [], projects: [], documents: [], creds: [], notes: [],
      timeline: [], followups: [], notifications: [], audit: [], savedFilters: [], reportTemplates: [], deleted: []
    };
  },
  async load() {
    let a = null, b = null;
    try { a = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { a = null; }
    try { b = await IDB.get('kv', 'state'); } catch (e) { b = null; }
    const pick = (a && b) ? ((b.savedAt || 0) > (a.savedAt || 0) ? b : a) : (a || b);
    this.s = Object.assign(this.blank(), pick || {});
    return !!pick;
  },
  /* Mutate state and notify. meta: {silent} */
  commit(fn, meta = {}) {
    if (!meta.silent && !meta.allowRO && typeof License !== 'undefined' && License.readOnly()) { License.blocked(); return undefined; }
    const r = fn(this.s);
    this.scheduleSave();
    if (!meta.silent) Bus.emit('change', meta);
    return r;
  },
  scheduleSave() { clearTimeout(this.saveTimer); this.saveTimer = setTimeout(() => this.saveNow(), 120); },
  saveNow() {
    clearTimeout(this.saveTimer); this.saveTimer = null;
    this.s.savedAt = Date.now();
    const json = JSON.stringify(this.s);
    try { localStorage.setItem(LS_KEY, json); }
    catch (e) {
      if (Date.now() - this.lastWarn > 60000) { this.lastWarn = Date.now(); if (window.toast) toast('Browser storage is full. Data is kept in IndexedDB; please export a backup.', 'warn'); }
    }
    IDB.put('kv', 'state', JSON.parse(json)).catch(() => {});
    if (typeof Cloud !== 'undefined') Cloud.schedule();
  },
  /* Next auto-number from counters with configurable prefix. */
  next(kind) {
    const map = { task: ['task', 4], emp: ['emp', 3], inv: ['inv', 4], doc: ['doc', 4], pay: ['pay', 4], exp: ['exp', 4], rcpt: ['rcpt', 4], prj: ['prj', 4] };
    const [k, w] = map[kind];
    this.s.counters[k] = (this.s.counters[k] || 0) + 1;
    const pre = (this.s.settings.prefixes || {})[k] ?? '';
    return pre + pad(this.s.counters[k], w);
  },
  /* Client code: first letter of name + next number for that letter. Checks existing codes. */
  clientCode(name) {
    const L = (String(name).trim().match(/[A-Za-z]/) || ['X'])[0].toUpperCase();
    const used = this.s.clients.filter((c) => c.code && c.code[0] === L).map((c) => parseInt(c.code.slice(1), 10) || 0);
    const n = Math.max(this.s.counters.client[L] || 0, used.length ? Math.max(...used) : 0) + 1;
    this.s.counters.client[L] = n;
    return L + n;
  }
};

/* ---------- Master lists (records store item ids; names resolve dynamically) ---------- */
const Lists = {
  defs: {
    services: 'Services / Products', businessTypes: 'Client Types', designations: 'Designations', departments: 'Departments',
    taskStatuses: 'Task Statuses', priorities: 'Priorities', docCategories: 'Document Categories', portals: 'Portals / Accounts',
    branches: 'Branches', clientStatuses: 'Client Statuses', paymentMethods: 'Payment Methods', expenseCategories: 'Expense Categories', tags: 'Client Tags',
    serviceStatuses: 'Service Statuses', staffStatuses: 'Staff Statuses', authorities: 'Deadline Categories'
  },
  all(k) { return Store.s.lists[k] || []; },
  get(k, id) { return this.all(k).find((x) => x.id === id); },
  name(k, id) { const x = this.get(k, id); return x ? x.name : (id ? '—' : '—'); },
  idByName(k, name) { const n = String(name || '').trim().toLowerCase(); const x = this.all(k).find((i) => i.name.toLowerCase() === n); return x ? x.id : ''; },
  options(k, sel) { return this.all(k).map((x) => html`<option value="${x.id}" ${x.id === sel ? raw('selected') : ''}>${x.name}</option>`); },
  doneStatus() { return (this.all('taskStatuses').find((x) => x.done) || {}).id; },
  firstStatus() { return (this.all('taskStatuses')[0] || {}).id; },
  isDone(id) { const x = this.get('taskStatuses', id); return !!(x && x.done); }
};

/* ---------- Lookups ---------- */
const DB = {
  client: (id) => Store.s.clients.find((c) => c.id === id),
  clientByCode: (code) => Store.s.clients.find((c) => c.code === code),
  member: (id) => Store.s.team.find((m) => m.id === id),
  memberName: (id) => (Store.s.team.find((m) => m.id === id) || {}).name || 'Unassigned',
  user: (id) => Store.s.users.find((u) => u.id === id),
  task: (id) => Store.s.tasks.find((t) => t.id === id),
  invoice: (id) => Store.s.invoices.find((i) => i.id === id),
  invPaid: (inv) => sum(Store.s.payments.filter((p) => p.invoiceId === inv.id), (p) => p.amount),
  invTotal(inv) {
    const sub = sum(inv.items || [], (i) => (Number(i.qty) || 0) * (Number(i.rate) || 0));
    const disc = Number(inv.discount) || 0; const taxable = Math.max(0, sub - disc);
    const tax = taxable * (Number(inv.taxPct) || 0) / 100;
    return { sub, disc, tax, total: Math.round(taxable + tax) };
  },
  invStatus(inv) {
    if (inv.status === 'Draft' || inv.status === 'Cancelled') return inv.status;
    const t = this.invTotal(inv).total; const p = this.invPaid(inv);
    if (t > 0 && p >= t) return 'Paid';
    if (inv.due && inv.due < today()) return 'Overdue';
    if (p > 0) return 'Partially Paid';
    return 'Sent';
  },
  invBalance(inv) { return Math.max(0, this.invTotal(inv).total - this.invPaid(inv)); },
  isOverdue(t) { return t.due && t.due < today() && !Lists.isDone(t.status); }
};

/* Flush any pending (debounced) save when the tab is closed, refreshed or hidden. */
['pagehide', 'beforeunload'].forEach((e) => window.addEventListener(e, () => { if (Store.s && Store.saveTimer) Store.saveNow(); }));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && Store.s && Store.saveTimer) Store.saveNow(); });

/* ==========================================================================
   01-crypto.js — Web Crypto helpers: salted password hashing (PBKDF2-SHA-256),
   vault key derivation (PBKDF2) + AES-GCM, TOTP (RFC 6238), QR code encoder.
   ========================================================================== */
const Crypto = {
  enc: new TextEncoder(),
  dec: new TextDecoder(),
  ok() { return !!(window.crypto && crypto.subtle); },
  rand(n) { return crypto.getRandomValues(new Uint8Array(n)); },
  b64(buf) { let s = ''; new Uint8Array(buf).forEach((b) => { s += String.fromCharCode(b); }); return btoa(s); },
  unb64(s) { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; },
  hex(buf) { return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join(''); },
  async sha256(text) { return this.hex(await crypto.subtle.digest('SHA-256', this.enc.encode(text))); },

  /* Password hash: PBKDF2-HMAC-SHA-256 with a per-user random salt. Never stores plain text. */
  newSalt() { return this.b64(this.rand(16)); },
  async hashPassword(pw, salt, iter = 120000) {
    const base = await crypto.subtle.importKey('raw', this.enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: this.unb64(salt), iterations: iter }, base, 256);
    return this.hex(bits);
  },
  /* Constant-time-ish compare */
  same(a, b) { if (!a || !b || a.length !== b.length) return false; let r = 0; for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i); return r === 0; },

  /* Vault: AES-GCM 256 key derived from the Vault PIN with PBKDF2 (per-vault salt). */
  async deriveVaultKey(pin, salt, iter) {
    const base = await crypto.subtle.importKey('raw', this.enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: this.unb64(salt), iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async encrypt(key, text) {
    const iv = this.rand(12);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, this.enc.encode(text));
    return { iv: this.b64(iv), ct: this.b64(ct) };
  },
  async decrypt(key, obj) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: this.unb64(obj.iv) }, key, this.unb64(obj.ct));
    return this.dec.decode(pt);
  },

  /* ---- TOTP (RFC 6238, SHA-1, 6 digits, 30 s) ---- */
  B32: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',
  base32(bytes) {
    let bits = 0, val = 0, out = '';
    bytes.forEach((b) => { val = (val << 8) | b; bits += 8; while (bits >= 5) { out += this.B32[(val >>> (bits - 5)) & 31]; bits -= 5; } });
    if (bits > 0) out += this.B32[(val << (5 - bits)) & 31];
    return out;
  },
  unbase32(s) {
    s = s.replace(/[\s=]/g, '').toUpperCase(); let bits = 0, val = 0; const out = [];
    for (const c of s) { const i = this.B32.indexOf(c); if (i < 0) continue; val = (val << 5) | i; bits += 5; if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; } }
    return new Uint8Array(out);
  },
  newTotpSecret() { return this.base32(this.rand(20)); },
  async totp(secret, t = Date.now(), step = 30) {
    const ctr = Math.floor(t / 1000 / step); const msg = new Uint8Array(8);
    let c = ctr; for (let i = 7; i >= 0; i--) { msg[i] = c & 255; c = Math.floor(c / 256); }
    const key = await crypto.subtle.importKey('raw', this.unbase32(secret), { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
    const h = new Uint8Array(await crypto.subtle.sign('HMAC', key, msg));
    const o = h[h.length - 1] & 15;
    const code = ((h[o] & 127) << 24 | h[o + 1] << 16 | h[o + 2] << 8 | h[o + 3]) % 1000000;
    return String(code).padStart(6, '0');
  },
  async verifyTotp(secret, code) {
    code = String(code || '').replace(/\D/g, '');
    if (code.length !== 6) return false;
    for (const w of [0, -1, 1]) { if (await this.totp(secret, Date.now() + w * 30000) === code) return true; }
    return false;
  }
};

/* ==========================================================================
   02-auth.js — users, login/registration, roles & permission matrix (data),
   data scoping (assigned-only roles see their own clients), audit log, inactivity lock.
   ========================================================================== */
const MODULES = [
  ['dashboard', 'Dashboard'], ['clients', 'Clients'], ['vault', 'Credential Vault'], ['team', 'Team'], ['tasks', 'Tasks'],
  ['services', 'Services'], ['compliance', 'Deadlines'], ['invoices', 'Invoices & Payments'],
  ['projects', 'Projects'], ['documents', 'Documents'], ['reports', 'Reports'], ['settings', 'Settings'], ['users', 'Users & Roles'], ['audit', 'Audit Log']
];
const ACTIONS = ['view', 'create', 'edit', 'delete', 'export'];
const MOD_FEATURE = { vault: 'vault', audit: 'audit' };

const Auth = {
  user: null,
  lastActive: Date.now(),
  idleTimer: null,

  role(u = this.user) { return u && Store.s.roles.find((r) => r.id === u.roleId); },
  /* Permission check, driven entirely by the stored matrix. */
  can(mod, act = 'view') {
    const r = this.role(); if (!r) return false;
    if (MOD_FEATURE[mod] && !License.has(MOD_FEATURE[mod])) return false;
    if (License.readOnly() && act !== 'view' && act !== 'export') return false;
    if (r.all) return true;
    return !!(r.perms && r.perms[mod] && r.perms[mod][act]);
  },
  assignedOnly() { const r = this.role(); return !!(r && r.scope === 'assigned'); },
  memberId() { return this.user && this.user.memberId; },

  /* ----- Data scoping: applied by every list, search, report and dashboard ----- */
  _cache: null,
  scopeKey() { return [Store.s.savedAt, this.user && this.user.id, UIState.branch, Store.s.clients.length].join('|'); },
  clients(includeArchived = false) {
    let list = Store.s.clients;
    if (this.assignedOnly()) list = list.filter((c) => c.assignedTo && c.assignedTo === this.memberId());
    if (UIState.branch) list = list.filter((c) => c.branch === UIState.branch);
    if (!includeArchived) list = list.filter((c) => !c.archived);
    return list;
  },
  clientIds() {
    const k = this.scopeKey();
    if (!this._cache || this._cache.k !== k) this._cache = { k, ids: new Set(this.clients(true).map((c) => c.id)) };
    return this._cache.ids;
  },
  canSeeClient(id) { return this.clientIds().has(id); },
  tasks() {
    const ids = this.clientIds(); const me = this.memberId(); const all = !this.assignedOnly() && !UIState.branch;
    return Store.s.tasks.filter((t) => all || ids.has(t.clientId) || (this.assignedOnly() && t.assignedTo === me) || (!t.clientId && !UIState.branch));
  },
  byClient(arr) { const ids = this.clientIds(); const all = !this.assignedOnly() && !UIState.branch; return arr.filter((x) => (x.clientId ? ids.has(x.clientId) : all)); },
  team() { return UIState.branch ? Store.s.team.filter((m) => m.branch === UIState.branch) : Store.s.team; },

  /* ----- Audit log ----- */
  audit(action, module, summary, extra = {}) {
    const u = this.user;
    Store.s.audit.unshift({ id: uid('a'), at: new Date().toISOString(), userId: u ? u.id : '', user: u ? u.username : (extra.user || 'system'), action, module, summary, recordId: extra.recordId || '', old: extra.old ?? null, new: extra.new ?? null });
    if (Store.s.audit.length > 5000) Store.s.audit.length = 5000;
    Store.scheduleSave();
  },
  /* Field-level diff for edit audits. */
  diff(a = {}, b = {}) {
    const o = {}, n = {};
    Object.keys(Object.assign({}, a, b)).forEach((k) => { if (['photo', 'updatedAt', 'history', 'items'].includes(k)) return; if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) { o[k] = a[k]; n[k] = b[k]; } });
    return { old: o, new: n };
  },

  /* ----- Password policy ----- */
  policy(pw) {
    const errs = [];
    if (!pw || pw.length < 8) errs.push('at least 8 characters');
    if (!/[A-Z]/.test(pw)) errs.push('an uppercase letter');
    if (!/[a-z]/.test(pw)) errs.push('a lowercase letter');
    if (!/\d/.test(pw)) errs.push('a number');
    return errs.length ? 'Password needs ' + errs.join(', ') + '.' : '';
  },
  strength(pw) {
    let s = 0; if (!pw) return 0;
    if (pw.length >= 8) s++; if (pw.length >= 12) s++; if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) s++; if (/\d/.test(pw)) s++; if (/[^A-Za-z0-9]/.test(pw)) s++;
    return Math.min(4, s);
  },
  async setPassword(u, pw) { u.salt = Crypto.newSalt(); u.hash = await Crypto.hashPassword(pw, u.salt); u.pwChangedAt = new Date().toISOString(); },
  async checkPassword(u, pw) { return Crypto.same(await Crypto.hashPassword(pw, u.salt), u.hash); },
  findUser(name) { const n = String(name || '').trim().toLowerCase(); return Store.s.users.find((u) => u.username.toLowerCase() === n || (u.email && u.email.toLowerCase() === n)); },

  /* Step 1 of login. Returns {ok, user, next:'2fa'|'setup2fa'|'change'|'app'} or {error}. */
  async login(username, pw) {
    const u = this.findUser(username);
    if (!u) { await Crypto.hashPassword(pw || 'x', 'AAAAAAAAAAAAAAAAAAAAAA=='); this.audit('login_failed', 'auth', `Unknown user "${String(username).slice(0, 40)}"`, { user: String(username).slice(0, 40) }); return { error: 'Invalid username or password.' }; }
    if (u.lockUntil && u.lockUntil > Date.now()) { const m = Math.ceil((u.lockUntil - Date.now()) / 60000); return { error: `Too many failed attempts. Try again in ${m} minute${m > 1 ? 's' : ''}.` }; }
    const ok = await this.checkPassword(u, pw);
    if (!ok) {
      Store.commit(() => { u.failed = (u.failed || 0) + 1; if (u.failed >= 5) { u.lockUntil = Date.now() + 5 * 60000; u.failed = 0; } }, { silent: true });
      this.audit('login_failed', 'auth', `Wrong password for ${u.username}`, { user: u.username });
      return { error: u.lockUntil > Date.now() ? 'Too many failed attempts. Account locked for 5 minutes.' : 'Invalid username or password.' };
    }
    if (u.status === 'pending') return { error: 'Your account is waiting for administrator approval.' };
    if (u.status === 'rejected') return { error: 'Your registration was not approved. Please contact the office.' };
    if (u.status === 'locked') return { error: 'This account is locked. Please contact the administrator.' };
    Store.commit(() => { u.failed = 0; u.lockUntil = 0; }, { silent: true });
    if (u.totp && u.totp.enabled) return { ok: true, user: u, next: '2fa' };
    if (u.force2fa) return { ok: true, user: u, next: 'setup2fa' };
    if (u.mustChange) return { ok: true, user: u, next: 'change' };
    return { ok: true, user: u, next: 'app' };
  },
  start(u) {
    this.user = u;
    Store.commit(() => { u.lastLogin = new Date().toISOString(); }, { silent: true });
    this.audit('login', 'auth', `${u.username} signed in`);
    sessionStorage.setItem('crm_session', JSON.stringify({ uid: u.id, last: Date.now(), locked: false }));
    this.lastActive = Date.now();
    this.watchIdle();
  },
  resume() {
    try {
      const s = JSON.parse(sessionStorage.getItem('crm_session') || 'null'); if (!s) return null;
      const u = Store.s.users.find((x) => x.id === s.uid); if (!u || u.status !== 'active' || u.mustChange) return null;
      const idleMs = (Number(Store.s.settings.inactivityMin) || 15) * 60000;
      this.user = u; this.lastActive = s.last; this.watchIdle();
      return { user: u, locked: s.locked || Date.now() - s.last > idleMs };
    } catch (e) { return null; }
  },
  logout(reason = 'signed out') {
    if (this.user) this.audit('logout', 'auth', `${this.user.username} ${reason}`);
    Store.saveNow();
    this.user = null; Vault.forget(); sessionStorage.removeItem('crm_session'); clearInterval(this.idleTimer);
    Modal.closeAll(); location.hash = '#/dashboard'; App.showLogin();
  },
  touch() {
    this.lastActive = Date.now();
    const s = sessionStorage.getItem('crm_session'); if (s && this.user && !this.locked) { try { const o = JSON.parse(s); if (Date.now() - o.last > 5000) { o.last = this.lastActive; sessionStorage.setItem('crm_session', JSON.stringify(o)); } } catch (e) { /* ignore */ } }
  },
  locked: false,
  watchIdle() {
    clearInterval(this.idleTimer);
    this.idleTimer = setInterval(() => {
      if (!this.user || this.locked) return;
      const idleMs = (Number(Store.s.settings.inactivityMin) || 15) * 60000;
      if (Date.now() - this.lastActive > idleMs) this.lock('inactivity');
    }, 10000);
  },
  lock(why = 'manual') {
    if (!this.user) return;
    this.locked = true; Vault.forget(); Modal.closeAll();
    this.audit('lock', 'auth', `Screen locked (${why})`);
    try { const o = JSON.parse(sessionStorage.getItem('crm_session')); o.locked = true; sessionStorage.setItem('crm_session', JSON.stringify(o)); } catch (e) { /* ignore */ }
    App.showLock();
  },
  unlocked() {
    this.locked = false; this.lastActive = Date.now();
    try { const o = JSON.parse(sessionStorage.getItem('crm_session')); o.locked = false; o.last = Date.now(); sessionStorage.setItem('crm_session', JSON.stringify(o)); } catch (e) { /* ignore */ }
    this.audit('unlock', 'auth', 'Screen unlocked');
  },

  /* Self-registration: creates a pending account (or active if approval is off). */
  async register(f) {
    const st = Store.s.settings;
    if (License.readOnly()) return { error: 'Registration is closed because the subscription is not active.' };
    if (License.limit('users') && License.usage().users >= License.limit('users')) return { error: 'This company has reached the number of users allowed by its subscription. Please contact your administrator.' };
    if (!st.allowRegistration) return { error: 'Self-registration is turned off. Please ask the administrator to create your account.' };
    const username = String(f.username || '').trim().toLowerCase();
    if (!/^[a-z0-9._-]{3,30}$/.test(username)) return { error: 'Username: 3-30 letters, numbers, dot, dash or underscore.', field: 'username' };
    if (this.findUser(username)) return { error: 'This username is already taken.', field: 'username' };
    if (f.email && Store.s.users.some((u) => u.email && u.email.toLowerCase() === f.email.toLowerCase())) return { error: 'An account with this email already exists.', field: 'email' };
    const pe = this.policy(f.password); if (pe) return { error: pe, field: 'password' };
    const regRole = Store.s.roles.find((r) => r.id === st.registrationRole) || Store.s.roles.find((r) => r.name === 'Viewer') || Store.s.roles[Store.s.roles.length - 1];
    const u = { id: uid('u'), username, name: String(f.name).trim(), email: String(f.email || '').trim(), mobile: f.mobile || '', roleId: regRole.id, status: st.requireApproval ? 'pending' : 'active', mustChange: false, createdAt: new Date().toISOString(), selfRegistered: true, branch: '' };
    await this.setPassword(u, f.password);
    Store.commit((s) => {
      s.users.push(u);
      s.users.filter((x) => x.status === 'active' && (this.role(x) || {}).all).forEach((a) => Notify.push(a.id, 'registration', 'New registration request', `${u.name} (${u.username}) registered${st.requireApproval ? ' and is waiting for approval' : ''}.`, '#/settings/users'));
    });
    this.audit('register', 'users', `New self-registration: ${u.username}`, { recordId: u.id, user: u.username });
    return { ok: true, pending: u.status === 'pending' };
  }
};

const TONES = { green: 'green', amber: 'amber', blue: 'blue', red: 'red', grey: 'grey', black: 'black' };

function avatar(name, photo, size = 32) {
  if (photo) return html`<img class="avatar" src="${photo}" alt="" style="width:${size}px;height:${size}px">`;
  const ini = String(name || '?').split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
  return html`<span class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size / 2.6)}px">${ini}</span>`;

/* ---------- Toasts (with optional Undo) ---------- */
function toast(msg, type = 'ok', opts = {}) {
  const root = $('#toast-root'); if (!root) return;
  const el = document.createElement('div'); el.className = 'toast t-' + type; el.setAttribute('role', 'status');
  el.innerHTML = html`<span>${msg}</span>${opts.undo ? html`<button type="button" class="btn sm ghost-light" data-undo>Undo</button>` : ''}<button type="button" class="x" aria-label="Dismiss">×</button>`;
  root.appendChild(el);
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 250); };
  const t = setTimeout(kill, opts.timeout || (opts.undo ? 5000 : 3200));
  el.querySelector('.x').onclick = () => { clearTimeout(t); kill(); };
  if (opts.undo) el.querySelector('[data-undo]').onclick = () => { clearTimeout(t); kill(); opts.undo(); };
}

/* ---------- Modal stack ---------- */
const Modal = {
  stack: [],
  open({ title, body, foot = '', size = '', onMount, onClose, cls = '' }) {
    const wrap = document.createElement('div'); wrap.className = 'modal-wrap';
    wrap.innerHTML = html`<div class="modal ${size} ${cls}" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-h"><h2>${title}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${icon('close')}</button></div><div class="modal-b">${raw(String(body))}</div>${foot ? html`<div class="modal-f">${raw(String(foot))}</div>` : ''}</div>`;
    document.body.appendChild(wrap);
    const m = { el: wrap, close: () => this.close(m), onClose };
    this.stack.push(m);
    wrap.addEventListener('mousedown', (e) => { if (e.target === wrap) m.close(); });
    wrap.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => m.close()));
    requestAnimationFrame(() => wrap.classList.add('in'));
    if (onMount) onMount(wrap, m);
    const f = wrap.querySelector('[autofocus], input:not([type=hidden]):not([disabled]), select, textarea'); if (f) setTimeout(() => { if (!wrap.contains(document.activeElement)) f.focus(); }, 30);
    return m;
  },
  close(m) {
    const i = this.stack.indexOf(m); if (i < 0) return;
    this.stack.splice(i, 1); m.el.classList.remove('in'); setTimeout(() => m.el.remove(), 180);
    if (m.onClose) m.onClose();
  },
  closeTop() { const m = this.stack[this.stack.length - 1]; if (m) { m.close(); return true; } return false; },
  closeAll() { this.stack.slice().forEach((m) => m.close()); }
};
function confirmDlg(msg, opts = {}) {
  return new Promise((res) => {
    let done = false;

      title: opts.title || 'Please confirm', size: 'sm', body: html`<p>${msg}</p>`,
      foot: html`<button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn ${opts.danger ? 'danger' : 'primary'}" data-ok>${opts.ok || 'Confirm'}</button>`,
      onMount: (el, mm) => { el.querySelector('[data-ok]').onclick = () => { done = true; res(true); mm.close(); }; el.querySelector('[data-ok]').focus(); },
      onClose: () => { if (!done) res(false); }
    });
    return m;
  });
}

    let done = false;

/* ---------- Data table (sort / paginate / select) ---------- */
function tstate(key) { return (UIState.tables[key] = UIState.tables[key] || { sort: null, dir: 1, page: 1, size: 25, sel: new Set() }); }

  const st = tstate(key);
  if (!rows.length) return empty || emptyState('Nothing here yet', 'Try changing filters or add a new record.');
  const sorted = sortRows(key, rows, cols);
  const pages = Math.max(1, Math.ceil(sorted.length / st.size)); if (st.page > pages) st.page = pages;
  const slice = sorted.slice((st.page - 1) * st.size, st.page * st.size);

  const allSel = slice.length && slice.every((r) => st.sel.has(r.id));

    ${selectable ? html`<th class="cb"><input type="checkbox" aria-label="Select page" data-act="tbl:selall" data-key="${key}" ${allSel ? raw('checked') : ''}></th>` : ''}
    ${cols.map((c) => html`<th class="${c.cls || ''} ${c.sort === false ? '' : 'sortable'}" ${c.sort === false ? '' : raw(`data-act="tbl:sort" data-key="${esc(key)}" data-col="${esc(c.key)}"`)}>${c.label}${st.sort === c.key ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`)}
  </tr></thead><tbody>
    ${slice.map((r) => html`<tr class="${rowCls ? rowCls(r) : ''}" ${rowAttr ? raw(rowAttr(r)) : ''}>${selectable ? html`<td class="cb"><input type="checkbox" aria-label="Select row" data-act="tbl:sel" data-key="${key}" data-id="${r.id}" ${st.sel.has(r.id) ? raw('checked') : ''}></td>` : ''}${cols.map((c) => html`<td class="${c.cls || ''}" data-label="${c.label}">${c.render ? c.render(r) : (r[c.key] ?? '')}</td>`)}</tr>`)}
  </tbody></table></div>
  <div class="pager"><span class="muted">${(st.page - 1) * st.size + 1}–${Math.min(st.page * st.size, sorted.length)} of ${sorted.length}${st.sel.size ? html` · <b>${st.sel.size} selected</b>` : ''}</span><span class="grow"></span>
    <label class="muted sm">Rows <select data-act-change="tbl:size" data-key="${key}">${[25, 50, 100].map((n) => html`<option ${n === st.size ? raw('selected') : ''}>${n}</option>`)}</select></label>
    <button type="button" class="btn sm ghost" data-act="tbl:page" data-key="${key}" data-p="${st.page - 1}" ${st.page <= 1 ? raw('disabled') : ''}>‹ Prev</button><span class="sm">Page ${st.page} / ${pages}</span><button type="button" class="btn sm ghost" data-act="tbl:page" data-key="${key}" data-p="${st.page + 1}" ${st.page >= pages ? raw('disabled') : ''}>Next ›</button></div>`;
}

  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  if (a.tagName === 'INPUT' && a.type === 'checkbox') { /* handled below */ }

/* ---------- Download helpers ---------- */
function downloadFile(name, content, type = 'text/plain') {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function toCSV(headers, rows) { const q = (v) => { v = v === null || v === undefined ? '' : String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }; return '﻿' + [headers.map(q).join(','), ...rows.map((r) => r.map(q).join(','))].join('\r\n'); }
function toXLS(title, headers, rows) { return `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><table border="1"><caption>${esc(title)}</caption><tr>${headers.map((h) => `<th style="background:#111;color:#fff">${esc(h)}</th>`).join('')}</tr>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></body></html>`; }
function printHTML(title, bodyHTML) {

}

/* ---------- Command palette (Ctrl+K) ---------- */
const Palette = {
  open() {
    if (!Auth.user || Auth.locked) return;
    if ($('.palette')) return;
    const m = Modal.open({
      title: 'Search', cls: 'palette', size: 'md',
      body: html`<input class="inp pal-q" placeholder="Search clients, ID, tax no., phone, tasks, invoices, documents…" autocomplete="off" aria-label="Search"><div class="pal-res" role="listbox"></div><p class="muted sm">↑ ↓ to move · Enter to open · Esc to close</p>`,
      onMount: (el) => {
        const q = el.querySelector('.pal-q'); const box = el.querySelector('.pal-res'); let items = []; let idx = 0;
        const draw = () => { box.innerHTML = items.length ? items.map((it, i) => html`<div class="pal-it ${i === idx ? 'on' : ''}" role="option" data-i="${i}"><span class="pal-k">${it.kind}</span><span><b>${it.title}</b><br><small class="muted">${it.sub || ''}</small></span></div>`).join('') : html`<p class="muted pad">No matches</p>`; };
        const run = debounce(() => { items = Palette.search(q.value); idx = 0; draw(); }, 120);
        q.addEventListener('input', run);
        q.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowDown') { idx = Math.min(items.length - 1, idx + 1); draw(); e.preventDefault(); }
          if (e.key === 'ArrowUp') { idx = Math.max(0, idx - 1); draw(); e.preventDefault(); }
          if (e.key === 'Enter' && items[idx]) { Modal.closeTop(); location.hash = items[idx].href; }
        });
        box.addEventListener('click', (e) => { const it = e.target.closest('.pal-it'); if (it) { Modal.closeTop(); location.hash = items[+it.dataset.i].href; } });
        items = Palette.search(''); draw();
      }
    });
    return m;
  },
  search(q) {
    q = q.trim().toLowerCase(); const out = []; const digits = q.replace(/\D/g, '');
    const nav = Router.nav().filter((n) => !q || n.label.toLowerCase().includes(q)).map((n) => ({ kind: 'Go to', title: n.label, href: n.href }));
    if (!q) return nav.slice(0, 8);
    out.push(...nav.slice(0, 3));
    if (Auth.can('clients')) Auth.clients(true).filter((c) => textMatch(q, c.name, c.code, c.cnic, c.ntn, c.mobile, c.email, c.businessName) || (digits.length >= 4 && [c.cnic, c.ntn, c.mobile].some((v) => v && v.replace(/\D/g, '').includes(digits)))).slice(0, 8).forEach((c) => out.push({ kind: 'Client', title: `${c.code} · ${c.name}`, sub: [c.businessName, c.mobile, c.cnic].filter(Boolean).join(' · '), href: '#/clients/' + c.code }));
    if (Auth.can('tasks')) Auth.tasks().filter((t) => textMatch(q, t.code, t.title, (DB.client(t.clientId) || {}).name)).slice(0, 6).forEach((t) => out.push({ kind: 'Task', title: `${t.code} · ${t.title}`, sub: `${(DB.client(t.clientId) || {}).name || ''} · due ${fmtDate(t.due)}`, href: '#/tasks/' + t.code }));
    if (Auth.can('invoices')) Auth.byClient(Store.s.invoices).filter((i) => textMatch(q, i.number, (DB.client(i.clientId) || {}).name)).slice(0, 5).forEach((i) => out.push({ kind: 'Invoice', title: `${i.number} · ${(DB.client(i.clientId) || {}).name || ''}`, sub: money(DB.invTotal(i).total) + ' · ' + DB.invStatus(i), href: '#/invoices/' + i.number }));
    if (Auth.can('documents')) Auth.byClient(Store.s.documents).filter((d) => textMatch(q, d.code, d.name, Lists.name('docCategories', d.category), (DB.client(d.clientId) || {}).name)).slice(0, 5).forEach((d) => out.push({ kind: 'Document', title: `${d.code} · ${d.name}`, sub: Lists.name('docCategories', d.category), href: '#/documents?doc=' + d.id }));
    return out;
  }
};

const Views = {};

const Router = {
  cur: { name: '', params: [], query: {} },
  pending: false,
  nav() {
    const items = [
      ['dashboard', 'Dashboard', 'dashboard', '#/dashboard'], ['clients', 'Clients', 'clients', '#/clients'], ['tasks', 'Tasks', 'tasks', '#/tasks'],
      ['services', 'Services', 'services', '#/services'], ['compliance', 'Deadlines', 'compliance', '#/compliance'],
      ['vault', 'Credential Vault', 'vault', '#/vault'], ['projects', 'Projects', 'projects', '#/projects'], ['invoices', 'Invoices & Payments', 'invoices', '#/invoices'], ['documents', 'Documents', 'documents', '#/documents'],
      ['team', 'Team', 'team', '#/team'], ['reports', 'Reports', 'reports', '#/reports'], ['audit', 'Audit Log', 'audit', '#/audit'], ['settings', 'Settings', 'settings', '#/settings']
    ];
    return items.filter(([m]) => m === 'settings' ? (Auth.can('settings') || Auth.can('users')) : Auth.can(m)).map(([mod, label, ic, href]) => ({ mod, label, ic, href }));
  },
  parse() {
    const h = (location.hash || '#/dashboard').slice(2); const [path, qs] = h.split('?');
    const parts = path.split('/').filter(Boolean).map(decodeURIComponent); const query = {};
    (qs || '').split('&').filter(Boolean).forEach((kv) => { const [k, v] = kv.split('='); query[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
    return { name: parts[0] || 'dashboard', params: parts.slice(1), query };
  },
  go() {
    if (!Auth.user || Auth.locked) return;
    const r = this.parse();
    const changed = r.name !== this.cur.name || r.params.join('/') !== this.cur.params.join('/');
    this.cur = r;
    this.render(changed);
    App.renderChrome();
    if (changed) { const m = $('#main'); if (m) m.scrollTop = 0; window.scrollTo(0, 0); document.body.classList.remove('nav-open'); }
  },
  refresh() {
    if (this.pending) return; this.pending = true;
    requestAnimationFrame(() => { this.pending = false; if (Auth.user && !Auth.locked && $('#main')) { this.render(false); App.renderChrome(); } });
  },
  render(first) {
    const main = $('#main'); if (!main) return;
    const v = Views[this.cur.name];
    const permMod = v && (v.perm || this.cur.name);
    // Remember focus so debounced re-renders don't steal the caret
    const ae = document.activeElement; const fid = ae && main.contains(ae) && ae.id; const sel = fid && ae.selectionStart !== undefined ? [ae.selectionStart, ae.selectionEnd] : null;
    let out;
    if (!v) out = emptyState('Page not found', 'The page you are looking for does not exist.', btn('Go to dashboard', 'nav', { extra: 'data-href="#/dashboard"', cls: 'primary' }));
    else if (permMod !== 'any' && !(v.allow ? v.allow() : Auth.can(permMod))) out = emptyState('Access denied', 'Your role does not have permission to view this page. Ask the administrator to update your role permissions.');
    else { try { out = v.render(this.cur.params, this.cur.query); } catch (e) { console.warn(e); out = emptyState('Something went wrong', e.message); } }
    main.ondragover = main.ondrop = main.ondragleave = null;
    main.innerHTML = String(License.banner()) + String(out);
    if (v && v.mount) { try { v.mount(main, this.cur.params, this.cur.query); } catch (e) { console.warn(e); } }
    Charts.hydrate(main);
    if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* ignore */ } } }
  }
};

        <div class="row-between"><label class="chk"><input type="checkbox" name="remember" ${remembered ? raw('checked') : ''}> <span>Remember username</span></label><a href="#" data-forgot>Forgot password?</a></div>

      <form id="reg-form" novalidate class="grid-form">

        <label class="fld full"><span>Password<b class="req">*</b></span><div class="pw-wrap"><input name="password" type="password" autocomplete="new-password" required data-strength><button type="button" class="icon-btn" data-pw-eye aria-label="Show password">${icon('eye')}</button></div><div class="pw-meter" data-meter><i></i></div><small class="help">8+ characters with upper &amp; lower case letters and a number.</small><small class="err" data-err-for="password"></small></label>
        <label class="fld full"><span>Confirm password<b class="req">*</b></span><input name="confirm" type="password" autocomplete="new-password" required><small class="err" data-err-for="confirm"></small></label>
        <label class="chk full"><input type="checkbox" name="agree"> <span>I will keep client information confidential.</span></label><small class="err full" data-err-for="agree"></small>
        <button class="btn primary block lg full" type="submit">Create account</button>
      </form>`;
    $('#app').innerHTML = String(this.authFrame(html`${tabs}${tab === 'register' && allowReg ? register : signin}`));
    this.bindAuthCommon();
    $$('[data-auth-tab]').forEach((b) => b.onclick = () => this.showLogin(b.dataset.authTab));
    const lf = $('#login-form');
    if (lf) {
      lf.onsubmit = async (e) => {
        e.preventDefault(); const err = $('[data-login-err]'); err.textContent = '';

        if (!u || !p) { err.textContent = 'Enter your username and password.'; return; }
        const b = lf.querySelector('button[type=submit]'); b.disabled = true; b.textContent = 'Signing in…';
        const r = await Auth.login(u, p);
        b.disabled = false; b.textContent = 'Sign in';
        if (r.error) { err.textContent = r.error; lf.password.value = ''; lf.password.focus(); lf.classList.add('shake'); setTimeout(() => lf.classList.remove('shake'), 400); return; }
        if (lf.remember.checked) localStorage.setItem('crm_remember', u); else localStorage.removeItem('crm_remember');
        this.afterPassword(r.user, r.next);
      };
      const sw = $('[data-switch-co]'); if (sw) sw.onclick = (e) => { e.preventDefault(); Actions['cloud:leave'](); };
      $('[data-forgot]').onclick = (e) => { e.preventDefault(); Modal.open({ title: 'Forgot password', size: 'sm', body: html`<p>For security, passwords are stored as one-way hashes and cannot be recovered.</p><p>Please ask your <b>Super Admin / Admin</b> to reset it from <b>Settings › Users › Reset password</b>. You will be asked to choose a new password at your next sign-in.</p>`, foot: html`<button type="button" class="btn primary" data-close>OK</button>` }); };
    }
    const rf = $('#reg-form');
    if (rf) rf.onsubmit = async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(rf)); f.agree = rf.agree.checked; const errs = {};

      if (!f.username.trim()) errs.username = 'Choose a username';
      if (!f.email.trim()) errs.email = 'Email is required'; else if (Valid.email(f.email)) errs.email = Valid.email(f.email);
      if (Valid.mobile(f.mobile)) errs.mobile = Valid.mobile(f.mobile);
      const pe = Auth.policy(f.password); if (pe) errs.password = pe;
      if (f.password !== f.confirm) errs.confirm = 'Passwords do not match';
      if (!f.agree) errs.agree = 'Please confirm to continue';
      if (Object.keys(errs).length) { showErrors(rf, errs); return; }

  },
  bindAuthCommon() {
    $$('[data-pw-eye]').forEach((b) => b.onclick = () => { const i = b.parentElement.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; b.setAttribute('aria-label', i.type === 'password' ? 'Show password' : 'Hide password'); b.classList.toggle('on', i.type === 'text'); });

  afterPassword(u, next) {

  },
  show2FA(u) {
    $('#app').innerHTML = String(this.authFrame(html`<h2>Two-step verification</h2><p class="muted">Enter the 6-digit code from your authenticator app for <b>${u.username}</b>.</p><form id="tf" novalidate><label class="fld"><span>Authentication code</span><input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" class="otp" required autofocus></label><p class="err" data-e role="alert"></p><button class="btn primary block lg">Verify</button><button type="button" class="btn ghost block" data-back>Back to sign in</button></form>`));
    this.bindAuthCommon();
    const f = $('#tf'); let tries = 0;
    $('[data-back]').onclick = () => this.showLogin();
    f.onsubmit = async (e) => {
      e.preventDefault();
      if (await Crypto.verifyTotp(u.totp.secret, f.code.value)) { this.afterPassword(u, u.mustChange ? 'change' : 'app'); return; }
      tries++; $('[data-e]').textContent = 'Invalid code. Check your phone time and try again.';
      Auth.audit('2fa_failed', 'auth', `Invalid 2FA code for ${u.username}`, { user: u.username });

  },
  showSetup2FA(u, forced) {

    $('#app').innerHTML = String(this.authFrame(html`<h2>Set up two-step verification</h2><p class="muted">${forced ? 'Your administrator requires 2FA for this account. ' : ''}Scan the QR code with Google Authenticator, Microsoft Authenticator or Authy, then enter the code.</p><div class="qr-box">${raw(QR.svg(uri, 4))}</div><p class="sm">Or enter this key manually:<br><code class="secret">${secret.replace(/(.{4})/g, '$1 ')}</code></p><form id="sf" novalidate><label class="fld"><span>6-digit code</span><input name="code" inputmode="numeric" class="otp" maxlength="7" required autofocus></label><p class="err" data-e></p><button class="btn primary block lg">Verify &amp; enable</button><button type="button" class="btn ghost block" data-back>Cancel</button></form>`));
    this.bindAuthCommon();
    $('[data-back]').onclick = () => this.showLogin();
    $('#sf').onsubmit = async (e) => {
      e.preventDefault();
      if (!(await Crypto.verifyTotp(secret, $('#sf').code.value))) { $('[data-e]').textContent = 'Code does not match. Try the next code.'; return; }
      Store.commit(() => { u.totp = { secret, enabled: true, at: new Date().toISOString() }; }, { allowRO: true });
      Auth.audit('2fa_enabled', 'users', `2FA enabled for ${u.username}`, { user: u.username, recordId: u.id });
      this.afterPassword(u, u.mustChange ? 'change' : 'app');
    };
  },
  showChangePw(u) {
    $('#app').innerHTML = String(this.authFrame(html`<h2>Set a new password</h2><p class="muted">${u.isDefault ? 'You are using the default administrator password. ' : ''}For your security, please choose a new password before continuing.</p><form id="cp" novalidate><label class="fld"><span>New password</span><div class="pw-wrap"><input name="p1" type="password" autocomplete="new-password" data-strength required autofocus><button type="button" class="icon-btn" data-pw-eye aria-label="Show password">${icon('eye')}</button></div><div class="pw-meter" data-meter><i></i></div><small class="help">8+ characters with upper &amp; lower case letters and a number.</small></label><label class="fld"><span>Confirm new password</span><input name="p2" type="password" autocomplete="new-password" required></label><p class="err" data-e role="alert"></p><button class="btn primary block lg">Save &amp; continue</button><button type="button" class="btn ghost block" data-back>Cancel</button></form>`));
    this.bindAuthCommon();
    $('[data-back]').onclick = () => this.showLogin();
    $('#cp').onsubmit = async (e) => {
      e.preventDefault(); const f = $('#cp'); const err = $('[data-e]');
      const pe = Auth.policy(f.p1.value); if (pe) { err.textContent = pe; return; }
      if (f.p1.value !== f.p2.value) { err.textContent = 'Passwords do not match.'; return; }
      if (await Auth.checkPassword(u, f.p1.value)) { err.textContent = 'New password must be different from the current one.'; return; }
      await Auth.setPassword(u, f.p1.value); Store.commit(() => { u.mustChange = false; }, { allowRO: true });
      Auth.start(u); Auth.audit('password_change', 'users', `${u.username} changed password`, { recordId: u.id });
