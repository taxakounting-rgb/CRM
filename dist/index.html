/* ==========================================================================
   13-documents.js — Document management. Files are stored in IndexedDB;
   metadata in the store. Drag & drop multi-upload, categories, client/task
   links, preview (images/PDF/text), download, version history + restore,
   expiry dates with reminders, size-limit warning.
   ========================================================================== */
const Docs = {
  cur(d) { return (d.versions || []).find((v) => v.vid === d.current) || (d.versions || [])[d.versions.length - 1] || {}; },
  maxMB() { return Math.min(Number(Store.s.settings.maxUploadMB) || 10, Cloud.maxFileMB()); },
  expiryInfo(d) { if (!d.expiry) return null; const n = daysBetween(today(), d.expiry); return { n, tone: n < 0 ? 'red' : n <= 30 ? 'amber' : 'green', label: n < 0 ? `Expired ${-n}d ago` : n === 0 ? 'Expires today' : `Expires in ${n}d` }; },
  async checkSizes(files) {
    const big = files.filter((f) => f.size > this.maxMB() * 1048576);
    if (big.length && Cloud.avail) { toast(`Cloud storage accepts files up to ${this.maxMB()} MB. Too large: ${big.map((f) => f.name).join(', ')}`, 'warn', { timeout: 7000 }); return false; }
    if (big.length && !(await confirmDlg(html`${big.length} file(s) are larger than the ${this.maxMB()} MB limit:<br><b>${big.map((f) => `${f.name} (${fmtSize(f.size)})`).join(', ')}</b><br><br>Large files use browser storage quickly. Upload anyway?`, { ok: 'Upload anyway' }))) return false;
    return true;
  },

/* ==========================================================================
   14-notifications.js — Per-user notification center + auto reminders
   (deadlines 3/7 days, overdue tasks, assignments, follow-ups, document
   expiry, overdue invoices, password age, compliance) + browser notifications.
   ========================================================================== */
const Notify = {
  push(userId, type, title, body, link = '', key = '') {
    if (!userId) return false;
    if (key && Store.s.notifications.some((n) => n.userId === userId && n.key === key)) return false;
    const n = { id: uid('nt'), userId, type, title, body, link, key, at: new Date().toISOString(), read: false };
    Store.s.notifications.unshift(n);
    if (Store.s.notifications.length > 3000) Store.s.notifications.length = 3000;
    Store.scheduleSave();
    if (Auth.user && userId === Auth.user.id) this.browser(n);
    return true;
  },
  toMember(memberId, type, title, body, link) { const u = Store.s.users.find((x) => x.memberId === memberId && x.status === 'active'); if (u && (!Auth.user || u.id !== Auth.user.id || type !== 'assignment')) this.push(u.id, type, title, body, link); },
  mine() { return Auth.user ? Store.s.notifications.filter((n) => n.userId === Auth.user.id) : []; },
  browser(n) {
    if (!Store.s.settings.browserNotify || !('Notification' in window) || Notification.permission !== 'granted' || document.hasFocus()) return;
    try { new Notification(n.title, { body: n.body, icon: 'data:image/svg+xml,' + encodeURIComponent(logoSVG({ mark: true })) }); } catch (e) { /* ignore */ }
  },
  /* Auto-generated reminders for the signed-in user (deduplicated by key). */
  generate() {
    if (!Auth.user) return;
    const me = Auth.user.id; const mid = Auth.memberId(); const t0 = today(); let added = 0;
    const P = (...a) => { if (this.push(me, ...a)) added++; };
    if (Auth.can('tasks')) {
      const tasks = Auth.tasks().filter((t) => !Lists.isDone(t.status) && t.due);
      const mineT = mid ? tasks.filter((t) => t.assignedTo === mid) : [];
      mineT.forEach((t) => {
        const d = daysBetween(t0, t.due); const c = DB.client(t.clientId) || {};
        if (d < 0) P('overdue', `Overdue: ${t.code}`, `${t.title} (${c.code || ''}) was due ${fmtDate(t.due)}`, '#/tasks/' + t.code, `over:${t.id}:${t.due}`);
        else if (d <= 3) P('deadline', `Due in ${d} day${d === 1 ? '' : 's'}: ${t.code}`, `${t.title} (${c.code || ''}) — due ${fmtDate(t.due)}`, '#/tasks/' + t.code, `due3:${t.id}:${t.due}`);
        else if (d <= 7) P('deadline', `Due in ${d} days: ${t.code}`, `${t.title} (${c.code || ''}) — due ${fmtDate(t.due)}`, '#/tasks/' + t.code, `due7:${t.id}:${t.due}`);
      });
      if (!mid || !Auth.assignedOnly()) {
        const over = tasks.filter((t) => t.due < t0).length; const soon = tasks.filter((t) => t.due >= t0 && daysBetween(t0, t.due) <= 3).length;
        if (over) P('overdue', `${over} overdue tasks across the firm`, 'Open the task list filtered to overdue tasks.', '#/tasks', `sumover:${t0}`);
        if (soon) P('deadline', `${soon} tasks due in the next 3 days`, 'Review upcoming deadlines.', '#/tasks', `sumsoon:${t0}`);
      }
    }
    if (Auth.can('clients')) Followups.mine().forEach((f) => { const d = f.snoozedTo || f.date; if (d <= t0 && (f.userId === me || Auth.assignedOnly() || !mid)) { const c = DB.client(f.clientId) || {}; P('followup', `Follow-up ${d < t0 ? 'overdue' : 'today'}: ${c.code || ''} ${c.name || ''}`, f.note, '#/clients/' + c.code, `fu:${f.id}:${d}`); } });
    if (Auth.can('documents')) Auth.byClient(Store.s.documents).forEach((d) => { if (!d.expiry) return; const n = daysBetween(t0, d.expiry); const b = n < 0 ? 'x' : n <= 7 ? '7' : n <= 30 ? '30' : ''; if (b) P('expiry', n < 0 ? `Document expired: ${d.name}` : `Document expires in ${n} days`, `${d.code} · ${Lists.name('docCategories', d.category)} · ${(DB.client(d.clientId) || {}).name || ''} — ${fmtDate(d.expiry)}`, '#/documents?doc=' + d.id, `exp:${d.id}:${d.expiry}:${b}`); });
    if (Auth.can('invoices')) Auth.byClient(Store.s.invoices).forEach((i) => { if (DB.invStatus(i) === 'Overdue') P('invoice', `Invoice overdue: ${i.number}`, `${(DB.client(i.clientId) || {}).name || ''} — balance ${money(DB.invBalance(i))}, due ${fmtDate(i.due)}`, '#/invoices/' + i.number, `inv:${i.id}:${i.due}`); });
    if (Auth.can('vault')) Auth.byClient(Store.s.creds).forEach((c) => { if (Vault.age(c) > 90) P('password', `Password older than 90 days`, `${Vault.typeName(c)} for ${(DB.client(c.clientId) || {}).name || ''} was last changed ${fmtDate(c.changedAt)}`, '#/vault', `pw:${c.id}:${c.changedAt}`); });
    if (Auth.can('compliance')) Store.s.compliance.filter((x) => x.active !== false).forEach((x) => { const d = Compliance.nextDue(x); const n = d ? daysBetween(t0, d) : 99; if (n <= 7) P('deadline', `${x.name} due ${n === 0 ? 'today' : `in ${n} days`}`, `${Lists.name('authorities', x.authority)} deadline on ${fmtDate(d)}`, '#/compliance', `cp:${x.id}:${d}:${n <= 3 ? 3 : 7}`); });
    if (added) { Store.scheduleSave(); App.renderChrome(); }
  }
};

    const prod = Auth.team().map((m) => ({ label: m.name, value: tasks.filter((t) => t.assignedTo === m.id && t.status === done && inRng(t.completedAt)).length, sub: `${Team.openTasks(m).length} open` })).filter((d) => d.value || !Auth.assignedOnly()).sort((a, b) => b.value - a.value).slice(0, 8);
    const svcRecs = Auth.byClient(Store.s.services);
    const svcData = Lists.all('services').map((s) => ({ label: s.name, value: svcRecs.filter((r) => r.service === s.id).length })).filter((d) => d.value).sort((a, b) => b.value - a.value);
    const svcTop = svcData.slice(0, 7); if (svcData.length > 7) svcTop.push({ label: 'Other', value: sum(svcData.slice(7), (d) => d.value) });
    svcTop.forEach((d, i) => { d.color = d.label === 'Other' ? '#9a9a9a' : SERIES[i]; });

    const t0 = today(); const in14 = addDays(t0, 14);

    const compUp = Store.s.compliance.filter((x) => x.active !== false).map((x) => ({ x, d: Compliance.nextDue(x) })).filter((o) => o.d && o.d <= in14);
    const fuToday = Followups.mine().filter((x) => (x.snoozedTo || x.date) <= t0);
    const ids = Auth.clientIds(); const all = !Auth.assignedOnly() && !UIState.branch;
    const recent = Store.s.timeline.filter((e) => all || ids.has(e.clientId)).slice(0, 10);
    const myTasks = Auth.memberId() ? tasks.filter((t) => t.assignedTo === Auth.memberId() && !Lists.isDone(t.status)).sort((a, b) => (a.due > b.due ? 1 : -1)) : [];
    const kpi = (label, val, ic, href, tone = '', sub = '') => html`<a class="kpi ${tone}" href="${href}"><span class="kpi-ic">${icon(ic)}</span><small>${label}</small><b>${val}</b>${sub ? html`<em>${sub}</em>` : ''}</a>`;
    const hour = new Date().getHours();
    return html`<div class="page-head"><div><h1>Good ${hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening'}, ${Auth.user.name.split(' ')[0]}</h1><p class="muted">${fmtDate(t0)} · ${Auth.assignedOnly() ? 'Showing your assigned clients' : UIState.branch ? 'Branch: ' + Lists.name('branches', UIState.branch) : 'All branches'}</p></div>
      <div class="page-actions dash-f">${License.has('dashboard_custom') ? btn('Customise', 'dash:custom', { cls: 'ghost', icon: 'grid' }) : License.lock('dashboard_custom')}${fDate('dash.from', 'From')}${fDate('dash.to', 'To')}</div></div>
      ${this.layout({
        kpis: [['kpi_total', kpi('Total clients', k.total, 'clients', '#/clients')], ['kpi_active', kpi('Active clients', k.active, 'check', '#/clients')], ['kpi_pending', kpi('Pending tasks', k.pending, 'tasks', '#/tasks')], ['kpi_completed', kpi('Completed tasks', k.completed, 'check', '#/tasks', '', 'in selected period')], ['kpi_overdue', kpi('Overdue tasks', k.overdue, 'calendar', '#/tasks', k.overdue ? 'warn' : '')], Auth.can('projects') && ['kpi_projects', kpi('Active projects', (Store.s.projects||[]).filter(p=>p.status==='Active').length, 'projects', '#/projects', '', `${(Store.s.projects||[]).length} total`)], canMoney && ['kpi_revenue', kpi('Revenue this month', moneyShort(revMonth), 'invoices', '#/invoices', '', money(revMonth))], canMoney && ['kpi_receivables', kpi('Outstanding receivables', moneyShort(outstanding), 'invoices', '#/invoices', outstanding ? 'amber' : '', money(outstanding))]],
        cards: [
          canMoney && ['w_revenue', html`<div class="card span2"><div class="card-h"><h3>Revenue received by month</h3><small class="muted">${monthLabel(months[0] || monthKey(t0))} – ${monthLabel(months[months.length - 1] || monthKey(t0))}</small></div>${Charts.bars(months.map((m) => { const v = sum(pays.filter((p) => monthKey(p.date) === m), (p) => p.amount); return { label: monthLabel(m), value: v, tip: `${monthLabel(m)}: ${money(v)}` }; }), { fmt: moneyShort })}</div>`],
          ['w_status', html`<div class="card"><h3>Tasks by status</h3>${Charts.donut(statusData, { center: tasks.length, sub: 'tasks' })}</div>`],
          ['w_productivity', html`<div class="card"><h3>Employee productivity</h3><p class="muted sm">Tasks completed in period</p>${Charts.hbars(prod)}</div>`],

        ]
      })}`;

/* ---------- Dashboard customisation (per user, with a firm default) ---------- */
const DASH_ITEMS = [
  ['kpi_total', 'Total clients', 'KPI card'], ['kpi_active', 'Active clients', 'KPI card'], ['kpi_pending', 'Pending tasks', 'KPI card'], ['kpi_completed', 'Completed tasks', 'KPI card'], ['kpi_overdue', 'Overdue tasks', 'KPI card'], ['kpi_revenue', 'Revenue this month', 'KPI card'], ['kpi_receivables', 'Outstanding receivables', 'KPI card'],
  ['w_revenue', 'Revenue received by month', 'Chart'], ['w_status', 'Tasks by status', 'Chart'], ['w_productivity', 'Employee productivity', 'Chart'], ['w_services', 'Services distribution', 'Chart'],
  ['w_deadlines', 'Upcoming deadlines', 'Widget'], ['w_followups', 'Follow-ups due', 'Widget'], ['w_mytasks', 'My tasks', 'Widget'], ['w_activity', 'Recent activity', 'Widget']
];
const DashCfg = {
  get() { if (!License.has('dashboard_custom')) return {}; const u = Auth.user; return (u && u.prefs && u.prefs.dash) || Store.s.settings.dashDefault || {}; },
  open() {
    if (!License.need('dashboard_custom')) return;
    const cfg = clone(this.get()); const hidden = new Set(cfg.hidden || []);
    let order = (cfg.order && cfg.order.length ? cfg.order.concat(DASH_ITEMS.map((d) => d[0]).filter((k) => !cfg.order.includes(k))) : DASH_ITEMS.map((d) => d[0]));
    const draw = (el) => { el.querySelector('[data-dl]').innerHTML = String(html`${order.map((k, i) => { const d = DASH_ITEMS.find((x) => x[0] === k); return html`<li><label class="chk"><input type="checkbox" data-k="${k}" ${hidden.has(k) ? '' : raw('checked')}> <span><b>${d[1]}</b> <small class="muted">${d[2]}</small></span></label><span class="row-acts"><button type="button" class="icon-btn sm" data-up="${i}" ${i === 0 ? raw('disabled') : ''} aria-label="Move up">↑</button><button type="button" class="icon-btn sm" data-down="${i}" ${i === order.length - 1 ? raw('disabled') : ''} aria-label="Move down">↓</button></span></li>`; })}`); };
    const isAdmin = Auth.can('settings', 'edit');
    Modal.open({
      title: 'Customise dashboard', size: 'md',
      body: html`<p class="muted sm">Tick the cards and widgets you want to see and use the arrows to change their order. KPI cards always stay in the top row.</p><ul class="ml dash-list" data-dl></ul>`,
      foot: html`${btn('Reset', '', { cls: 'ghost', extra: 'data-reset' })}<span class="grow"></span>${isAdmin ? btn('Save as default for everyone', '', { cls: 'ghost', extra: 'data-all' }) : ''}${btn('Save for me', '', { cls: 'primary', extra: 'data-me' })}`,
      onMount: (el, m) => {
        draw(el);
        el.querySelector('[data-dl]').addEventListener('click', (e) => { const u = e.target.closest('[data-up]'), d = e.target.closest('[data-down]'); if (u) { const i = +u.dataset.up; [order[i - 1], order[i]] = [order[i], order[i - 1]]; draw(el); } if (d) { const i = +d.dataset.down; [order[i + 1], order[i]] = [order[i], order[i + 1]]; draw(el); } });
        el.querySelector('[data-dl]').addEventListener('change', (e) => { const k = e.target.dataset.k; if (k) { if (e.target.checked) hidden.delete(k); else hidden.add(k); } });
        const val = () => ({ hidden: Array.from(hidden), order: order.slice() });
        el.querySelector('[data-me]').onclick = () => { const u = Auth.user; Store.commit(() => { u.prefs = Object.assign({}, u.prefs, { dash: val() }); }, { allowRO: true }); toast('Dashboard saved'); m.close(); };
        const all = el.querySelector('[data-all]'); if (all) all.onclick = () => { const u = Auth.user; Store.commit((s) => { s.settings.dashDefault = val(); if (u.prefs) delete u.prefs.dash; }); Auth.audit('edit', 'settings', 'Default dashboard layout updated'); toast('Default dashboard saved for everyone'); m.close(); };
        el.querySelector('[data-reset]').onclick = () => { const u = Auth.user; Store.commit(() => { if (u.prefs) delete u.prefs.dash; }, { allowRO: true }); toast('Dashboard reset'); m.close(); };
      }
    });
  }
};

/* ---------- Backup, restore, snapshots ---------- */
const Backup = {
  async snapshot(tag) {
    try {
      const key = tag ? `${today()}_${tag}_${Date.now()}` : today();
      await IDB.put('snapshots', key, { at: new Date().toISOString(), state: JSON.parse(JSON.stringify(Store.s)) });
      const keys = (await IDB.keys('snapshots')).sort();
      while (keys.length > 7) await IDB.del('snapshots', keys.shift());
    } catch (e) { console.warn('Snapshot failed', e); }
  },
  async autoSnapshot() { try { const keys = await IDB.keys('snapshots'); if (!keys.includes(today()) && Store.s.clients) await this.snapshot(); } catch (e) { /* ignore */ } },
  async restoreSnapshot(key) {
    const snap = await IDB.get('snapshots', key); if (!snap) return;
    if (!(await confirmDlg(html`Restore the snapshot from <b>${fmtDateTime(snap.at)}</b>? Current data will be replaced (a safety snapshot is taken first).`, { danger: true, ok: 'Restore snapshot' }))) return;
    await this.snapshot('before-snapshot-restore');
    const me = Auth.user.username;
    const lic = Store.s.license; Store.s = Object.assign(Store.blank(), snap.state); Store.s.license = lic;
    Auth.user = Store.s.users.find((u) => u.username === me && u.status === 'active') || null;
    Auth.audit('import', 'settings', `Snapshot ${key} restored`, { user: me }); Store.saveNow();
    if (!Auth.user) { Auth.logout('snapshot restored'); return; }
    Bus.emit('change', {}); toast('Snapshot restored');
  },
  async wipe() {
    const v = await promptDlg('Reset to empty', 'Type RESET to delete all clients, tasks, invoices, documents and other records. Users, roles, settings and Master Lists are kept.', { ok: 'Delete all records' });
    if (v !== 'RESET') { if (v !== null) toast('Not reset — you must type RESET', 'warn'); return; }
    await this.snapshot('before-reset');
    Store.commit((s) => { ['clients', 'team', 'tasks', 'services', 'invoices', 'payments', 'expenses', 'documents', 'creds', 'notes', 'timeline', 'followups', 'notifications', 'savedFilters'].forEach((k) => { s[k] = []; }); s.filings = {}; s.counters = Object.assign(s.counters, { client: {}, task: 0, emp: 0, inv: 0, doc: 0, pay: 0, exp: 0, rcpt: 0 }); s.users.forEach((u) => { u.memberId = ''; }); });
    try { await IDB.clear('blobs'); } catch (e) { /* ignore */ }
    Auth.audit('delete', 'settings', 'All business records reset to empty');
    toast('All records deleted. A snapshot was saved in case you need to undo.');
  }
};

    const ml = root.querySelector('[data-ml]');

      const k = ml.dataset.ml;
      const upd = (id, fn, label) => { const it = Lists.get(k, id); if (!it) return; Store.commit(() => fn(it)); if (label) Auth.audit('edit', 'settings', `Master list "${Lists.defs[k]}": ${label}`); };
      $$('[data-ml-name]', ml).forEach((i) => i.addEventListener('change', () => { const it = Lists.get(k, i.dataset.mlName); const v = i.value.trim(); if (!v) { i.value = it.name; return; } const old = it.name; upd(it.id, (x) => { x.name = v; }, `renamed "${old}" → "${v}"`); toast('Renamed — all records show the new name'); }));
      $$('[data-ml-color]', ml).forEach((i) => i.addEventListener('change', () => upd(i.dataset.mlColor, (x) => { x.color = i.value; }, 'colour changed')));
      $$('[data-ml-fee]', ml).forEach((i) => i.addEventListener('change', () => upd(i.dataset.mlFee, (x) => { x.fee = Number(i.value) || 0; }, 'default fee changed')));
      $$('[data-ml-url]', ml).forEach((i) => i.addEventListener('change', () => { if (Valid.url(i.value)) { toast(Valid.url(i.value), 'warn'); return; } upd(i.dataset.mlUrl, (x) => { x.url = i.value.trim(); }, 'login URL changed'); }));
      $$('[data-ml-done]', ml).forEach((i) => i.addEventListener('change', () => { Store.commit(() => Lists.all(k).forEach((x) => { x.done = x.id === i.dataset.mlDone; })); Auth.audit('edit', 'settings', `Completed status set to "${Lists.name(k, i.dataset.mlDone)}"`); }));
      let drag = null;
      $$('li[draggable=true]', ml).forEach((li) => { li.addEventListener('dragstart', () => { drag = li.dataset.id; li.classList.add('dragging'); }); li.addEventListener('dragend', () => li.classList.remove('dragging')); li.addEventListener('dragover', (e) => e.preventDefault()); li.addEventListener('drop', (e) => { e.preventDefault(); if (!drag || drag === li.dataset.id) return; Store.commit((s) => { const arr = s.lists[k]; const from = arr.findIndex((x) => x.id === drag); const [it] = arr.splice(from, 1); arr.splice(arr.findIndex((x) => x.id === li.dataset.id), 0, it); }); Auth.audit('edit', 'settings', `Master list "${Lists.defs[k]}" reordered`); }); });
      const add = root.querySelector('[data-ml-add]'); add.onsubmit = (e) => { e.preventDefault(); if (Settings.addListItem(k, add.v.value)) add.v.value = ''; };
    }
    const rs = root.querySelector('[data-regset]');
    if (rs) rs.onsubmit = (e) => { e.preventDefault(); if (!Auth.can('users', 'edit')) return; Store.commit((s) => { s.settings.allowRegistration = rs.allowRegistration.checked; s.settings.requireApproval = rs.requireApproval.checked; s.settings.registrationRole = rs.registrationRole.value; }); Auth.audit('edit', 'users', `Registration settings: allow=${rs.allowRegistration.checked}, approval=${rs.requireApproval.checked}`); toast('Saved'); };
    const nb = root.querySelector('[data-numbering]');
    if (nb) nb.onsubmit = (e) => { e.preventDefault(); const fd = Object.fromEntries(new FormData(nb)); Store.commit((s) => { ['task', 'emp', 'inv', 'doc', 'rcpt', 'exp'].forEach((k) => { s.settings.prefixes[k] = fd['p_' + k]; s.counters[k] = Math.max(0, parseInt(fd['c_' + k], 10) || 0); }); }); Auth.audit('edit', 'settings', 'Numbering prefixes/counters updated'); toast('Numbering saved'); };
    const pf = root.querySelector('[data-prefs]');
    if (pf) { pf.onsubmit = (e) => { e.preventDefault(); const fd = Object.fromEntries(new FormData(pf)); Store.commit((s) => { Object.entries(fd).forEach(([k, v]) => { s.settings[k] = Number(v); }); }); Auth.audit('edit', 'settings', 'Preferences updated', { new: fd }); toast('Preferences saved'); }; }
  }
};

const Brand = {
  company() { return (Store.s && Store.s.settings && Store.s.settings.company) || {}; },
  wl() { return (Store.s && Store.s.settings && Store.s.settings.whiteLabel) || {}; },
  name() { return String(this.company().name || '').trim(); },
  /* App name shown in the browser tab, sign-in screen and notifications. */
  appName() {
    const w = this.wl().appName; if (w) return w;
    const n = this.name(); if (!n) return 'CRM';
    return /crm/i.test(n) ? n : n + ' CRM';
  },
  initials() {
    const n = this.name(); if (!n) return 'C';
    const parts = n.replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).filter(Boolean);
    if (!parts.length) return n[0].toUpperCase();
    return (parts.length === 1 ? parts[0].slice(0, 2) : parts[0][0] + parts[1][0]).toUpperCase();
  },
  vendor() { return false; },
  powered() { return false; },
  applyPreset() { /* no presets */ },
  footer() {
    const c = this.company();
    return html`${[c.name, c.phone, c.email, c.website, c.address].filter(Boolean).join('  |  ')}`;
  },
  /* Accent colour for printed documents: dominant colour of the company logo (falls back to the theme brand colour). */
  printColor() { const c = this.company(); return /^#[0-9a-f]{6}$/i.test(c.logoColor || '') ? c.logoColor : this.color(); },
  logoColor(src) {
    return new Promise((res) => {
      const img = new Image();
      img.onerror = () => res('');
      img.onload = () => {
        try {
          const n = 48; const cv = document.createElement('canvas'); cv.width = cv.height = n;
          const cx = cv.getContext('2d', { willReadFrequently: true }); cx.drawImage(img, 0, 0, n, n);
          const d = cx.getImageData(0, 0, n, n).data; const bins = {}; const dark = { w: 0, r: 0, g: 0, b: 0 };
          for (let i = 0; i < d.length; i += 4) {
            if (d[i + 3] < 200) continue;
            const r = d[i], g = d[i + 1], b = d[i + 2]; const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
            const sat = mx === 0 ? 0 : (mx - mn) / mx; const lum = (r * 299 + g * 587 + b * 114) / 1000;
            if (lum > 238) continue;
            if (sat < 0.28 || lum < 28) { dark.w++; dark.r += r; dark.g += g; dark.b += b; continue; }
            const k = (r >> 5) + ',' + (g >> 5) + ',' + (b >> 5); const o = bins[k] || (bins[k] = { w: 0, r: 0, g: 0, b: 0 });
            o.w += sat; o.r += r * sat; o.g += g * sat; o.b += b * sat;
          }
          let best = null; Object.values(bins).forEach((o) => { if (!best || o.w > best.w) best = o; });
          const hex = (o, div) => '#' + [o.r, o.g, o.b].map((v) => Math.round(v / div).toString(16).padStart(2, '0')).join('');
          if (best && best.w > 0) return res(hex(best, best.w));
          if (dark.w > 0) return res(hex(dark, dark.w));
          res('');
        } catch (e) { res(''); }
      };
      img.src = src;
    });
  },
  /* Works out (once per logo) the colour used for the invoice header line, tables and labels. */
  async syncLogoColor() {
    const c = this.company(); if (!c.logo) return;
    const col = await this.logoColor(c.logo);
    Store.commit((s) => { s.settings.company.logoColor = col; });
  },
  customLogo() { const c = this.company(); return c.logo ? c.logo : ''; },
  /* Brand colour of the active theme, for favicon / print */
  color() { try { return Theme.skin().brand; } catch (e) { return '#1d64c8'; } }
};

  steps: [['Company', 'Name, logo & contact'], ['Business', 'Currency & services'], ['Look & feel', 'Choose a theme'], ['Admin account', 'Your sign-in']],

  /* Read the visible form into W (keeps values when moving back and forth). */
  collect() {
    const f = $('#su-form'); if (!f) return;
    Array.from(f.elements).forEach((el) => { if (el.name && el.name in this.W && el.type !== 'file' && el.type !== 'password') this.W[el.name] = el.value; });
  },
  valid() {
    const f = $('#su-form'); const W = this.W; const errs = {};
    if (this.step === 0) {
      if (!W.name.trim()) errs.name = 'Enter your company name';
      if (W.email && Valid.email(W.email)) errs.email = Valid.email(W.email);
      if (W.phone && Valid.mobile(W.phone)) errs.phone = Valid.mobile(W.phone);
    }
    if (this.step === 3) {
      if (!W.admName.trim()) errs.admName = 'Enter your full name';
      if (!/^[a-z0-9._-]{3,30}$/i.test(W.admUser.trim())) errs.admUser = 'Username: 3-30 letters, numbers, dot, dash or underscore';
      if (W.admEmail && Valid.email(W.admEmail)) errs.admEmail = Valid.email(W.admEmail);
      const pe = Auth.policy(f.password.value); if (pe) errs.password = pe;
      else if (f.password.value !== f.confirm.value) errs.confirm = 'Passwords do not match';
    }
    $$('[data-err-for]', f).forEach((e) => { e.textContent = errs[e.dataset.errFor] || ''; });
    return !Object.keys(errs).length;
  },
  fld(name, label, o = {}) {
    const v = this.W[name] || '';
    return html`<label class="fld ${o.full ? 'full' : ''}"><span>${label}${o.req ? html`<b class="req">*</b>` : ''}</span><input name="${name}" value="${v}" type="${o.type || 'text'}" placeholder="${o.ph || ''}" ${o.req ? raw('required') : ''} autocomplete="off"><small class="err" data-err-for="${name}"></small></label>`;
  },
  body() {
    const W = this.W;
    if (this.step === 0) return html`<div class="su-logo-row"><div class="su-logo-prev" data-logo-prev>${brandLogo()}</div><div><b>Company logo</b><p class="muted sm">PNG, JPG or SVG. Optional: until you upload one, a badge with your company's initials is used.</p><input type="file" accept="image/*" data-su-logo aria-label="Upload logo"> ${W.logo ? html`<button type="button" class="btn sm ghost" data-su-logo-clear>Remove</button>` : ''}</div></div>
      <div class="grid-form">${this.fld('name', 'Company name', { req: true, full: true, ph: 'e.g. Acme Solutions' })}
      <label class="fld"><span>Industry</span><select name="industry"><option value="">— Select —</option>${INDUSTRIES.map((i) => html`<option ${i === W.industry ? raw('selected') : ''}>${i}</option>`)}</select></label>${this.fld('country', 'Country', { ph: 'e.g. United Kingdom' })}
      ${this.fld('phone', 'Phone', { type: 'tel', ph: '+1 555 000 0000' })}${this.fld('email', 'Email', { type: 'email', ph: 'info@company.com' })}${this.fld('website', 'Website', { ph: 'www.company.com' })}${this.fld('ntn', 'Tax / VAT / Registration no.', { ph: 'Optional' })}
      <label class="fld full"><span>Address</span><textarea name="address" rows="2" placeholder="Street, city">${W.address}</textarea></label></div>`;
    if (this.step === 1) return html`<div class="grid-form"><label class="fld full"><span>Currency</span><select name="currency">${CURRENCIES.map(([code, sym, n]) => html`<option value="${code}" ${code === W.currency ? raw('selected') : ''}>${code} (${sym.trim()}) · ${n}</option>`)}</select><small class="help">Used for invoices, payments and reports. You can change it later in Settings.</small></label>
      ${this.fld('dialCode', 'Phone country code', { full: true, ph: 'e.g. 44, 92, 971 (used for WhatsApp links)' })}
      <label class="fld full"><span>Your services / products <small class="muted">(optional)</small></span><textarea name="services" rows="7" placeholder="One per line. Optional price after a comma.&#10;Website Design, 1500&#10;Monthly Consulting, 400&#10;Logo Design">${W.services}</textarea><small class="help">This list starts empty. Add, rename or remove services any time in Settings › Master Lists.</small></label></div>`;
    if (this.step === 2) return html`<p class="muted">Pick a look. Each team member can change their own theme later, and Light / Dark mode is one click away.</p><div data-theme-gallery>${ThemeUI.gallery(false)}</div>`;
    return html`<div class="grid-form">${this.fld('admName', 'Your full name', { req: true, full: true })}${this.fld('admUser', 'Username', { req: true, ph: 'e.g. admin' })}${this.fld('admEmail', 'Email', { type: 'email' })}
      <label class="fld full"><span>Password<b class="req">*</b></span><div class="pw-wrap"><input name="password" type="password" autocomplete="new-password" data-strength required><button type="button" class="icon-btn" data-pw-eye aria-label="Show password">${icon('eye')}</button></div><div class="pw-meter" data-meter><i></i></div><small class="help">8+ characters with upper &amp; lower case letters and a number.</small><small class="err" data-err-for="password"></small></label>
      <label class="fld full"><span>Confirm password<b class="req">*</b></span><input name="confirm" type="password" autocomplete="new-password" required><small class="err" data-err-for="confirm"></small></label></div>
      <p class="muted sm">You will be the Super Admin and can add more users and roles later in Settings.</p>`;
  },
  /* keep the in-memory company in sync so brandLogo() previews what was typed/uploaded */
  sync() { const c = Store.s.settings.company; c.name = this.W.name.trim(); if (this.W.logo) c.logo = this.W.logo; else delete c.logo; delete c.logoColor; },
  render() {
    this.sync();
    const last = this.step === this.steps.length - 1;
    $('#app').innerHTML = String(html`<div class="auth-wrap setup-wrap"><div class="auth-brand"><div class="auth-logo" data-brand-prev>${brandLogo()}</div><h1 data-brand-name>${this.W.name.trim() || 'Welcome'}</h1><p>Let's set up your CRM. It takes about a minute and everything can be changed later.</p>
      <ol class="su-steps">${this.steps.map(([t, d], i) => html`<li class="${i === this.step ? 'on' : i < this.step ? 'done' : ''}"><span>${i < this.step ? icon('check') : i + 1}</span><div><b>${t}</b><small>${d}</small></div></li>`)}</ol></div>
      <div class="auth-side"><div class="auth-card su-card"><h2>${this.steps[this.step][0]}</h2><p class="muted">Step ${this.step + 1} of ${this.steps.length}</p>
        <form id="su-form" novalidate autocomplete="off">${this.body()}
        <div class="su-actions">${this.step > 0 ? html`<button type="button" class="btn ghost" data-su-back>Back</button>` : html`<span></span>`}<button class="btn primary lg" type="submit">${last ? 'Create workspace' : 'Continue'}</button></div></form>
        </div></div></div>`);
    App.bindAuthCommon();
    const f = $('#su-form');
    f.onsubmit = (e) => { e.preventDefault(); this.collect(); if (!this.valid()) return; if (last) this.finish(f); else { this.step++; this.render(); } };
    const back = $('[data-su-back]'); if (back) back.onclick = () => { this.collect(); this.step--; this.render(); };
    // live brand preview (step 1)
    if (this.step === 0) {
      f.elements.name.addEventListener('input', () => { this.W.name = f.elements.name.value; this.preview(); });
      const lg = $('[data-su-logo]');
      lg.onchange = async () => { const file = lg.files[0]; if (!file) return; try { this.W.logo = await resizeImage(file, 600); } catch (e) { toast('Could not read that image', 'err'); return; } this.collect(); this.render(); };
      const cl = $('[data-su-logo-clear]'); if (cl) cl.onclick = () => { this.W.logo = ''; this.collect(); this.render(); };
    }
    this.preview();
    if (this.step === 2) { $$('[data-theme-gallery]').forEach((g) => { g.addEventListener('click', () => setTimeout(() => this.preview(), 30)); }); }
    const first = f.querySelector('input:not([type=file]):not([type=hidden]),textarea'); if (first && this.step !== 2) first.focus();
  },
  /* Reflect the company name/logo on the left panel while typing */
  preview() {
    const nm = this.W.name.trim(); const h = $('[data-brand-name]'); if (h) h.textContent = nm || 'Welcome';
    const lg = $('[data-brand-prev]'); if (lg) { this.sync(); lg.innerHTML = String(brandLogo()); const sp = $('[data-logo-prev]'); if (sp) sp.innerHTML = String(brandLogo()); }
  },
  async finish(f) {
    const W = this.W; const btnEl = f.querySelector('button[type=submit]'); btnEl.disabled = true; btnEl.textContent = 'Creating…';
    const s = Store.s; const cur = CURRENCIES.find((c) => c[0] === W.currency) || CURRENCIES[0];
    const skin = Theme.skinId(); const now = new Date().toISOString();
    Object.assign(s.settings.company, { name: W.name.trim(), industry: W.industry, phone: W.phone.trim(), email: W.email.trim(), website: W.website.trim(), address: W.address.trim(), country: W.country.trim(), dialCode: W.dialCode.replace(/\D/g, ''), ntn: W.ntn.trim() });
    if (W.logo) s.settings.company.logo = W.logo; else delete s.settings.company.logo; delete s.settings.company.logoColor;
    s.settings.currency = { code: cur[0], symbol: cur[1] };
    s.settings.defaultSkin = skin;
    // services typed by the owner: "Name, price" per line
    const seen = new Set(); s.lists.services = [];
    String(W.services || '').split(/\n+/).map((l) => l.trim()).filter(Boolean).forEach((line) => {
      const m = line.match(/^(.*?)[,|;]\s*([\d.,]+)\s*$/); const name = (m ? m[1] : line).trim(); const fee = m ? Number(m[2].replace(/,/g, '')) || 0 : 0;
      if (!name || seen.has(name.toLowerCase())) return; seen.add(name.toLowerCase());
      s.lists.services.push({ id: 'svc_' + (s.lists.services.length + 1), name, fee });
    });
    const admin = { id: 'u_admin', username: W.admUser.trim().toLowerCase(), name: W.admName.trim(), email: W.admEmail.trim(), roleId: 'role_super', status: 'active', mustChange: false, createdAt: now };
    await Auth.setPassword(admin, f.password.value);
    s.users.push(admin);
    s.settings.setupDone = true; s.settings.setupAt = now;
    s.audit.unshift({ id: uid('a'), at: now, user: 'system', userId: '', action: 'create', module: 'settings', summary: `Setup completed for "${W.name.trim()}"; Super Admin "${admin.username}" created` });
    Store.saveNow();
    await Cloud.push();
    Theme.save({ skin });
    setFavicon(); document.title = Brand.appName();
    Auth.start(admin); App.enter();
    toast(`Welcome to ${Brand.appName()}! Start by adding your first client.`, 'ok', { timeout: 6000 });
  }
};
App.showSetup = function () { Setup.step = 0; if (!Setup.W.name) Setup.W.name = (Store.s.settings.company || {}).name || ''; Setup.render(); };

/* ==========================================================================
   22-cloud.js — Cloud storage (multi-company).
   Each company has its own account (company username + password) and private data
   in the cloud database via /api/sync. This browser keeps a local cache for speed.
   Employees then sign in inside the company with their own username/password.
   The password never leaves the browser: only a salted PBKDF2 hash is sent.
   ========================================================================== */
const Cloud = {
  API: '/api/sync',
  avail: false, status: 'off', timer: null, busy: false, lastSync: 0, adopting: false,
  st: (() => { try { return JSON.parse(localStorage.getItem('crm_cloud') || '{}'); } catch (e) { return {}; } })(),
  persist() { try { localStorage.setItem('crm_cloud', JSON.stringify(this.st)); } catch (e) { /* ignore */ } },
  async call(body) {
    const r = await fetch(this.API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    let j = {}; try { j = await r.json(); } catch (e) { /* non-JSON */ }
    if (!r.ok) { const e = new Error(j.error || 'Server error ' + r.status); e.status = r.status; e.data = j; throw e; }
    return j;
  },
  async init() {
    if (location.protocol === 'file:') { this.avail = false; return; }
    try { const r = await fetch(this.API, { cache: 'no-store' }); const j = await r.json(); this.avail = !!(j && j.configured); } catch (e) { this.avail = false; }
    if (!this.avail) return;
    this.status = this.st.token ? 'ok' : 'off';
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.poll(); });
    setInterval(() => this.poll(), 60000);
    if (this.st.token) { // refresh from the cloud when the page opens (works offline too: falls back to the local copy)
      try { const m = await this.call({ action: 'meta', token: this.st.token }); if (m.ws !== this.st.ws || m.ver !== this.st.ver) await this.reconcile(m, m.ws !== this.st.ws); this.status = 'ok'; this.lastSync = Date.now(); }
      catch (e) { if (e.status === 401) { this.st.token = ''; this.persist(); this.status = 'off'; } else this.status = 'offline'; }
    }
  },
  linked() { return this.avail && !!this.st.token; },
  company() { return this.st.co || ''; },
  async idFree(id) { return (await this.call({ action: 'available', id })).free; },
  async wipeLocal() {
    clearTimeout(this.timer); this.timer = null;
    sessionStorage.removeItem('crm_session'); localStorage.removeItem(LS_KEY);
    try { await IDB.clear('kv'); await IDB.clear('blobs'); await IDB.clear('snapshots'); } catch (e) { /* ignore */ }
  },
  /* NEW COMPANY: create the company account in the cloud with an empty workspace. */
  async signupCompany(id, name, pw) {
    const salt = Crypto.newSalt(); const hash = await Crypto.hashPassword(pw, salt);
    await this.wipeLocal();
    Store.s = Store.blank(); await Seed.ensure(); Store.s.settings.company.name = name;
    const j = await this.call({ action: 'signup', id, salt, hash, state: Store.s });
    this.st = { token: j.token, ver: j.ver, ws: j.ws, co: id }; this.persist();
    this.adopting = true; Store.saveNow(); this.adopting = false; this.status = 'ok'; this.lastSync = Date.now();
  },
  /* EXISTING COMPANY: company username + password, then download its data. */
  async signIn(id, pw) {
    const { salt } = await this.call({ action: 'challenge', id });
    const hash = await Crypto.hashPassword(pw, salt);
    const j = await this.call({ action: 'login', id, hash });
    const same = this.st.ws === j.ws;
    if (!same) await this.wipeLocal();
    this.st = { token: j.token, ver: same ? this.st.ver : 0, ws: j.ws, co: id }; this.persist();
    await this.reconcile(j, !same);
  },
  /* Take the cloud copy when it is newer (or belongs to a different company). */
  async reconcile(remote, force) {
    if (!force && Store.s.users.length && this.st.ver === remote.ver) { this.status = 'ok'; return false; }
    const j = await this.call({ action: 'pull', token: this.st.token });
    if (!j.state) return false;
    if (!force && Store.s.users.length) { try { await Backup.snapshot('before-cloud'); } catch (e) { /* ignore */ } }
    const lic = Store.s.license; Store.s = Object.assign(Store.blank(), j.state); if (lic && !Store.s.license) Store.s.license = lic;
    this.st.ver = j.ver; this.st.ws = j.ws; this.persist();
    this.adopting = true; Store.saveNow(); this.adopting = false;
    await Seed.ensure(); setFavicon(); Theme.apply(); document.title = Brand.appName(); this.status = 'ok'; this.lastSync = Date.now();
    return true;
  },
  async leave() { // switch company: forget this company on this computer
    await this.wipeLocal(); this.st = {}; try { localStorage.removeItem('crm_cloud'); } catch (e) { /* ignore */ }
    Store.s = Store.blank(); await Seed.ensure(); Auth.user = null; setFavicon(); document.title = Brand.appName(); App.showGate();
  },
  schedule() { if (this.adopting || !this.linked()) return; clearTimeout(this.timer); this.timer = setTimeout(() => { this.timer = null; this.push(); }, 2000); },
  async push() {
    if (!this.linked() || this.busy || !Store.s || !Store.s.users.length) return;
    this.busy = true; this.status = 'syncing';
    try {
      const j = await this.call({ action: 'push', token: this.st.token, ver: this.st.ver, state: Store.s });
      this.st.ver = j.ver; this.persist(); this.status = 'ok'; this.lastSync = Date.now();
    } catch (e) {
      if (e.status === 409) await this.conflict(e.data);
      else if (e.status === 401) { this.st.token = ''; this.persist(); this.status = 'expired'; toast('Company session expired. Please sign in to your company again.', 'warn', { timeout: 8000 }); }
      else if (e.status === 413) { this.status = 'error'; toast(e.message, 'warn'); }
      else this.status = 'offline';
    }
    this.busy = false; this.refreshChip();
  },
  /* Someone else saved first: keep a snapshot of this copy, then take the newer cloud copy. */
  async conflict(remote) {
    try {
      const me = Auth.user ? Auth.user.username : '';
      await this.reconcile({ ver: remote.ver, savedAt: remote.savedAt }, false);
      if (me) { Auth.user = Store.s.users.find((u) => u.username === me && u.status === 'active') || null; if (!Auth.user) return Auth.logout('account changed'); }
      toast('Newer data from another computer was loaded. Your previous copy is kept in Settings › Cloud & Data › Snapshots.', 'warn', { timeout: 8000 });
      Bus.emit('change', {});
    } catch (e) { this.status = 'offline'; }
  },
  async poll() {
    if (!this.linked() || this.busy || !Auth.user || Store.saveTimer || this.timer) return;
    try {
      const m = await this.call({ action: 'meta', token: this.st.token });
      if (m.ver !== this.st.ver) {
        const me = Auth.user.username;
        if (await this.reconcile(m, false)) { Auth.user = Store.s.users.find((u) => u.username === me && u.status === 'active') || null; if (!Auth.user) return Auth.logout('account changed on another computer'); Bus.emit('change', {}); toast('Updated with the latest data from the cloud.'); }
      }
      this.status = 'ok'; this.lastSync = Date.now();
    } catch (e) { this.status = e.status === 401 ? 'expired' : 'offline'; }
    this.refreshChip();
  },
  /* Document files: kept in the cloud, cached in this browser. */
  async putBlob(vid, blob) { if (!this.linked()) return; await this.call({ action: 'blob_put', token: this.st.token, vid, type: blob.type || '', data: Crypto.b64(await blob.arrayBuffer()) }); },
  async getBlob(vid) { if (!this.linked()) return null; const j = await this.call({ action: 'blob_get', token: this.st.token, vid }); return j && j.data ? new Blob([Crypto.unb64(j.data)], { type: j.type || '' }) : null; },
  delBlob(vid) { if (!this.linked()) return Promise.resolve(); return this.call({ action: 'blob_del', token: this.st.token, vid }); },
  maxFileMB() { return this.avail ? 3 : 10; },
  refreshChip() { const c = $('[data-cloud-chip]'); if (c) c.outerHTML = String(this.chip()); },
  chip() {
    const m = { ok: ['Saved in cloud', 'green'], syncing: ['Saving…', 'amber'], offline: ['Offline: will save later', 'amber'], expired: ['Sign in to company again', 'red'], error: ['Cloud error', 'red'], off: ['Not connected', 'grey'] }[this.status] || ['Not connected', 'grey'];
    return html`<span data-cloud-chip>${badge(m[0], m[1])}</span>`;
  },
  card() {
    return html`<div class="card"><div class="card-h"><h3>Cloud storage</h3>${this.chip()}</div><p>All data of <b>${this.company() || 'your company'}</b> is stored safely in the cloud. Open the app from your link on any computer, sign in with the company username and password, then with your own employee login.</p>${this.lastSync ? html`<p class="sm muted">Last synced ${timeAgo(this.lastSync)}</p>` : ''}<div class="row-acts" style="justify-content:flex-start">${btn('Sync now', 'cloud:now', { cls: 'sm primary' })}</div></div>`;
  }
};
act('cloud:now', async () => { Store.saveNow(); await Cloud.push(); toast(Cloud.status === 'ok' ? 'Saved to the cloud' : 'Could not sync right now', Cloud.status === 'ok' ? 'ok' : 'warn'); Router.refresh(); });
act('cloud:leave', async () => { if (await confirmDlg('Sign out of this company on this computer? Your data stays safe in the cloud.', { ok: 'Sign out of company' })) Cloud.leave(); });

/* ==========================================================================
   23-projects.js — Project Management
   Projects: linked to clients, have tasks, milestones, budget, status.
   ========================================================================== */

const Projects = {
  statusColors: { 'Planning': 'blue', 'Active': 'green', 'On Hold': 'amber', 'Completed': 'green', 'Cancelled': 'red' },
  statuses: ['Planning', 'Active', 'On Hold', 'Completed', 'Cancelled'],

  pct(p) {
    const tasks = Store.s.tasks.filter(t => t.projectId === p.id);
    if (!tasks.length) return 0;
    return Math.round(tasks.filter(t => Lists.isDone(t.status)).length / tasks.length * 100);
  },

  open(proj, preset = {}) {
    const isNew = !proj;
    const v = proj ? clone(proj) : Object.assign({
      name: '', clientId: '', status: 'Planning',
      start: today(), due: addDays(today(), 30),
      budget: 0, description: ''
    }, preset);

    formModal({
      title: isNew ? 'New Project' : `Edit: ${proj.name}`,
      size: 'lg', submit: isNew ? 'Create Project' : 'Save Changes',
      fields: [
        { name: 'name', label: 'Project Name', required: true, full: true },
        { name: 'clientId', label: 'Client', type: 'select', options: clientOpts, required: true },
        { name: 'status', label: 'Status', type: 'select', options: Projects.statuses.map(s => ({ value: s, label: s })), required: true },
        { name: 'start', label: 'Start Date', type: 'date', required: true },
        { name: 'due', label: 'Deadline', type: 'date', required: true, validate: (val, all) => val && all.start && val < all.start ? 'Deadline cannot be before start date' : '' },
        { name: 'budget', label: `Budget (${curCode()})`, type: 'money', min: 0 },
        { name: 'description', label: 'Description / Scope', type: 'textarea', full: true, rows: 3 },
      ],
      values: v,
      onSubmit: (vals) => {
        if (!Auth.canSeeClient(vals.clientId)) return { clientId: 'Choose one of your clients.' };
        if (isNew) {
          const rec = Rec.stamp(Object.assign({ id: uid('prj') }, vals), true);
          Store.commit(s => { rec.code = Store.next('prj'); s.projects.push(rec); });
          Auth.audit('create', 'projects', `Project ${rec.code} "${rec.name}" created`, { recordId: rec.id });
          toast(`${rec.code} created`);
          location.hash = '#/projects/' + rec.code;
        } else {
          const old = clone(proj);
          Store.commit(() => { Object.assign(proj, vals); Rec.stamp(proj); });
          Auth.audit('edit', 'projects', `Project ${proj.code} edited`, { recordId: proj.id, old, new: vals });
          toast('Project updated');
        }
      }
    });
  },

  card(p) {
    const c = DB.client(p.clientId) || {};
    const tasks = Store.s.tasks.filter(t => t.projectId === p.id);
    const done = tasks.filter(t => Lists.isDone(t.status)).length;
    const pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
    const isLate = p.due && p.status !== 'Completed' && p.status !== 'Cancelled' && p.due < today();
    return html`
      <div class="proj-card">
        <div class="proj-card-top">
          <div>
            <a href="#/projects/${p.code}" class="proj-name">${p.name}</a>
            <div class="proj-meta"><a href="#/clients/${c.code}" class="muted">${c.name || '—'}</a> · <code>${p.code}</code></div>
          </div>
          ${badge(p.status, Projects.statusColors[p.status] || 'blue')}
        </div>
        ${p.description ? html`<p class="proj-desc muted">${p.description}</p>` : ''}
        <div class="proj-stats">
          <span>${icon('tasks')}<b>${done}/${tasks.length}</b> tasks</span>
          ${p.budget ? html`<span>${icon('invoices')}<b>${money(p.budget)}</b> budget</span>` : ''}
          ${p.due ? html`<span class="${isLate ? 'late-txt' : ''}">${icon('compliance')}<b>${fmtDate(p.due)}</b></span>` : ''}
        </div>
        ${tasks.length ? html`<div class="proj-progress">${progress(pct, pct === 100 ? 'green' : isLate ? 'red' : 'blue')}<small>${pct}% complete</small></div>` : ''}
        <div class="row-acts">
          ${Auth.can('projects', 'edit') ? btn('', 'prj:edit', { id: p.id, icon: 'edit', cls: 'icon-btn sm', title: 'Edit' }) : ''}
          ${Auth.can('projects', 'delete') ? btn('', 'prj:del', { id: p.id, icon: 'trash', cls: 'icon-btn sm', title: 'Delete' }) : ''}
        </div>
      </div>`;
  }
};

/* ---- Add projects array to initial state ---- */
const _origLoad = Store.load;
Store.load = async function() {
  await _origLoad.call(this);
  if (!this.s.projects) Store.commit(s => { s.projects = []; });
};

/* ---- DB helpers ---- */
DB.project = (id) => (Store.s.projects || []).find(p => p.id === id);
DB.projectByCode = (code) => (Store.s.projects || []).find(p => p.code === code);

/* ---- Views ---- */
Views.projects = {
  perm: 'projects',
  onNew() { if (Auth.can('projects', 'create')) Projects.open(); },

  render(params) {
    if (!Store.s.projects) Store.commit(s => { s.projects = []; });
    if (params[0]) return this.detail(params[0]);
    const f = vs('projects', { status: '', client: '', q: '' });
    let rows = Auth.byClient ? Auth.byClient(Store.s.projects) : Store.s.projects;

    // Filter
    if (f.q) rows = rows.filter(p => {
      const c = DB.client(p.clientId) || {};
      return textMatch(f.q, p.name, p.code, c.name, c.code, p.description);
    });
    if (f.status) rows = rows.filter(p => p.status === f.status);
    if (f.client) rows = rows.filter(p => p.clientId === f.client);

    const counts = {};
    Projects.statuses.forEach(s => { counts[s] = (Store.s.projects || []).filter(p => p.status === s).length; });

    return html`
      ${pageHead('Projects', 'Manage all client projects and track progress',
        html`${Auth.can('projects', 'create') ? btn('New Project', 'prj:new', { cls: 'primary', icon: 'plus' }) : ''}`
      )}
      <div class="kpis sm4">
        <div class="kpi"><small>Total</small><b>${rows.length}</b></div>
        <div class="kpi"><small>Active</small><b>${counts['Active'] || 0}</b></div>
        <div class="kpi"><small>Completed</small><b>${counts['Completed'] || 0}</b></div>
        <div class="kpi ${counts['On Hold'] ? 'warn' : ''}"><small>On Hold</small><b>${counts['On Hold'] || 0}</b></div>
      </div>
      <div class="card filters">
        ${fInput('projects.q', 'Search project, client…')}
        ${fSelect('projects.status', 'All statuses', Projects.statuses.map(s => ({ value: s, label: s })))}
        ${fSelect('projects.client', 'All clients', clientOpts())}
      </div>
      ${rows.length
        ? html`<div class="proj-grid">${rows.map(p => Projects.card(p))}</div>`
        : emptyState('No projects found', 'Create your first project to get started.', Auth.can('projects', 'create') ? btn('New Project', 'prj:new', { cls: 'primary', icon: 'plus' }) : '')}`;
  },

  detail(code) {
    const p = DB.projectByCode(code);
    if (!p) return emptyState('Project not found');
    const c = DB.client(p.clientId) || {};
    const tasks = Store.s.tasks.filter(t => t.projectId === p.id);
    const done = tasks.filter(t => Lists.isDone(t.status)).length;
    const pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
    const isLate = p.due && p.status !== 'Completed' && p.status !== 'Cancelled' && p.due < today();
    const canEdit = Auth.can('projects', 'edit');

    return html`
      <div class="crumbs"><a href="#/projects">Projects</a> › ${p.name}</div>
      <div class="card">
        <div class="row-between wrap">
          <div>
            <h1>${p.name} ${badge(p.status, Projects.statusColors[p.status] || 'blue')}</h1>
            <p class="muted"><a href="#/clients/${c.code}">${c.code} · ${c.name}</a> · <code>${p.code}</code>
              · Start: ${fmtDate(p.start)} · Deadline: <span class="${isLate ? 'late-txt' : ''}">${fmtDate(p.due)}</span>
            </p>
          </div>
          <div class="row-acts">
            ${canEdit ? html`
              ${Projects.statuses.filter(s => s !== p.status).map(s =>
                s === 'Completed' || s === 'Active' || s === 'On Hold'
                  ? btn(s, 'prj:setstatus', { id: p.id, status: s, cls: 'ghost sm' }) : ''
              )}
            ` : ''}
            ${canEdit ? btn('Edit', 'prj:edit', { id: p.id, cls: 'ghost', icon: 'edit' }) : ''}
            ${Auth.can('projects', 'delete') ? btn('', 'prj:del', { id: p.id, icon: 'trash', cls: 'icon-btn danger-txt', title: 'Delete project' }) : ''}
          </div>
        </div>
      </div>

      <div class="grid-31">
        <div>
          <div class="card">
            <div class="row-between"><h3>Tasks (${done}/${tasks.length} done)</h3>
              ${Auth.can('tasks', 'create') ? btn('Add Task', 'prj:addtask', { id: p.id, cls: 'primary sm', icon: 'plus' }) : ''}
            </div>
            ${tasks.length ? html`
              ${progress(pct, pct === 100 ? 'green' : isLate ? 'red' : 'blue')}
              <p class="muted sm">${pct}% complete</p>
              <ul class="list">
                ${tasks.sort((a, b) => (a.due || '') > (b.due || '') ? 1 : -1).map(t => {
                  const late = DB.isOverdue(t);
                  return html`<li class="row-between">
                    <span>
                      <a href="#/tasks/${t.code}" class="${Lists.isDone(t.status) ? 'done-txt' : ''}">${t.code} · ${t.title}</a>
                      <br><small class="muted ${late ? 'late-txt' : ''}">${DB.memberName ? DB.memberName(t.assignedTo) : ''} · due ${fmtDate(t.due)}</small>
                    </span>
                    ${badge(Lists.name('taskStatuses', t.status) || t.status, late ? 'red' : Lists.isDone(t.status) ? 'green' : 'blue')}
                  </li>`;
                })}
              </ul>` : emptyState('No tasks yet', 'Add tasks to track work on this project.')}
          </div>
        </div>

        <div>
          <div class="card">
            <h3>Project Details</h3>
            <table class="meta-t">
              <tr><td>Status</td><td>${badge(p.status, Projects.statusColors[p.status] || 'blue')}</td></tr>
              <tr><td>Client</td><td><a href="#/clients/${c.code}">${c.name}</a></td></tr>
              <tr><td>Start</td><td>${fmtDate(p.start)}</td></tr>
              <tr><td>Deadline</td><td class="${isLate ? 'late-txt' : ''}">${fmtDate(p.due)}</td></tr>
              ${p.budget ? html`<tr><td>Budget</td><td><b>${money(p.budget)}</b></td></tr>` : ''}
              ${p.description ? html`<tr><td>Scope</td><td>${p.description}</td></tr>` : ''}
              <tr><td>Progress</td><td><b>${pct}%</b> (${done}/${tasks.length} tasks)</td></tr>
            </table>
          </div>
        </div>
      </div>`;
  }
};

/* ---- Actions ---- */
act('prj:new', (a) => Projects.open(null, a.dataset.client ? { clientId: a.dataset.client } : {}));
act('prj:edit', (a) => { const p = DB.project(a.dataset.id); if (p) Projects.open(p); });
act('prj:setstatus', (a) => {
  const p = DB.project(a.dataset.id);
  if (!p) return;
  Store.commit(() => { p.status = a.dataset.status; Rec.stamp(p); });
  Auth.audit('edit', 'projects', `Project ${p.code} status → ${p.status}`, { recordId: p.id });
  toast(`Status: ${p.status}`);
});
act('prj:addtask', (a) => {
  const p = DB.project(a.dataset.id);
  if (!p) return;
  Tasks.open(null, { clientId: p.clientId, projectId: p.id });
});
act('prj:del', async (a) => {
  const p = DB.project(a.dataset.id);
  if (!p) return;
  const taskCount = Store.s.tasks.filter(t => t.projectId === p.id).length;
  if (!(await confirmDlg(html`Delete project <b>${p.name}</b>${taskCount ? html` (${taskCount} linked task(s) will be unlinked)` : ''}?`, { danger: true, ok: 'Delete' }))) return;
  const idx = Store.s.projects.indexOf(p);
  Store.commit(s => {
    s.tasks.forEach(t => { if (t.projectId === p.id) delete t.projectId; });
    s.projects.splice(idx, 1);
  });
  Auth.audit('delete', 'projects', `Deleted project ${p.code} "${p.name}"`, { recordId: p.id });
  location.hash = '#/projects';
  toast(`Project "${p.name}" deleted`);
});

/* ==========================================================================
   99-boot.js — First-run defaults (generic Master Lists, roles, settings) and
   app start. The first-run Setup Wizard (21-setup.js) creates the company
   profile and the administrator account. Starts EMPTY: no sample data.
   ========================================================================== */
const Seed = {
  L(prefix, names, extra = {}) { return names.map((n, i) => Object.assign({ id: `${prefix}_${i + 1}`, name: Array.isArray(n) ? n[0] : n }, Array.isArray(n) ? n[1] : {}, extra[i] || {})); },
  lists() {
    const C = SERIES;
    return {
      services: [],
      businessTypes: this.L('bt', ['Individual', 'Small Business', 'Company', 'Partnership', 'Non-profit / NGO', 'Government', 'Other']),
      designations: this.L('des', ['Owner / Director', 'Manager', 'Team Lead', 'Executive', 'Associate', 'Intern', 'Office Manager']),
      departments: this.L('dep', ['Management', 'Sales', 'Operations', 'Accounts', 'Support', 'IT', 'Administration']),
      taskStatuses: this.L('ts', [['To Do', { color: '#6b7280' }], ['In Progress', { color: '#2a78d6' }], ['Waiting on Client', { color: '#eda100' }], ['Under Review', { color: '#6250d6' }], ['Completed', { color: '#1baf7a', done: true }]]),
      priorities: this.L('pr', [['Low', { color: '#6b7280' }], ['Medium', { color: '#2a78d6' }], ['High', { color: '#eb6834' }], ['Urgent', { color: '#d62828' }]]),
      docCategories: this.L('dc', ['ID / Identity', 'Contract', 'Agreement', 'Proposal / Quote', 'Invoice', 'Report', 'Certificate', 'Bank Statement', 'Other'], {}).map((x, i) => Object.assign(x, { color: C[i % 8] })),
      portals: this.L('pt', [['Email Account', { url: '' }], ['Website / Hosting', { url: '' }], ['Bank Portal', { url: '' }], ['Social Media', { url: '' }], ['Government Portal', { url: '' }], ['Software / SaaS', { url: '' }], ['Other', { url: '' }]]),
      branches: this.L('br', ['Head Office']),
      clientStatuses: this.L('cs', [['Active', { color: '#1baf7a' }], ['Lead / Prospect', { color: '#2a78d6' }], ['On Hold', { color: '#eda100' }], ['Inactive', { color: '#6b7280' }]]),
      paymentMethods: this.L('pm', ['Cash', 'Bank Transfer', 'Cheque', 'Card', 'Online Payment']),
      expenseCategories: this.L('ec', ['Salaries', 'Office Rent', 'Utilities', 'Internet & Phone', 'Stationery', 'Software', 'Transport', 'Marketing', 'Miscellaneous']),
      tags: this.L('tg', [['VIP', { color: '#d62828' }], ['Retainer', { color: '#2a78d6' }], ['Referral', { color: '#6250d6' }], ['New', { color: '#1baf7a' }]]),
      serviceStatuses: this.L('ss', [['Not Started', { color: '#6b7280' }], ['In Progress', { color: '#2a78d6' }], ['Completed', { color: '#1baf7a' }], ['On Hold', { color: '#eda100' }], ['Cancelled', { color: '#9a9a9a' }]]),
      staffStatuses: this.L('st', [['Active', { color: '#1baf7a' }], ['On Leave', { color: '#eda100' }], ['Inactive', { color: '#6b7280' }]]),
      authorities: this.L('au', [['General', { color: '#2a78d6' }], ['Legal', { color: '#6250d6' }], ['Finance', { color: '#1baf7a' }], ['Client', { color: '#eb6834' }], ['Internal', { color: '#6b7280' }]])
    };
  },
  perms(spec) { const p = {}; Object.entries(spec).forEach(([m, s]) => { p[m] = { view: s.includes('v'), create: s.includes('c'), edit: s.includes('e'), delete: s.includes('d'), export: s.includes('x') }; }); return p; },
  roles() {
    const all = 'vcedx';
    return [
      { id: 'role_super', name: 'Super Admin', system: true, all: true, scope: 'all', perms: {} },
      { id: 'role_admin', name: 'Admin', system: true, scope: 'all', perms: this.perms({ dashboard: 'v', clients: all, vault: all, team: all, tasks: all, services: all, compliance: all, invoices: all, projects: all, documents: all, reports: 'vx', settings: 'vex', users: 'vce', audit: 'vx' }) },
      { id: 'role_staff', name: 'Staff (own clients)', system: true, scope: 'assigned', perms: this.perms({ dashboard: 'v', clients: 'vce', vault: 'vce', team: 'v', tasks: 'vce', services: 'vce', compliance: 'v', projects: 'vce', documents: 'vce', reports: 'vx' }) },
      { id: 'role_acc', name: 'Accounts', system: true, scope: 'all', perms: this.perms({ dashboard: 'v', clients: 'v', tasks: 'v', services: 'v', invoices: 'vcedx', projects: 'v', documents: 'vc', reports: 'vx' }) },
      { id: 'role_view', name: 'Viewer', system: true, scope: 'all', perms: this.perms({ dashboard: 'v', clients: 'v', team: 'v', tasks: 'v', services: 'v', compliance: 'v', projects: 'v', documents: 'v', reports: 'v' }) }
    ];
  },
  settings() {
    return {
      defaultSkin: 'ocean', prefixes: { task: 'TSK-', emp: 'EMP-', inv: 'INV-', doc: 'DOC-', rcpt: 'RCPT-', exp: 'EXP-', prj: 'PRJ-' },
      company: { name: '', phone: '', email: '', website: '', address: '', ntn: '', industry: '', country: '', invoiceFooter: 'Thank you for your business.', terms: '', bank: '' },
      tcTemplates: [
        { id: 'tc_std', name: 'Standard', isDefault: true, text: '1. Payment is due by the due date shown on this invoice.\n2. Late payments may incur a 2% monthly surcharge.\n3. All prices are exclusive of applicable taxes unless stated.\n4. This invoice is subject to our standard terms of service.' },
        { id: 'tc_consult', name: 'Consulting / Retainer', isDefault: false, text: '1. Fees are due within 15 days of invoice date.\n2. Retainer fees are non-refundable once work has commenced.\n3. Additional work beyond agreed scope will be billed separately.\n4. Disputes must be raised within 7 days of invoice date.' },
        { id: 'tc_tax', name: 'Tax & Accounting', isDefault: false, text: '1. Payment is due within 30 days of invoice date.\n2. Documents required from the client must be provided in time. Delays caused by late submission will not be the responsibility of the firm.\n3. The firm shall not be liable for penalties arising from inaccurate information provided by the client.\n4. Confidentiality of all client information is maintained.' }
      ],
      currency: { code: 'USD', symbol: '$' },
      inactivityMin: 15, capacity: 15, filingDueDay: 18, defaultTaxPct: 0, invoiceDueDays: 15, maxUploadMB: 10,
      allowRegistration: false, requireApproval: true, registrationRole: 'role_view', browserNotify: false,
      templates: [
        { name: 'Document request', channel: 'whatsapp', subject: '', body: 'Hello {client},\n\nFor {task}, could you please share the required documents at your earliest convenience?\n\nThank you,\n{company} | {phone}' },
        { name: 'Deadline reminder', channel: 'whatsapp', subject: '', body: 'Dear {client} ({code}),\n\nA reminder that {task} is due on {due}. Please send any pending information so we can finish on time.\n\n{company} | {phone}' },
        { name: 'Payment reminder', channel: 'whatsapp', subject: '', body: 'Dear {client},\n\nA gentle reminder regarding payment for {task}. Please arrange it at your convenience.\n\n{company} | {phone}' },
        { name: 'Work completed', channel: 'whatsapp', subject: '', body: 'Dear {client},\n\nGood news! {task} has been completed. We will share the details shortly.\n\n{company}' },
        { name: 'Document request', channel: 'email', subject: 'Documents required: {task}', body: 'Dear {client},\n\nTo proceed with {task} (due {due}), please send us the required documents.\n\nKind regards,\n{officer}\n{company} | {phone} | {website}' },
        { name: 'Deadline reminder', channel: 'email', subject: 'Reminder: {task} due {due}', body: 'Dear {client},\n\nThis is a reminder that {task} is due on {due}.\n\nKind regards,\n{company}' }
      ],
      taskTemplates: []
    };
  },
  async ensure() {
    const s = Store.s;
    if (!s.users.length) {
      // Brand-new company: defaults only. The Setup Wizard creates the company profile and the admin user.
      if (!s.roles.length) Object.assign(s, { lists: this.lists(), roles: this.roles(), settings: this.settings(), compliance: [] });
      Store.saveNow();
      return;
    }
    // Upgrade safety: make sure every list key exists
    const L = this.lists(); Object.keys(L).forEach((k) => { if (!s.lists[k]) s.lists[k] = L[k]; });
    s.settings.prefixes = Object.assign({}, this.settings().prefixes, s.settings.prefixes || {});
    if (!s.settings.currency) s.settings.currency = { code: 'USD', symbol: '$' };
    if (!s.settings.setupDone) s.settings.setupDone = true;
    // Projects: ensure array exists for existing installs
    if (!s.projects) s.projects = [];
    // TC Templates: seed defaults for existing installs if none exist
    if (!s.settings.tcTemplates || !s.settings.tcTemplates.length) s.settings.tcTemplates = this.settings().tcTemplates;
  }
};
